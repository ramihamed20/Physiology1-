const CVS_CARDS = [
  {cat:'cvs',q:'What is the primary function of the heart?',a:'B — Pump blood through arteries, capillaries, and veins. The primary function of the heart is to pump blood through the arteries, capillaries, and veins.'},
  {cat:'cvs',q:'Approximately how many times will the heart contract in a person who lives to 80 years old?',a:'B — 3 billion times. The heart for the average human will contract about 3 billion times (~100,000 beats per day).'},
  {cat:'cvs',q:'How many miles of blood vessels are estimated to be found throughout an adult body?',a:'C — 60,000 miles. There is an estimated 60,000 miles of vessels throughout an adult body.'},
  {cat:'cvs',q:'The term \'cardiac\' comes from the Greek word \'kardia\', which means:',a:'C — Heart. The term cardiac comes from the Greek word kardia, meaning \'heart\'.'},
  {cat:'cvs',q:'What type of muscle tissue is the heart composed of?',a:'C — Cardiac muscle. The heart is composed of cardiac muscle, an involuntary muscle tissue found only within this organ.'},
  {cat:'cvs',q:'Unlike skeletal muscle, cardiac muscle is described as \'self-exciting\' because:',a:'B — It has its own conduction system. Cardiac muscle is self-exciting, meaning it has its own conduction system. Skeletal muscle requires conscious or reflex nervous stimuli.'},
  {cat:'cvs',q:'What is the myocardium?',a:'B — The muscular tissue of the heart. The myocardium is composed of specialized cardiac muscle cells.'},
  {cat:'cvs',q:'What supplies blood to the myocardium?',a:'C — Coronary arteries. The blood to the myocardium is supplied by the coronary arteries.'},
  {cat:'cvs',q:'Occlusion of coronary arteries by atherosclerosis and/or thrombosis can lead to:',a:'B — Angina pectoris or myocardial infarction due to ischemia (lack of oxygen).'},
  {cat:'cvs',q:'Heart failure generally leads to all of the following EXCEPT:',a:'D — Increased cardiac output. Heart failure leads to fluid retention, edema, pulmonary edema, renal insufficiency, and hepatomegaly — NOT increased cardiac output.'},
  {cat:'cvs',q:'The pericardium serves what function?',a:'C — Protects and lubricates the heart. The pericardium is the thick, membranous sac that surrounds and protects the heart.'},
  {cat:'cvs',q:'The space between the two layers of the serous pericardium is called the:',a:'C — Pericardial cavity. The serous pericardium is divided into two layers; in between is the pericardial cavity.'},
  {cat:'cvs',q:'The Epicardium is described as:',a:'B — The visceral layer consisting of connective tissue next to the heart. It is the innermost layer directly on the heart surface.'},
  {cat:'cvs',q:'Which chambers of the heart have thicker walls and are much stronger?',a:'C — Ventricles. The atria are smaller with thin walls, while the ventricles are larger and much stronger.'},
  {cat:'cvs',q:'The right atrium receives deoxygenated blood from the:',a:'B — Superior and inferior vena cava. The right atrium receives de-oxygenated blood from both venae cavae.'},
  {cat:'cvs',q:'The left atrium receives oxygenated blood from the:',a:'C — Left and right pulmonary veins. The left atrium receives oxygenated blood from the pulmonary veins.'},
  {cat:'cvs',q:'Why does the left ventricle have thicker walls than the right ventricle?',a:'B — It needs to pump blood to the whole body (systemic circulation), creating higher blood pressure.'},
  {cat:'cvs',q:'The interventricular septum consists of which two parts?',a:'B — Muscular and membranous portions. The greater portion is thick and muscular; the upper/posterior thin fibrous part is the membranous ventricular septum.'},
  {cat:'cvs',q:'What is the function of the atrioventricular (AV) valves?',a:'B — Ensure blood flows from atria to ventricles only. They are one-way valves preventing reverse flow.'},
  {cat:'cvs',q:'The right AV valve is also called the tricuspid valve because:',a:'B — It has three flaps. The tricuspid valve has three cusps (flaps).'},
  {cat:'cvs',q:'The left AV valve is also called the mitral valve due to:',a:'B — Its resemblance to a bishop\'s mitre (a type of hat).'},
  {cat:'cvs',q:'The semilunar valves are located in the:',a:'B — Arteries leaving the heart. They prevent blood from flowing back into the ventricles.'},
  {cat:'cvs',q:'The sound heard in a heartbeat is produced by:',a:'B — Heart valves shutting. The \'lub-dub\' sound is caused by the closing of heart valves.'},
  {cat:'cvs',q:'What is the function of the subvalvular apparatus?',a:'B — Keep valves from prolapsing into the atria when they close. It does NOT control valve opening/closing.'},
  {cat:'cvs',q:'The opening and closing of the heart valves is caused entirely by:',a:'C — The pressure gradient across the valve. The subvalvular apparatus has no effect on opening and closing.'},
  {cat:'cvs',q:'During a heartbeat, both atria contract:',a:'B — Simultaneously with each other. Both atria contract at the same time and both ventricles contract at the same time.'},
  {cat:'cvs',q:'Blood flow after leaving the heart follows the sequence:',a:'B — Aorta → Arteries → Arterioles → Capillaries → Venules → Veins → Vena Cava.'},
  {cat:'cvs',q:'The SA node is located in the:',a:'C — Right atrium. The SA node is the natural pacemaker of the heart, located in the right atrium.'},
  {cat:'cvs',q:'Why does the AV node delay impulses by approximately 1/10 of a second?',a:'D — Both B and C. It allows the atria to contract and empty first, ensuring atria are closed before stimulating the ventricles.'},
  {cat:'cvs',q:'The Bundle of His is the only site where action potential can conduct from:',a:'B — Atria to ventricles. The bundle of His is the only conduction pathway between atria and ventricles.'},
  {cat:'cvs',q:'Purkinje fibres are located in the:',a:'C — Inner ventricular walls of the heart.'},
  {cat:'cvs',q:'The function of Purkinje fibres is to:',a:'C — Allow synchronized contractions of the ventricles. They conduct action potentials quickly and efficiently.'},
  {cat:'cvs',q:'Arteries differ from veins mainly because arteries:',a:'C — Carry blood away from the heart and have thick expandable walls.'},
  {cat:'cvs',q:'Which is the ONLY exception where an artery carries deoxygenated blood?',a:'C — Pulmonary artery. It carries deoxygenated blood from the right ventricle to the lungs.'},
  {cat:'cvs',q:'The three layers of the artery wall are (from inside to outside):',a:'B — Endothelium (inner), smooth muscle (middle), connective tissue (outer).'},
  {cat:'cvs',q:'An arteriole is best described as:',a:'B — A small artery that extends and leads to capillaries.'},
  {cat:'cvs',q:'When more arteriole vessels dilate, the effect on blood pressure is:',a:'C — Blood pressure decreases. The higher the number of vessels dilated, the lower the blood pressure.'},
  {cat:'cvs',q:'The walls of capillaries are composed of:',a:'C — A single layer of cells — the endothelium. So thin that O₂, water, and lipids can pass through by diffusion.'},
  {cat:'cvs',q:'The total surface area of capillaries in the body is approximately:',a:'B — 6,300 square meters. Capillaries are very prevalent in the body.'},
  {cat:'cvs',q:'The process by which capillary beds open and close according to need is called:',a:'B — Autoregulation. Capillary beds can be \'opened\' and \'closed\' at any given time based on need.'},
  {cat:'cvs',q:'Which type of capillary allows RBCs and serum proteins to enter?',a:'C — Sinusoidal capillaries. These are special fenestrated capillaries with larger openings, found in liver, bone marrow, and spleen.'},
  {cat:'cvs',q:'Approximately what percentage of blood volume is found in the venous system at any given time?',a:'C — 70%. Most of the blood volume is found in the venous system.'},
  {cat:'cvs',q:'Veins have low blood pressure and need the help of which structures to return blood to the heart?',a:'C — Skeletal muscles. Veins rely on skeletal muscle contractions to push blood back to the heart.'},
  {cat:'cvs',q:'The double circulatory system of blood flow refers to:',a:'B — Pulmonary and systemic circulation. These are two separate circulatory systems.'},
  {cat:'cvs',q:'How many times does blood circulate through the body every minute?',a:'B — Two to three times every minute.'},
  {cat:'cvs',q:'In the pulmonary circuit, blood is pumped to the lungs from the:',a:'C — Right ventricle. The right ventricle pumps blood through the pulmonary circuit.'},
  {cat:'cvs',q:'The aorta is classified as what type of artery?',a:'B — Elastic artery. It distends when the left ventricle contracts, then contracts passively during diastole to maintain blood pressure.'},
  {cat:'cvs',q:'The Superior Vena Cava (SVC) is formed by the:',a:'B — Left and right brachiocephalic (innominate) veins, which receive blood from the upper limbs, head, and neck.'},
  {cat:'cvs',q:'The Inferior Vena Cava (IVC) is formed by the:',a:'C — Left and right common iliac veins.'},
  {cat:'cvs',q:'Coronary arteries are classified as \'end circulation\' because:',a:'B — They represent the only source of blood supply to the myocardium with very little redundant supply.'},
  {cat:'cvs',q:'Heart rate is calculated as the number of contractions per minute and is normally expressed as:',a:'B — Beats per minute (bpm).'},
  {cat:'cvs',q:'The normal resting heart rate for an adult male is approximately:',a:'B — 70 bpm. Adult females average ~75 bpm.'},
  {cat:'cvs',q:'A heart rate below 60 bpm is termed:',a:'C — Bradycardia. Above 100 bpm is tachycardia.'},
  {cat:'cvs',q:'Every single \'beat\' of the heart involves which three major stages?',a:'C — Atrial systole, ventricular systole, and complete cardiac diastole.'},
  {cat:'cvs',q:'In the ECG (EKG), the QRS complex indicates:',a:'C — Ventricles are electrically stimulated to pump blood out.'},
  {cat:'cvs',q:'The T wave on an ECG indicates:',a:'C — The recovery period of the ventricles (ventricular repolarization).'},
  {cat:'cvs',q:'Cardiac muscle contraction ends when:',a:'B — Cytosolic calcium returns to normal resting levels.'},
  {cat:'cvs',q:'The sequence of cardiac muscle contraction involves calcium-induced calcium release. This means:',a:'B — Calcium binding to SR receptors triggers release of more calcium from the SR, amplifying the contraction signal.'},
  {cat:'cvs',q:'Normal blood pressure for a resting, healthy adult is approximately:',a:'C — 120/80 mm Hg. 120 = systolic (peak); 80 = diastolic (resting).'},
  {cat:'cvs',q:'Cardiovascular disease is the leading cause of death and disability in:',a:'B — The United States and most European countries.'},
  {cat:'cvs',q:'Atherosclerosis is best described as:',a:'B — Hardening or furring of the arteries due to formation of multiple plaques within the arteries.'},
  {cat:'cvs',q:'Plaque (Atheroma) is defined as:',a:'B — An abnormal inflammatory accumulation of macrophage white blood cells within artery walls.'},
  {cat:'cvs',q:'A thrombus is the final product of blood coagulation and is formed via:',a:'B — Platelet aggregation and activation of the humoral coagulation system (clotting factors).'},
  {cat:'cvs',q:'Approximately what percentage of strokes are ischemic in origin?',a:'C — 85-90%. A blood vessel becomes occluded, partially or totally blocking blood supply to part of the brain.'},
  {cat:'cvs',q:'The heart will contract approximately 100,000 times per day in a person who lives to be 80 years old.',a:'TRUE — If a person lives to 80, the heart beats an average of 100,000 times per day.'},
  {cat:'cvs',q:'The heart begins supplying the body with nutrients after birth.',a:'FALSE — Within weeks of conception the heart starts supplying the body with nutrients, even before birth.'},
  {cat:'cvs',q:'Cardiac muscle is an involuntary muscle tissue found only within the heart.',a:'TRUE — The heart is composed of cardiac muscle, an involuntary muscle tissue found only within this organ.'},
  {cat:'cvs',q:'Skeletal muscle is self-exciting and has its own conduction system.',a:'FALSE — CARDIAC muscle is self-exciting with its own conduction system. Skeletal muscle requires conscious or reflex nervous stimuli.'},
  {cat:'cvs',q:'The heart is a four-chambered, double pump located in the thoracic cavity between the lungs.',a:'TRUE — It is a four-chambered, double pump in the thoracic cavity between the lungs.'},
  {cat:'cvs',q:'The myocardium can conduct electricity just like nerve cells.',a:'TRUE — Cardiac muscle can both contract AND conduct electricity, like nerves.'},
  {cat:'cvs',q:'The fibrous pericardium is the innermost layer of the pericardium.',a:'FALSE — The fibrous pericardium is the OUTER layer. The innermost layer is the visceral layer (Epicardium).'},
  {cat:'cvs',q:'The pericardial cavity lies between the two layers of the serous pericardium.',a:'TRUE — The pericardial cavity is the space between the two layers of the serous pericardium.'},
  {cat:'cvs',q:'Both atria are larger and have stronger walls than the ventricles.',a:'FALSE — The atria are SMALLER with thin walls. The ventricles are larger and much stronger.'},
  {cat:'cvs',q:'The right atrium holds blood that has been oxygenated and is ready to be sent to the body.',a:'FALSE — The RIGHT atrium holds DEOXYGENATED blood. The LEFT atrium holds oxygenated blood.'},
  {cat:'cvs',q:'The tricuspid valve has three flaps and is located between the right atrium and right ventricle.',a:'TRUE — The tricuspid valve has three flaps and sits between the right atrium and right ventricle.'},
  {cat:'cvs',q:'The bicuspid (mitral) valve has two flaps because there is less strain and pressure on the left side of the heart.',a:'FALSE — The mitral valve has two flaps because the LEFT side has MORE strain and pressure. Two cusps means less to go wrong.'},
  {cat:'cvs',q:'The subvalvular apparatus controls the opening and closing of the heart valves.',a:'FALSE — The subvalvular apparatus has NO effect on opening and closing. This is caused entirely by the pressure gradient.'},
  {cat:'cvs',q:'The semilunar valves prevent blood from flowing back into the ventricles from the arteries.',a:'TRUE — The semilunar valves sit in the arteries leaving the heart and prevent backflow into the ventricles.'},
  {cat:'cvs',q:'The right ventricle pumps blood into the systemic circulation for the rest of the body.',a:'FALSE — The RIGHT ventricle pumps blood into the PULMONARY circulation (to the lungs). The LEFT ventricle pumps to the systemic circulation.'},
  {cat:'cvs',q:'Blood flow through the heart shows that both atria and both ventricles each contract at the same time as each other.',a:'TRUE — Both atria contract simultaneously, and both ventricles contract simultaneously.'},
  {cat:'cvs',q:'The SA node is the natural pacemaker of the heart and is located in the left atrium.',a:'FALSE — The SA node is in the RIGHT atrium, not the left.'},
  {cat:'cvs',q:'During atrial contraction, approximately 100 million myocardial cells contract in less than one third of a second.',a:'TRUE — Atrial contraction is so rapid that ~100 million myocardial cells contract in less than one third of a second.'},
  {cat:'cvs',q:'The AV node is located near the top of the right atrium.',a:'FALSE — The AV node lies on the right side of the partition dividing the atria, near the BOTTOM of the right atrium.'},
  {cat:'cvs',q:'The Bundle of His is the only site where action potentials can conduct from the atria to the ventricles.',a:'TRUE — The bundle of His is the ONLY site for conduction from atria to ventricles.'},
  {cat:'cvs',q:'Purkinje fibres conduct cardiac action potentials more slowly than any other cells in the heart.',a:'FALSE — Purkinje fibres conduct action potentials more QUICKLY and efficiently than any other cells in the heart.'},
  {cat:'cvs',q:'Arteries have three layers: endothelium (inside), smooth muscle (middle), and connective tissue (outside).',a:'TRUE — Arteries have three layers: endothelium (inner), smooth muscle (middle), connective tissue (outer).'},
  {cat:'cvs',q:'The pulmonary artery carries oxygenated blood from the heart to the lungs.',a:'FALSE — The pulmonary artery is the exception — it carries DEOXYGENATED blood to the lungs.'},
  {cat:'cvs',q:'Arterioles can contract to cause vasoconstriction and relax to cause vasodilation, thereby affecting blood pressure.',a:'TRUE — Arterioles have thick smooth muscle walls that contract (vasoconstriction) and relax (vasodilation), directly affecting blood pressure.'},
  {cat:'cvs',q:'Capillary beds normally carry about 50% of the blood they could hold at any time.',a:'FALSE — Capillary beds usually carry no more than 25% of the blood they could hold at any time.'},
  {cat:'cvs',q:'The pulmonary vein is the only exception to veins carrying deoxygenated blood — it carries oxygenated blood.',a:'TRUE — Veins normally carry deoxygenated blood. The pulmonary vein is the exception, carrying oxygenated blood from lungs to left atrium.'},
  {cat:'cvs',q:'Continuous capillaries allow RBCs and large proteins to pass freely through their walls.',a:'FALSE — CONTINUOUS capillaries have a sealed epithelium and only allow small molecules. SINUSOIDAL capillaries allow RBCs and serum proteins.'},
  {cat:'cvs',q:'Veins have one-way valves called venous valves to prevent backflow caused by gravity.',a:'TRUE — Most veins have one-way venous valves to prevent backflow caused by gravity.'},
  {cat:'cvs',q:'The double circulatory system is found in fishes, which have two separate circulation systems.',a:'FALSE — Fishes have a SINGLE circulation system. The double circulatory system is found in amphibians, birds, and mammals (including humans).'},
  {cat:'cvs',q:'In the pulmonary circuit, oxygen in the alveolae diffuses to the capillaries surrounding the alveolae.',a:'TRUE — O₂ in alveolae diffuses to surrounding capillaries; CO₂ diffuses from blood into alveolae.'},
  {cat:'cvs',q:'The aorta passively contracts during diastole to help maintain blood pressure.',a:'TRUE — The aorta expands during systole storing potential energy, then contracts passively during diastole to maintain blood pressure.'},
  {cat:'cvs',q:'The Superior Vena Cava carries deoxygenated blood from the lower half of the body to the heart.',a:'FALSE — The SVC carries blood from the UPPER half of the body. The IVC carries blood from the lower half.'},
  {cat:'cvs',q:'The Inferior Vena Cava runs along the right side of the vertebral column.',a:'TRUE — The IVC is posterior to the abdominal cavity and runs along the right side of the vertebral column.'},
  {cat:'cvs',q:'The coronary arteries on the surface of the heart are called epicardial coronary arteries.',a:'TRUE — The coronary arteries running on the surface of the heart are called epicardial coronary arteries.'},
  {cat:'cvs',q:'The left coronary artery originates from the right aortic sinus.',a:'FALSE — The LEFT coronary artery originates from the LEFT aortic sinus. The right coronary artery originates from the right aortic sinus.'},
  {cat:'cvs',q:'Four percent of people have a third, posterior coronary artery.',a:'TRUE — Four percent of people have a third, the posterior coronary artery.'},
  {cat:'cvs',q:'Normal resting heart rate for an adult female is approximately 75 bpm.',a:'TRUE — Adult males average ~70 bpm; adult females average ~75 bpm at rest.'},
  {cat:'cvs',q:'Athletes typically have a significantly higher resting heart rate than the general population.',a:'FALSE — Athletes typically have LOWER resting heart rates. Higher resting rates are seen in obese individuals.'},
  {cat:'cvs',q:'Systole is the relaxation phase of the cardiac cycle when the heart refills with blood.',a:'FALSE — Systole is the CONTRACTION phase. Diastole is the relaxation/refilling phase.'},
  {cat:'cvs',q:'The P wave on an ECG indicates that the atria are electrically stimulated to pump blood into the ventricles.',a:'TRUE — The P wave represents atrial depolarization (stimulation to pump blood into the ventricles).'},
  {cat:'cvs',q:'The EKG is an invasive, expensive test that requires general anesthesia.',a:'FALSE — EKGs are inexpensive, non-invasive, quick, and painless.'},
  {cat:'cvs',q:'In cardiac muscle contraction, calcium is released from the sarcoplasmic reticulum and binds to troponin to allow actin-myosin interaction.',a:'TRUE — Ca²⁺ from the SR binds troponin, allowing actin to bind with myosin, causing contraction.'},
  {cat:'cvs',q:'The mechanism unique to cardiac muscle (not skeletal) is that action potential opens voltage-gated calcium channels in T-tubules.',a:'TRUE — This triggers calcium-induced calcium release — a mechanism unique to cardiac muscle.'},
  {cat:'cvs',q:'Systolic pressure is defined as the lowest pressure during the resting phase of the cardiac cycle.',a:'FALSE — Systolic pressure is the PEAK pressure during contraction. Diastolic is the LOWEST pressure at rest.'},
  {cat:'cvs',q:'Normal systolic blood pressure for a resting healthy adult is approximately 120 mm Hg.',a:'TRUE — Normal systolic = 120 mm Hg; diastolic = 80 mm Hg.'},
  {cat:'cvs',q:'Blood pressure is measured in liters per minute.',a:'FALSE — Blood pressure is measured in millimeters of mercury (mm Hg).'},
  {cat:'cvs',q:'Atherosclerosis typically begins in early adolescence but is usually asymptomatic and not detected by most diagnostic methods during life.',a:'TRUE — Atherosclerosis typically begins in early adolescence but remains asymptomatic and undetected for decades.'},
  {cat:'cvs',q:'Hypertension is a risk factor for strokes, heart attacks, heart failure, arterial aneurysm, and chronic renal failure.',a:'TRUE — Persistent hypertension is a risk factor for all of these conditions.'},
  {cat:'cvs',q:'A thrombus is physiologic (normal) in cases of injury.',a:'TRUE — A thrombus is physiologic in injury (normal clotting) but pathologic in thrombosis (disease).'},
  {cat:'cvs',q:'Heparin and warfarin are used to promote the formation of blood clots.',a:'FALSE — Heparin and warfarin INHIBIT the formation and growth of blood clots, allowing the body to dissolve them.'},
  {cat:'cvs',q:'An embolism occurs when an embolus migrates through circulation and causes blockage of a blood vessel in another part of the body.',a:'TRUE — An embolism occurs when an object (embolus) migrates and causes blockage of a vessel elsewhere.'},
  {cat:'cvs',q:'Blood clots are the most common embolic material.',a:'TRUE — Blood clots are by far the most common embolic material.'},
  {cat:'cvs',q:'Hemorrhagic stroke is less dangerous than ischemic stroke because the bleeding is usually minor.',a:'FALSE — Hemorrhagic strokes are MORE dangerous because blood irritates brain tissue, disrupts chemical balance, and may increase intracranial pressure.'},
  {cat:'cvs',q:'Ischemic stroke accounts for approximately 85-90% of all strokes.',a:'TRUE — Ischemic stroke (blood vessel occluded) accounts for ~85-90% of all strokes.'},
  {cat:'cvs',q:'A heart attack occurs when the supply of blood and oxygen to an area of heart muscle is blocked, usually by a clot in a coronary artery.',a:'TRUE — A heart attack (AMI) occurs when blood and oxygen supply is blocked, usually by a coronary artery clot.'},
  {cat:'cvs',q:'If a heart attack blockage is not treated within a few hours, the affected heart muscle will die and be replaced by scar tissue.',a:'TRUE — Untreated blockage causes the affected heart muscle to die and be replaced by scar tissue.'},
  {cat:'cvs',q:'Angina pectoris is chest pain caused by excessive blood flow to the heart muscle.',a:'FALSE — Angina pectoris is caused by ISCHEMIA (LACK of blood and oxygen), not excessive flow — usually from coronary obstruction or spasm.'},
  {cat:'cvs',q:'The heart attack (AMI) is the leading cause of death for both men and women all over the world.',a:'TRUE — Heart attack is the leading cause of death for both men and women worldwide.'},
  {cat:'cvs',q:'Arteriosclerosis results from deposition of tough, rigid collagen inside the vessel wall, increasing stiffness and decreasing elasticity.',a:'TRUE — Arteriosclerosis results from collagen deposition around the atheroma, increasing stiffness and decreasing elasticity.'},
  {cat:'cvs',q:'A stroke (CVA) is always caused by a ruptured blood vessel in the brain.',a:'FALSE — A stroke can be ISCHEMIC (vessel occluded, ~85-90%) or hemorrhagic (vessel ruptures). Most are ischemic, not hemorrhagic.'},
];

  {type:'mcq',q:'What is the primary function of the heart?',opts:['Filter blood through the kidneys','Pump blood through arteries, capillaries, and veins','Produce red blood cells','Regulate body temperature'],ans:1,exp:'The primary function of the heart is to pump blood through the arteries, capillaries, and veins.'},
  {type:'mcq',q:'Approximately how many times will the heart contract in a person who lives to 80 years old?',opts:['1 billion times','3 billion times','10 billion times','100 million times'],ans:1,exp:'The heart for the average human will contract about 3 billion times (~100,000 beats per day).'},
  {type:'mcq',q:'How many miles of blood vessels are estimated to be found throughout an adult body?',opts:['6,000 miles','30,000 miles','60,000 miles','100,000 miles'],ans:2,exp:'There is an estimated 60,000 miles of vessels throughout an adult body.'},
  {type:'mcq',q:'The term \'cardiac\' comes from the Greek word \'kardia\', which means:',opts:['Muscle','Blood','Heart','Pump'],ans:2,exp:'The term cardiac comes from the Greek word kardia, meaning \'heart\'.'},
  {type:'mcq',q:'What type of muscle tissue is the heart composed of?',opts:['Smooth muscle','Skeletal muscle','Cardiac muscle','Voluntary muscle'],ans:2,exp:'The heart is composed of cardiac muscle, an involuntary muscle tissue found only within this organ.'},
  {type:'mcq',q:'Unlike skeletal muscle, cardiac muscle is described as \'self-exciting\' because:',opts:['It never gets tired','It has its own conduction system','It is under voluntary control','It can regenerate after injury'],ans:1,exp:'Cardiac muscle is self-exciting, meaning it has its own conduction system. Skeletal muscle requires conscious or reflex nervous stimuli.'},
  {type:'mcq',q:'What is the myocardium?',opts:['The outer lining of the heart','The muscular tissue of the heart','The inner chamber of the heart','The valve system of the heart'],ans:1,exp:'The myocardium is the muscular tissue of the heart, composed of specialized cardiac muscle cells.'},
  {type:'mcq',q:'What supplies blood to the myocardium?',opts:['Pulmonary arteries','Superior vena cava','Coronary arteries','Aortic branches'],ans:2,exp:'Blood to the myocardium is supplied by the coronary arteries.'},
  {type:'mcq',q:'Occlusion of coronary arteries by atherosclerosis and/or thrombosis can lead to:',opts:['Hypertension and edema','Angina pectoris or myocardial infarction due to ischemia','Pulmonary embolism','Ventricular fibrillation only'],ans:1,exp:'Occlusion of coronary arteries can lead to angina pectoris or myocardial infarction due to ischemia (lack of oxygen).'},
  {type:'mcq',q:'Heart failure generally leads to all of the following EXCEPT:',opts:['Fluid retention and edema','Renal insufficiency','Hepatomegaly','Increased cardiac output'],ans:3,exp:'Heart failure leads to fluid retention, edema, renal insufficiency, and hepatomegaly — NOT increased cardiac output.'},
  {type:'mcq',q:'The pericardium serves what function?',opts:['Contracts to pump blood','Produces cardiac hormones','Protects and lubricates the heart','Conducts electrical impulses'],ans:2,exp:'The pericardium is the thick, membranous sac that surrounds the heart — it protects and lubricates the heart.'},
  {type:'mcq',q:'The space between the two layers of the serous pericardium is called the:',opts:['Pleural cavity','Mediastinum','Pericardial cavity','Epicardial space'],ans:2,exp:'The serous pericardium is divided into two layers; in between is the pericardial cavity.'},
  {type:'mcq',q:'The Epicardium is described as:',opts:['The outermost fibrous layer','The visceral layer consisting of connective tissue next to the heart','The middle muscular layer','The inner lining of the heart chambers'],ans:1,exp:'The epicardium is the visceral (innermost) layer of the serous pericardium, consisting of connective tissue directly on the heart surface.'},
  {type:'mcq',q:'Which chambers of the heart have thicker walls and are much stronger?',opts:['Both atria','Right atrium only','Ventricles','Left atrium only'],ans:2,exp:'The atria are smaller with thin walls, while the ventricles are larger and much stronger.'},
  {type:'mcq',q:'The right atrium receives deoxygenated blood from the:',opts:['Left and right pulmonary veins','Superior and inferior vena cava','Aorta','Coronary arteries'],ans:1,exp:'The right atrium receives de-oxygenated blood from the superior vena cava and inferior vena cava.'},
  {type:'mcq',q:'The left atrium receives oxygenated blood from the:',opts:['Superior vena cava','Aorta','Left and right pulmonary veins','Pulmonary trunk'],ans:2,exp:'The left atrium receives oxygenated blood from the left and right pulmonary veins.'},
  {type:'mcq',q:'Why does the left ventricle have thicker walls than the right ventricle?',opts:['It receives more blood','It needs to pump blood to the whole body','It contains more valves','It beats more frequently'],ans:1,exp:'The left ventricle has thicker walls because it pumps blood to the whole body (systemic circulation), creating higher blood pressure.'},
  {type:'mcq',q:'The interventricular septum consists of which two parts?',opts:['Fibrous and elastic portions','Muscular and membranous portions','Endocardial and epicardial portions','Superior and inferior portions'],ans:1,exp:'The greater portion is thick and muscular; the upper/posterior thin fibrous part is the membranous ventricular septum.'},
  {type:'mcq',q:'What is the function of the atrioventricular (AV) valves?',opts:['Prevent backflow into ventricles from arteries','Ensure blood flows from atria to ventricles only','Regulate heart rate','Control coronary blood flow'],ans:1,exp:'The two AV valves are one-way valves ensuring blood flows from the atria to the ventricles, and not the other way.'},
  {type:'mcq',q:'The right AV valve is also called the tricuspid valve because:',opts:['It has three openings','It has three flaps','It is found in three chambers','It controls three blood vessels'],ans:1,exp:'The right AV valve is called the tricuspid valve because it has three flaps (cusps).'},
  {type:'mcq',q:'The left AV valve is also called the mitral valve due to:',opts:['Its location in the left atrium','Its resemblance to a bishop\'s mitre (a type of hat)','Its two papillary muscles','Its crescent shape'],ans:1,exp:'The left AV valve is known as the mitral valve due to its resemblance to a bishop\'s mitre.'},
  {type:'mcq',q:'The semilunar valves are located in the:',opts:['Between atria and ventricles','Arteries leaving the heart','Coronary arteries','Walls of the ventricles'],ans:1,exp:'The two semilunar valves are present in the arteries leaving the heart; they prevent backflow into the ventricles.'},
  {type:'mcq',q:'The sound heard in a heartbeat is produced by:',opts:['Blood rushing through vessels','Heart valves shutting','Cardiac muscle contracting','Papillary muscles tensing'],ans:1,exp:'The sound heard in a heartbeat is the heart valves shutting.'},
  {type:'mcq',q:'What is the function of the subvalvular apparatus?',opts:['Open and close the valves','Keep valves from prolapsing into the atria when they close','Conduct electrical impulses','Supply blood to the valves'],ans:1,exp:'The subvalvular apparatus keeps the valves from prolapsing into the atria when they close. It does NOT control valve opening/closing.'},
  {type:'mcq',q:'The opening and closing of the heart valves is caused entirely by:',opts:['The subvalvular apparatus','Papillary muscle contractions','The pressure gradient across the valve','The SA node impulses'],ans:2,exp:'Opening and closing is caused entirely by the pressure gradient across the valve — not by the subvalvular apparatus.'},
  {type:'mcq',q:'During a heartbeat, both atria contract:',opts:['Alternately with the ventricles','Simultaneously with each other','Independently of each other','Only during diastole'],ans:1,exp:'Both atria contract at the same time, and both ventricles contract at the same time.'},
  {type:'mcq',q:'Blood flow after leaving the heart follows the sequence:',opts:['Aorta → Veins → Capillaries → Arteries','Aorta → Arteries → Arterioles → Capillaries → Venules → Veins → Vena Cava','Vena Cava → Arteries → Capillaries → Veins','Arteries → Aorta → Arterioles → Capillaries'],ans:1,exp:'The correct sequence: Aorta → Arteries → Arterioles → Capillaries → Venules → Veins → Vena Cava.'},
  {type:'mcq',q:'The SA node is located in the:',opts:['Left ventricle','Interventricular septum','Right atrium','AV bundle'],ans:2,exp:'The SA node is the natural pacemaker of the heart, located in the right atrium.'},
  {type:'mcq',q:'Why does the AV node delay impulses by approximately 1/10 of a second?',opts:['To slow the heart rate','To allow the atria to contract and empty their contents first','To allow the ventricles to fill with blood before firing','Both B and C'],ans:3,exp:'The AV node delay allows the atria to contract and empty first, and ensures atria are closed before stimulating the ventricles.'},
  {type:'mcq',q:'The Bundle of His is the only site where action potential can conduct from:',opts:['SA node to AV node','Atria to ventricles','Ventricles to Purkinje fibres','Left bundle to right bundle'],ans:1,exp:'The bundle of His is the only site where action potential can conduct from the atria to the ventricles.'},
  {type:'mcq',q:'Purkinje fibres are located in the:',opts:['Right atrium','AV node region','Inner ventricular walls','Bundle of His only'],ans:2,exp:'Purkinje fibres are located in the inner ventricular walls of the heart.'},
  {type:'mcq',q:'The function of Purkinje fibres is to:',opts:['Delay electrical impulses','Produce the initial pacemaker signal','Allow synchronized contractions of the ventricles','Connect atria to ventricles'],ans:2,exp:'Purkinje fibres allow synchronized contractions of the ventricles and are essential for consistent heart rhythm.'},
  {type:'mcq',q:'Arteries differ from veins mainly because arteries:',opts:['Carry deoxygenated blood','Have thinner walls','Carry blood away from the heart and have thick expandable walls','Have one-way valves'],ans:2,exp:'Arteries carry oxygenated blood away from the heart. Their thick walls expand when blood enters under pressure.'},
  {type:'mcq',q:'Which is the ONLY exception where an artery carries deoxygenated blood?',opts:['Coronary artery','Aorta','Pulmonary artery','Brachial artery'],ans:2,exp:'The pulmonary artery is the only exception — it carries deoxygenated blood from the right ventricle to the lungs.'},
  {type:'mcq',q:'The three layers of the artery wall are (from inside to outside):',opts:['Smooth muscle, endothelium, connective tissue','Endothelium, smooth muscle, connective tissue','Connective tissue, smooth muscle, endothelium','Endothelium, collagen, elastic fibers'],ans:1,exp:'Arteries have three layers: endothelium (inner), smooth muscle (middle), and connective tissue (outer).'},
  {type:'mcq',q:'An arteriole is best described as:',opts:['A large artery near the heart','A small artery that extends and leads to capillaries','A type of vein','The smallest type of capillary'],ans:1,exp:'An arteriole is a small artery that extends and leads to capillaries.'},
  {type:'mcq',q:'When more arteriole vessels dilate, the effect on blood pressure is:',opts:['Blood pressure increases','Blood pressure remains unchanged','Blood pressure decreases','Blood pressure fluctuates unpredictably'],ans:2,exp:'The higher the number of vessels dilated, the lower the blood pressure will be.'},
  {type:'mcq',q:'The walls of capillaries are composed of:',opts:['Three layers like arteries','Two layers of smooth muscle','A single layer of cells — the endothelium','Collagen and elastic fibers'],ans:2,exp:'Capillary walls are a single layer of endothelial cells — thin enough for diffusion of O₂, water, lipids, and CO₂.'},
  {type:'mcq',q:'The total surface area of capillaries in the body is approximately:',opts:['630 square meters','6,300 square meters','63,000 square meters','63 square meters'],ans:1,exp:'Total capillary surface area is about 6,300 square meters.'},
  {type:'mcq',q:'The process by which capillary beds open and close according to need is called:',opts:['Vasoconstriction','Autoregulation','Vasodilation','Homeostasis'],ans:1,exp:'Capillary beds can be opened and closed according to need — this process is called autoregulation.'},
  {type:'mcq',q:'Which type of capillary allows RBCs and serum proteins to enter?',opts:['Continuous capillaries','Fenestrated capillaries','Sinusoidal capillaries','All types equally'],ans:2,exp:'Sinusoidal capillaries have the largest openings, allowing RBCs and serum proteins to enter. Found in liver, bone marrow, and spleen.'},
  {type:'mcq',q:'Approximately what percentage of blood volume is found in the venous system at any given time?',opts:['25%','50%','70%','90%'],ans:2,exp:'Most blood volume (~70%) is found in the venous system at any given time.'},
  {type:'mcq',q:'Veins have low blood pressure and need the help of which structures to return blood to the heart?',opts:['Cardiac valves','Arterioles','Skeletal muscles','Capillary beds'],ans:2,exp:'Veins have low blood pressure and rely on skeletal muscle contractions to push blood back to the heart.'},
  {type:'mcq',q:'The double circulatory system of blood flow refers to:',opts:['Right and left sides of the heart','Pulmonary and systemic circulation','Coronary and systemic circulation','Arterial and venous circulation'],ans:1,exp:'The double circulatory system refers to pulmonary circulation and systemic circulation — two separate circuits.'},
  {type:'mcq',q:'How many times does blood circulate through the body every minute?',opts:['Once','Two to three times','Five times','Ten times'],ans:1,exp:'Blood circulates through the body two to three times every minute.'},
  {type:'mcq',q:'In the pulmonary circuit, blood is pumped to the lungs from the:',opts:['Left ventricle','Right atrium','Right ventricle','Left atrium'],ans:2,exp:'In the pulmonary circuit, blood is pumped to the lungs from the right ventricle.'},
  {type:'mcq',q:'The aorta is classified as what type of artery?',opts:['Muscular artery','Elastic artery','Sinusoidal artery','Fenestrated artery'],ans:1,exp:'The aorta is an elastic artery — it distends during systole and contracts passively during diastole to maintain blood pressure.'},
  {type:'mcq',q:'The Superior Vena Cava (SVC) is formed by the:',opts:['Left and right common iliac veins','Left and right brachiocephalic (innominate) veins','Azygos vein only','Pulmonary veins'],ans:1,exp:'The SVC is formed by the left and right brachiocephalic (innominate) veins, collecting blood from the upper limbs, head, and neck.'},
  {type:'mcq',q:'The Inferior Vena Cava (IVC) is formed by the:',opts:['Left and right subclavian veins','Left and right brachiocephalic veins','Left and right common iliac veins','Hepatic veins'],ans:2,exp:'The inferior vena cava is formed by the left and right common iliac veins.'},
  {type:'mcq',q:'Coronary arteries are classified as \'end circulation\' because:',opts:['They end at the apex of the heart','They represent the only source of blood supply to the myocardium with very little redundant supply','They are the terminal branches of the aorta','They only carry deoxygenated blood'],ans:1,exp:'Coronary arteries are \'end circulation\' because they are the only source of blood to the myocardium with very little redundant supply.'},
  {type:'mcq',q:'Heart rate is calculated as the number of contractions per minute and is normally expressed as:',opts:['Liters per minute','Beats per minute (bpm)','Millimeters of mercury','Millivolts'],ans:1,exp:'Heart rate is expressed as beats per minute (bpm).'},
  {type:'mcq',q:'The normal resting heart rate for an adult male is approximately:',opts:['60 bpm','70 bpm','80 bpm','90 bpm'],ans:1,exp:'When resting, the adult male heart beats at about 70 bpm. Adult females average ~75 bpm.'},
  {type:'mcq',q:'A heart rate below 60 bpm is termed:',opts:['Tachycardia','Arrhythmia','Bradycardia','Fibrillation'],ans:2,exp:'Below 60 bpm = bradycardia; above 100 bpm = tachycardia.'},
  {type:'mcq',q:'Every single \'beat\' of the heart involves which three major stages?',opts:['Depolarization, repolarization, rest','Systole, diastole, rest','Atrial systole, ventricular systole, complete cardiac diastole','P wave, QRS, T wave'],ans:2,exp:'Every beat involves three stages: atrial systole, ventricular systole, and complete cardiac diastole.'},
  {type:'mcq',q:'In the ECG (EKG), the QRS complex indicates:',opts:['Atria are electrically stimulated','Recovery period of the ventricles','Ventricles are electrically stimulated to pump blood out','Time from end of ventricular contraction to T wave'],ans:2,exp:'The QRS complex indicates that the ventricles are electrically stimulated to pump blood out.'},
  {type:'mcq',q:'The T wave on an ECG indicates:',opts:['Atrial depolarization','Ventricular depolarization','The recovery period of the ventricles','The start of the cardiac cycle'],ans:2,exp:'The T wave indicates the recovery (repolarization) period of the ventricles.'},
  {type:'mcq',q:'Cardiac muscle contraction ends when:',opts:['Calcium enters the cell','Cytosolic calcium returns to normal resting levels','Troponin binds to actin','Myosin releases ATP'],ans:1,exp:'Contraction ends when the level of cytosolic calcium returns to normal resting levels.'},
  {type:'mcq',q:'The sequence of cardiac muscle contraction involves calcium-induced calcium release. This means:',opts:['Calcium in arteries stimulates contraction','Calcium binding to SR receptors triggers release of more calcium from the SR','Calcium from the diet directly activates muscle','Potassium triggers calcium release'],ans:1,exp:'Ca²⁺ binds to receptors on the SR membrane, opening more Ca²⁺ channels — this cascade is calcium-induced calcium release.'},
  {type:'mcq',q:'Normal blood pressure for a resting, healthy adult is approximately:',opts:['100/60 mm Hg','110/70 mm Hg','120/80 mm Hg','140/90 mm Hg'],ans:2,exp:'Normal resting blood pressure is approximately 120/80 mm Hg (120 systolic, 80 diastolic).'},
  {type:'mcq',q:'Cardiovascular disease is the leading cause of death and disability in:',opts:['Developing countries only','The United States and most European countries','Asian countries only','All countries equally'],ans:1,exp:'CVD is the #1 cause of death and disability in the United States and most European countries.'},
  {type:'mcq',q:'Atherosclerosis is best described as:',opts:['Inflammation of the pericardium','Hardening or furring of the arteries due to formation of multiple plaques','Rupture of a blood vessel in the brain','A type of cardiac arrhythmia'],ans:1,exp:'Atherosclerosis is \'hardening\' or \'furring\' of arteries caused by the formation of multiple plaques within the arteries.'},
  {type:'mcq',q:'Plaque (Atheroma) is defined as:',opts:['A fibrous thickening of the artery wall','An abnormal inflammatory accumulation of macrophage white blood cells within artery walls','A clot formed in the venous system','A calcium deposit in heart valves'],ans:1,exp:'Plaque (atheroma) is an abnormal inflammatory accumulation of macrophage white blood cells within artery walls.'},
  {type:'mcq',q:'A thrombus is the final product of blood coagulation and is formed via:',opts:['Red blood cell aggregation only','Platelet aggregation and activation of the humoral coagulation system','White blood cell accumulation','Fibrin dissolution'],ans:1,exp:'A thrombus is formed via platelet aggregation (platelet plug) and activation of the humoral coagulation system (clotting factors).'},
  {type:'mcq',q:'Approximately what percentage of strokes are ischemic in origin?',opts:['50-60%','70-75%','85-90%','95-99%'],ans:2,exp:'Ischemic stroke occurs in approximately 85-90% of strokes, where a blood vessel becomes occluded.'},
  {type:'tf',q:'The heart will contract approximately 100,000 times per day in a person who lives to be 80 years old.',ans:true,exp:'If a person lives to 80, the heart beats an average of 100,000 times per day.'},
  {type:'tf',q:'The heart begins supplying the body with nutrients after birth.',ans:false,exp:'Within weeks of conception the heart starts supplying the body with nutrients — even before birth.'},
  {type:'tf',q:'Cardiac muscle is an involuntary muscle tissue found only within the heart.',ans:true,exp:'The heart is composed of cardiac muscle, an involuntary muscle tissue found only within this organ.'},
  {type:'tf',q:'Skeletal muscle is self-exciting and has its own conduction system.',ans:false,exp:'CARDIAC muscle is self-exciting with its own conduction system. Skeletal muscle requires conscious or reflex nervous stimuli.'},
  {type:'tf',q:'The heart is a four-chambered, double pump located in the thoracic cavity between the lungs.',ans:true,exp:'The heart is a four-chambered, double pump structure located in the thoracic cavity between the lungs.'},
  {type:'tf',q:'The myocardium can conduct electricity just like nerve cells.',ans:true,exp:'Cardiac muscle can both contract AND conduct electricity, similar to nerve cells.'},
  {type:'tf',q:'The fibrous pericardium is the innermost layer of the pericardium.',ans:false,exp:'The fibrous pericardium is the OUTER layer. The innermost layer is the visceral layer (Epicardium).'},
  {type:'tf',q:'The pericardial cavity lies between the two layers of the serous pericardium.',ans:true,exp:'The serous pericardium is divided into two layers; in between is the pericardial cavity.'},
  {type:'tf',q:'Both atria are larger and have stronger walls than the ventricles.',ans:false,exp:'The atria are SMALLER with thin walls. The ventricles are larger and much stronger.'},
  {type:'tf',q:'The right atrium holds blood that has been oxygenated and is ready to be sent to the body.',ans:false,exp:'The RIGHT atrium holds DEOXYGENATED blood. The LEFT atrium holds oxygenated blood ready for the body.'},
  {type:'tf',q:'The tricuspid valve has three flaps and is located between the right atrium and right ventricle.',ans:true,exp:'The tricuspid valve has three flaps and is located between the right atrium and right ventricle.'},
  {type:'tf',q:'The bicuspid (mitral) valve has two flaps because there is less strain and pressure on the left side of the heart.',ans:false,exp:'The mitral valve has two flaps because it must cope with MORE strain and pressure on the left side. Two cusps means less to go wrong.'},
  {type:'tf',q:'The subvalvular apparatus controls the opening and closing of the heart valves.',ans:false,exp:'The subvalvular apparatus has NO effect on opening/closing. This is caused entirely by the pressure gradient.'},
  {type:'tf',q:'The semilunar valves prevent blood from flowing back into the ventricles from the arteries.',ans:true,exp:'The semilunar valves in the arteries leaving the heart prevent backflow into the ventricles.'},
  {type:'tf',q:'The right ventricle pumps blood into the systemic circulation for the rest of the body.',ans:false,exp:'The RIGHT ventricle pumps blood into the PULMONARY circulation (to the lungs). The LEFT ventricle pumps to the systemic circulation.'},
  {type:'tf',q:'Blood flow through the heart shows that both atria and both ventricles each contract at the same time as each other.',ans:true,exp:'Both atria contract simultaneously, and both ventricles contract simultaneously.'},
  {type:'tf',q:'The SA node is the natural pacemaker of the heart and is located in the left atrium.',ans:false,exp:'The SA node is the natural pacemaker but it is located in the RIGHT atrium, not the left.'},
  {type:'tf',q:'During atrial contraction, approximately 100 million myocardial cells contract in less than one third of a second.',ans:true,exp:'Atrial contraction is so rapid that ~100 million myocardial cells contract in less than one third of a second.'},
  {type:'tf',q:'The AV node is located near the top of the right atrium.',ans:false,exp:'The AV node lies near the BOTTOM of the right atrium, not the top.'},
  {type:'tf',q:'The Bundle of His is the only site where action potentials can conduct from the atria to the ventricles.',ans:true,exp:'The bundle of His is the ONLY site for conduction from atria to ventricles.'},
  {type:'tf',q:'Purkinje fibres conduct cardiac action potentials more slowly than any other cells in the heart.',ans:false,exp:'Purkinje fibres conduct action potentials more QUICKLY and efficiently than any other cells in the heart.'},
  {type:'tf',q:'Arteries have three layers: endothelium (inside), smooth muscle (middle), and connective tissue (outside).',ans:true,exp:'Arteries have three layers: endothelium (inner), smooth muscle (middle), connective tissue (outer).'},
  {type:'tf',q:'The pulmonary artery carries oxygenated blood from the heart to the lungs.',ans:false,exp:'The pulmonary artery is the exception — it carries DEOXYGENATED blood to the lungs.'},
  {type:'tf',q:'Arterioles can contract to cause vasoconstriction and relax to cause vasodilation, thereby affecting blood pressure.',ans:true,exp:'Arterioles have thick smooth muscle walls that contract (vasoconstriction) and relax (vasodilation), directly affecting blood pressure.'},
  {type:'tf',q:'Capillary beds normally carry about 50% of the blood they could hold at any time.',ans:false,exp:'Capillary beds usually carry no more than 25% of the blood they could hold at any time.'},
  {type:'tf',q:'The pulmonary vein is the only exception to veins carrying deoxygenated blood — it carries oxygenated blood.',ans:true,exp:'Veins carry deoxygenated blood. The exception is the pulmonary vein, which carries oxygenated blood from lungs to left atrium.'},
  {type:'tf',q:'Continuous capillaries allow RBCs and large proteins to pass freely through their walls.',ans:false,exp:'CONTINUOUS capillaries have a sealed epithelium — only small molecules pass. SINUSOIDAL capillaries allow RBCs and serum proteins.'},
  {type:'tf',q:'Veins have one-way valves called venous valves to prevent backflow caused by gravity.',ans:true,exp:'Most veins have one-way venous valves to prevent backflow caused by gravity.'},
  {type:'tf',q:'The double circulatory system is found in fishes, which have two separate circulation systems.',ans:false,exp:'Fishes have a SINGLE circulation system. The double circulatory system is found in amphibians, birds, and mammals.'},
  {type:'tf',q:'In the pulmonary circuit, oxygen in the alveolae diffuses to the capillaries surrounding the alveolae.',ans:true,exp:'O₂ in alveolae diffuses to surrounding capillaries; CO₂ from blood diffuses into alveolae.'},
  {type:'tf',q:'The aorta passively contracts during diastole to help maintain blood pressure.',ans:true,exp:'The aorta expands during systole storing potential energy, then contracts passively during diastole to maintain blood pressure.'},
  {type:'tf',q:'The Superior Vena Cava carries deoxygenated blood from the lower half of the body to the heart.',ans:false,exp:'The SVC carries blood from the UPPER half of the body. The IVC carries blood from the lower half.'},
  {type:'tf',q:'The Inferior Vena Cava runs along the right side of the vertebral column.',ans:true,exp:'The IVC is posterior to the abdominal cavity and runs along the right side of the vertebral column.'},
  {type:'tf',q:'The coronary arteries on the surface of the heart are called epicardial coronary arteries.',ans:true,exp:'The coronary arteries running on the surface of the heart are called epicardial coronary arteries.'},
  {type:'tf',q:'The left coronary artery originates from the right aortic sinus.',ans:false,exp:'The LEFT coronary artery originates from the LEFT aortic sinus. The right coronary artery originates from the right aortic sinus.'},
  {type:'tf',q:'Four percent of people have a third, posterior coronary artery.',ans:true,exp:'Four percent of people have a third, the posterior coronary artery.'},
  {type:'tf',q:'Normal resting heart rate for an adult female is approximately 75 bpm.',ans:true,exp:'Adult males average ~70 bpm; adult females average ~75 bpm at rest.'},
  {type:'tf',q:'Athletes typically have a significantly higher resting heart rate than the general population.',ans:false,exp:'Athletes typically have LOWER resting heart rates. Higher resting heart rates are seen in obese individuals.'},
  {type:'tf',q:'Systole is the relaxation phase of the cardiac cycle when the heart refills with blood.',ans:false,exp:'Systole is the CONTRACTION phase. Diastole is the relaxation/refilling phase.'},
  {type:'tf',q:'The P wave on an ECG indicates that the atria are electrically stimulated to pump blood into the ventricles.',ans:true,exp:'The P wave indicates that the atria are electrically stimulated (depolarized) to pump blood into the ventricles.'},
  {type:'tf',q:'The EKG is an invasive, expensive test that requires general anesthesia.',ans:false,exp:'EKGs are inexpensive, non-invasive, quick, and painless.'},
  {type:'tf',q:'In cardiac muscle contraction, calcium is released from the sarcoplasmic reticulum and binds to troponin to allow actin-myosin interaction.',ans:true,exp:'Ca²⁺ released from the SR binds troponin, allowing actin to bind with myosin, causing contraction.'},
  {type:'tf',q:'The mechanism unique to cardiac muscle (not skeletal) is that action potential opens voltage-gated calcium channels in T-tubules.',ans:true,exp:'This triggers calcium-induced calcium release — a mechanism unique to cardiac muscle.'},
  {type:'tf',q:'Systolic pressure is defined as the lowest pressure during the resting phase of the cardiac cycle.',ans:false,exp:'Systolic = PEAK pressure during contraction. Diastolic = LOWEST pressure at rest.'},
  {type:'tf',q:'Normal systolic blood pressure for a resting healthy adult is approximately 120 mm Hg.',ans:true,exp:'Normal systolic = 120 mm Hg; diastolic = 80 mm Hg.'},
  {type:'tf',q:'Blood pressure is measured in liters per minute.',ans:false,exp:'Blood pressure is measured in millimeters of mercury (mm Hg).'},
  {type:'tf',q:'Atherosclerosis typically begins in early adolescence but is usually asymptomatic and not detected by most diagnostic methods during life.',ans:true,exp:'Atherosclerosis typically begins in early adolescence but remains asymptomatic and undetected for decades.'},
  {type:'tf',q:'Hypertension is a risk factor for strokes, heart attacks, heart failure, arterial aneurysm, and chronic renal failure.',ans:true,exp:'Persistent hypertension is a risk factor for all of these conditions.'},
  {type:'tf',q:'A thrombus is physiologic (normal) in cases of injury.',ans:true,exp:'A thrombus is physiologic in injury (normal clotting) but pathologic in thrombosis (disease).'},
  {type:'tf',q:'Heparin and warfarin are used to promote the formation of blood clots.',ans:false,exp:'Heparin and warfarin INHIBIT the formation and growth of blood clots, allowing the body to dissolve them.'},
  {type:'tf',q:'An embolism occurs when an embolus migrates through circulation and causes blockage of a blood vessel in another part of the body.',ans:true,exp:'An embolism occurs when an object (embolus) migrates through circulation and blocks a vessel elsewhere.'},
  {type:'tf',q:'Blood clots are the most common embolic material.',ans:true,exp:'Blood clots are by far the most common embolic material.'},
  {type:'tf',q:'Hemorrhagic stroke is less dangerous than ischemic stroke because the bleeding is usually minor.',ans:false,exp:'Hemorrhagic strokes are MORE dangerous — blood irritates brain tissue, disrupts chemical balance, and may increase intracranial pressure.'},
  {type:'tf',q:'Ischemic stroke accounts for approximately 85-90% of all strokes.',ans:true,exp:'Ischemic stroke (blood vessel occluded) accounts for ~85-90% of all strokes.'},
  {type:'tf',q:'A heart attack occurs when the supply of blood and oxygen to an area of heart muscle is blocked, usually by a clot in a coronary artery.',ans:true,exp:'A heart attack (AMI) occurs when blood and oxygen supply to heart muscle is blocked, usually by a coronary artery clot.'},
  {type:'tf',q:'If a heart attack blockage is not treated within a few hours, the affected heart muscle will die and be replaced by scar tissue.',ans:true,exp:'Untreated blockage causes the affected heart muscle to die and be replaced by scar tissue.'},
  {type:'tf',q:'Angina pectoris is chest pain caused by excessive blood flow to the heart muscle.',ans:false,exp:'Angina pectoris is caused by ISCHEMIA (LACK of blood and oxygen to the heart muscle), not excessive flow — usually from coronary obstruction or spasm.'},
  {type:'tf',q:'The heart attack (AMI) is the leading cause of death for both men and women all over the world.',ans:true,exp:'Heart attack is the leading cause of death for both men and women worldwide.'},

  {type:'tf',q:'A stroke (CVA) is always caused by a ruptured blood vessel in the brain.',ans:false,exp:'A stroke can be ISCHEMIC (vessel occluded, ~85-90%) or hemorrhagic (vessel ruptures). Most are ischemic.'},

  // Section 2: Functions of the Kidney

  {cat:'urinary',q:'How do the kidneys perform their hematopoietic function?',a:'By secreting erythropoietin, which stimulates the production of erythrocytes (red blood cells).'},
  {cat:'urinary',q:'Name the 5 hormones/substances secreted by the kidney (endocrine function).',a:'i) Erythropoietin  ii) Thrombopoietin  iii) Renin  iv) 1,25-dihydroxycholecalciferol (calcitriol)  v) Prostaglandins'},

  {cat:'urinary',q:'What structures make up the renal sinus?',a:'i) Renal pelvis (expanded upper ureter)  ii) 2–3 major calyces and ~8 minor calyces  iii) Branches of nerves and vessels  iv) Loose connective tissue and fat'},
  {cat:'urinary',q:'What are uriniferous tubules? Name their 2 types.',a:'Tubular structures making up the renal parenchyma.\n1) Nephrons (secretory tubules) — form urine\n2) Collecting ducts — transport urine from nephrons to the pelvis'},
  {cat:'urinary',q:'What are the ducts of Bellini?',a:'Large ducts formed when collecting ducts unite. They open into the minor calyces through the papilla.'},

  {cat:'urinary',q:'How many nephrons are in each kidney?',a:'1 to 1.3 million nephrons.'},
  {cat:'urinary',q:'What are the 2 main parts of each nephron?',a:'1) Blind end = Renal corpuscle (Malpighian corpuscle)\n2) Tubular portion = Renal tubule'},
  {cat:'urinary',q:'What are the 2 types of nephrons?',a:'1) Cortical (superficial) nephrons — 85% of all nephrons; corpuscles in outer cortex\n2) Juxtamedullary nephrons — corpuscles in inner cortex near corticomedullary junction'},
  // Section 5: Renal Corpuscle
  {cat:'urinary',q:'What are the 2 parts of the renal corpuscle?',a:'1) Glomerulus  2) Bowman\'s capsule'},
  {cat:'urinary',q:'Describe the glomerulus.',a:'A tuft of capillaries enclosed by Bowman\'s capsule. Blood enters via afferent arteriole → divides into capillaries → reunites as efferent arteriole. The vascular system is purely arterial.'},
  {cat:'urinary',q:'Why is the efferent arteriole smaller than the afferent arteriole?',a:'To maintain high hydrostatic pressure within the glomerulus, which drives filtration. This difference has functional significance.'},
  {cat:'urinary',q:'What are the fenestra (filtration pores)?',a:'Pores in the glomerular capillary endothelium with a diameter of 0.1 µ. Their presence is evidence of the glomerulus\'s filtration function.'},
  {cat:'urinary',q:'Describe the structure of Bowman\'s capsule.',a:'Diameter = 200 µ. Formed by two layers:\n1) Inner visceral layer — covers glomerular capillaries\n2) Outer parietal layer — continues with the wall of the tubular portion'},
  // Section 6: Renal Tubule
  {cat:'urinary',q:'What are the 3 parts of the tubular portion of the nephron?',a:'1) Proximal convoluted tubule (PCT)  2) Loop of Henle  3) Distal convoluted tubule (DCT)'},
  {cat:'urinary',q:'Key features of the Proximal Convoluted Tubule (PCT)?',a:'Situated in cortex | Length = 14 mm, Diameter = 55 µ | Single layer of cuboidal epithelial cells | Cells have microvilli → called BRUSH-BORDERED CELLS'},
  {cat:'urinary',q:'What are the 3 parts of the Loop of Henle?',a:'i) Descending limb  ii) Hairpin bend  iii) Ascending limb'},
  {cat:'urinary',q:'Describe the descending limb of the Loop of Henle.',a:'Thick descending segment (continuation of PCT; length 6 mm, diameter 55 µ) → continues as Thin descending segment.'},
  {cat:'urinary',q:'What are the dimensions of the thin portion of Henle\'s loop?',a:'Total length = 10 to 15 mm, diameter = 15 µ.'},
  {cat:'urinary',q:'Describe the ascending limb of the Loop of Henle.',a:'Thin ascending segment (continuation of hairpin bend) → Thick ascending segment (length ~9 mm, diameter 30 µ) → continues as DCT.'},
  {cat:'urinary',q:'Key features of the Distal Convoluted Tubule (DCT)?',a:'Length = 14.5–15 mm, Diameter = 22–50 µ | Situated in cortex | Single layer of cuboidal cells WITHOUT brush border | Cells called INTERCALATED CELLS (I cells)'},
  {cat:'urinary',q:'Key features of the Collecting Duct?',a:'Length = 20–22 mm, Diameter = 40–200 µ | Upper part in cortex, lower part in medulla | 7–10 initial collecting ducts → straight collecting duct'},
  // Section 7: Juxtaglomerular Apparatus
  {cat:'urinary',q:'What is the juxtaglomerular apparatus?',a:'A specialized organ situated near the glomerulus of each nephron (juxta = near), formed by 3 different structures.'},
  {cat:'urinary',q:'Name the 3 structures of the juxtaglomerular apparatus.',a:'1) Macula densa  2) Extraglomerular mesangial cells  3) Juxtaglomerular cells'},
  {cat:'urinary',q:'What is the macula densa?',a:'The terminal portion of the thick ascending segment that runs between the afferent and efferent arterioles of the same nephron. Plays a role in tubuloglomerular feedback and secretes thromboxane A2.'},
  {cat:'urinary',q:'What are extraglomerular mesangial cells?',a:'Cells in the triangular region bounded by afferent arteriole, efferent arteriole, and macula densa. Also called AGRANULAR CELLS or LACIS CELLS. They secrete prostaglandins and cytokines.'},
  {cat:'urinary',q:'What are juxtaglomerular (JG) cells?',a:'Modified smooth muscle cells in the wall of the afferent arteriole. They contain secretary granules → called GRANULAR CELLS. They secrete RENIN.'},
  {cat:'urinary',q:'What are the 4 stimuli for renin secretion?',a:'1) Fall in arterial blood pressure\n2) Reduction in ECF volume\n3) Increased sympathetic activity\n4) Decreased load of sodium and chloride in macula densa'},
  {cat:'urinary',q:'What is the function of the JGA?',a:'Primary = secretion of hormonal substances. Also: regulates glomerular blood flow and GFR. JG cells secrete RENIN → forms renin-angiotensin system → maintains blood pressure.'},
  {cat:'urinary',q:'What are glomerular mesangial cells (intraglomerular)?',a:'Cells situated between glomerular capillaries, forming a cellular network supporting capillary loops. They are contractile (regulate filtration), phagocytic, and secrete prostaglandins, cytokines, and matrix of glomerular interstitium.'},

  {cat:'urinary',q:'What are the 3 processes of urine formation?',a:'1) Glomerular filtration  2) Tubular reabsorption  3) Tubular secretion'},
  {cat:'urinary',q:'Which process is the function of the glomerulus vs. the tubular portion?',a:'Glomerulus = FILTRATION | Tubular portion = REABSORPTION + SECRETION'},

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
let fcFilter = 'all';
let fcDeck = [];
let fcIndex = 0;
let fcFlipped = false;

function buildDeck() {
  const ALL_CARDS = [...CARDS, ...WBC_CARDS, ...PLT_CARDS, ...BG_CARDS, ...MUS_CARDS, ...ORG_CARDS, ...ENDO_CARDS, ...URN_CARDS, ...CVS_CARDS, ...NS_CARDS];
  if (fcFilter === 'all') fcDeck = [...ALL_CARDS];
  else fcDeck = ALL_CARDS.filter(c => c.cat === fcFilter);
  fcIndex = 0;
  fcFlipped = false;
  renderCard();
}

function renderCard() {
  const card = fcDeck[fcIndex];
  document.getElementById('fcCurrent').textContent = fcIndex + 1;
  document.getElementById('fcTotal').textContent = fcDeck.length;
  document.getElementById('fcTag').textContent = card.cat === 'blood' ? '🩸 BLOOD' : card.cat === 'rbc' ? '🔴 RED BLOOD CELLS' : card.cat === 'wbc' ? '🦠 WHITE BLOOD CELLS' : card.cat === 'plt' ? '🩹 PLATELETS & COAGULATION' : card.cat === 'bg' ? '🧬 BLOOD GROUPS & LYMPHATICS' : card.cat === 'mus' ? '💪 MUSCLE PHYSIOLOGY' : card.cat === 'digestive' ? '🫁 DIGESTIVE PHYSIOLOGY' : card.cat === 'endo' ? '🧬 ENDOCRINE PHYSIOLOGY' : card.cat === 'urinary' ? '🫘 URINARY PHYSIOLOGY' : card.cat === 'cvs' ? '❤️ CARDIOVASCULAR SYSTEM' : card.cat === 'ns' ? '🧠 NERVOUS SYSTEM' : '📖 PHYSIOLOGY';
  document.getElementById('fcQuestion').textContent = card.q;
  document.getElementById('fcAnswer').textContent = card.a;
  const cardEl = document.getElementById('fcCard');
  cardEl.classList.remove('flipped');
  fcFlipped = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fcCard').classList.toggle('flipped', fcFlipped);
}

function nextCard() {
  fcIndex = (fcIndex + 1) % fcDeck.length;
  renderCard();
}

function prevCard() {
  fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length;
  renderCard();
}

function shuffleCards() {
  for (let i = fcDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fcDeck[i], fcDeck[j]] = [fcDeck[j], fcDeck[i]];
  }
  fcIndex = 0;
  renderCard();
}

function resetCards() {
  buildDeck();
}

function setFCFilter(f) {
  fcFilter = f;
  document.querySelectorAll('#fcFilter .filter-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('#fcFilter .filter-btn');
  if (f === 'all') btns[0].classList.add('active');
  else if (f === 'ns') btns[1].classList.add('active');
  else if (f === 'blood') btns[2].classList.add('active');
  else if (f === 'rbc') btns[3].classList.add('active');
  else if (f === 'wbc') btns[4].classList.add('active');
  else if (f === 'plt') btns[5].classList.add('active');
  else if (f === 'bg') btns[6].classList.add('active');
  else if (f === 'mus') btns[7].classList.add('active');
  else if (f === 'digestive') btns[8].classList.add('active');
  else if (f === 'endo') btns[9].classList.add('active');
  else if (f === 'urinary') btns[10].classList.add('active');
  else if (f === 'cvs') btns[11].classList.add('active');
  else btns[0].classList.add('active');
  buildDeck();
}

  else if (mode === 'bg') quizDeck = [...BG_QUIZ_DATA];
  else if (mode === 'mus') quizDeck = [...MUS_QUIZ_DATA];
  else if (mode === 'digestive') quizDeck = [...ORG_QUIZ_DATA];
  else if (mode === 'endo') quizDeck = [...ENDO_QUIZ_DATA];
  else if (mode === 'urinary') quizDeck = [...URN_QUIZ_DATA];
  else if (mode === 'cvs') quizDeck = [...CVS_QUIZ_DATA];
  else quizDeck = [...BLOOD_QUIZ_DATA, ...QUIZ_DATA, ...WBC_QUIZ_DATA, ...PLT_QUIZ_DATA, ...BG_QUIZ_DATA, ...MUS_QUIZ_DATA, ...ORG_QUIZ_DATA, ...ENDO_QUIZ_DATA, ...URN_QUIZ_DATA, ...CVS_QUIZ_DATA, ...NS_QUIZ_DATA];

  // shuffle
  for (let i = quizDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizDeck[i], quizDeck[j]] = [quizDeck[j], quizDeck[i]];
  }

  quizIndex = 0;
  quizCorrect = 0;
  quizAnswered = false;

  document.getElementById('quizStart').style.display = 'none';
  document.getElementById('quizResult').classList.remove('visible');
  document.getElementById('quizActive').style.display = 'block';

  renderQuestion();
}

function renderQuestion() {
  const q = quizDeck[quizIndex];
  quizAnswered = false;

  document.getElementById('qNum').textContent = `Q${quizIndex + 1} / ${quizDeck.length}`;
  document.getElementById('qScore').textContent = `✓ ${quizCorrect}`;
  document.getElementById('qProgress').style.width = `${(quizIndex / quizDeck.length) * 100}%`;

  const badge = document.getElementById('qTypeBadge');
  badge.className = 'quiz-type-badge ' + q.type;
  badge.textContent = q.type === 'tf' ? 'TRUE / FALSE' : 'MCQ';

  document.getElementById('qQuestion').textContent = q.q;
  document.getElementById('qExplanation').classList.remove('visible');
  document.getElementById('qNextBtn').classList.remove('visible');

  const optsEl = document.getElementById('qOptions');
  optsEl.innerHTML = '';

  if (q.type === 'tf') {
    const div = document.createElement('div');
    div.className = 'tf-buttons';

    const tBtn = document.createElement('button');
    tBtn.className = 'tf-btn true-btn';
    tBtn.textContent = '✓ TRUE';
    tBtn.onclick = () => answerTF(true, tBtn, fBtn, q);

    const fBtn = document.createElement('button');
    fBtn.className = 'tf-btn false-btn';
    fBtn.textContent = '✗ FALSE';
    fBtn.onclick = () => answerTF(false, tBtn, fBtn, q);

    div.appendChild(tBtn);
    div.appendChild(fBtn);
    optsEl.appendChild(div);
  } else {
    const labels = ['A', 'B', 'C', 'D'];
    const btns = [];
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${opt}</span>`;
      btn.onclick = () => answerMCQ(i, btns, q);
      optsEl.appendChild(btn);
      btns.push(btn);
    });
  }
}

function answerTF(chosen, tBtn, fBtn, q) {
  if (quizAnswered) return;
  quizAnswered = true;
  const correct = q.ans;
  const isCorrect = chosen === correct;
  if (isCorrect) quizCorrect++;

  tBtn.disabled = true;
  fBtn.disabled = true;

  if (chosen === true) {
    tBtn.classList.add(isCorrect ? 'correct' : 'wrong');
  } else {
    fBtn.classList.add(isCorrect ? 'correct' : 'wrong');
  }

  showExplanation(isCorrect, q.exp);
}

function answerMCQ(chosen, btns, q) {
  if (quizAnswered) return;
  quizAnswered = true;
  const isCorrect = chosen === q.ans;
  if (isCorrect) quizCorrect++;

  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === chosen && isCorrect) b.classList.add('correct');
    else if (i === chosen && !isCorrect) b.classList.add('wrong');
    else if (i === q.ans) b.classList.add('show-correct');
  });

  showExplanation(isCorrect, q.exp);
}

function showExplanation(correct, text) {
  const el = document.getElementById('qExplanation');
  el.innerHTML = `<strong>${correct ? '✓ Correct!' : '✗ Incorrect'}</strong> — ${text}`;
  el.classList.add('visible');
  document.getElementById('qNextBtn').textContent =
    quizIndex + 1 < quizDeck.length ? 'Next Question →' : 'See Results';
  document.getElementById('qNextBtn').classList.add('visible');
  document.getElementById('qScore').textContent = `✓ ${quizCorrect}`;
}

function nextQuestion() {
  quizIndex++;
  if (quizIndex >= quizDeck.length) {
    showResult();
  } else {
    renderQuestion();
    document.querySelector('.main').scrollTop = 0;
  }
}

function showResult() {
  document.getElementById('quizActive').style.display = 'none';
  const result = document.getElementById('quizResult');
  result.classList.add('visible');
  const pct = Math.round((quizCorrect / quizDeck.length) * 100);
  document.getElementById('rScore').textContent = pct + '%';
  const wrong = quizDeck.length - quizCorrect;
  document.getElementById('rCorrect').textContent = `✓ ${quizCorrect} Correct`;
  document.getElementById('rWrong').textContent = `✗ ${wrong} Wrong`;

  let label = '';
  if (pct >= 90) label = 'Excellent! You\'re ready for the exam 🎯';
  else if (pct >= 75) label = 'Good work — review the missed questions 📖';
  else if (pct >= 60) label = 'Keep studying — you\'re getting there 💪';
  else label = 'Review the material and try again 🔁';
  document.getElementById('rLabel').textContent = label;
}

function restartQuiz() {
  document.getElementById('quizResult').classList.remove('visible');
  document.getElementById('quizStart').style.display = 'block';
  document.querySelector('.main').scrollTop = 0;
}

function quizBack() {
  if (quizIndex === 0 && !quizAnswered) {
    // No question answered yet — go back directly
    exitToMenu();
  } else {
    // Show confirmation
    document.getElementById('confirmCount').textContent = quizAnswered ? quizIndex + 1 : quizIndex;
    document.getElementById('confirmModal').style.display = 'flex';
  }
}

function exitToMenu() {
  document.getElementById('quizActive').style.display = 'none';
  document.getElementById('quizResult').classList.remove('visible');
  document.getElementById('quizStart').style.display = 'block';
  document.querySelector('.main').scrollTop = 0;
}

function closeConfirmModal() {
  document.getElementById('confirmModal').style.display = 'none';
}

function closeConfirm(e) {
  if (e.target === document.getElementById('confirmModal')) closeConfirmModal();
}

function confirmExit() {
  closeConfirmModal();
  exitToMenu();
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  document.querySelector('.main').scrollTop = 0;

  const labels = { fc: 'Flash Cards', quiz: 'Quiz' };
  document.getElementById('sectionBadge').textContent = labels[id];
}


/* ── THEME TOGGLE ── */
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  const btn = document.getElementById('themeBtn');
  btn.textContent = isLight ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}
// Restore saved theme
(function() {
  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = '🌙 Dark';
    });
  }
})();

/* ── INIT ── */
buildDeck();
</script>
