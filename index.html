  {type:'tf',q:'Mucous glands secrete thin and watery saliva because they are predominantly made up of serous cells.',ans:false,exp:'Mucous glands are made up of mainly mucous cells and secrete thick, viscous saliva with high mucin content. Serous glands secrete thin and watery saliva.'},
  {type:'tf',q:'The fine duct draining each acinus in salivary glands is called an intercalated duct.',ans:true,exp:'The fine duct draining each acinus is called intercalated duct, which joins to form intralobular and interlobular ducts, forming the main gland.'},

  {type:'tf',q:'Taste is a chemical sensation where saliva dissolves solid food substances so that the dissolved substances can stimulate the taste buds.',ans:true,exp:'Taste is a chemical sensation. Saliva, by its solvent action, dissolves the solid food substances, so that the dissolved substances can stimulate the taste buds and recognize the taste.'},

  {type:'tf',q:'Xerostomia means dry mouth and is also called pasties or cotton mouth.',ans:true,exp:'Xerostomia means dry mouth and it is also called pasties or cotton mouth. It is due to hyposalivation or absence of salivary secretion (aptyalism).'},

  {type:'tf',q:'Bile is golden yellow or greenish in color and enters the digestive tract through the ampulla of Vater.',ans:true,exp:'Bile is a golden yellow or greenish fluid. It enters the digestive tract along with pancreatic juice through the common opening called ampulla of Vater.'},

  {type:'mcq',q:'Force of muscular contraction is related to the strength of stimulus by:',opts:['Inverse proportion','Logarithmic relationship','Direct proportion','No relationship'],ans:2,exp:'Force of contraction is directly proportional to strength of stimulus.'},
  {type:'mcq',q:'Tetanus is defined as sustained contraction of muscle due to:',opts:['Repeated stimuli with low frequency','A single supramaximal stimulus','Repeated stimuli with high frequency','Heat above 60°C'],ans:2,exp:'Tetanus is defined as the sustained contraction of muscle due to repeated stimuli with high frequency. All the contractions are fused.'},
  {type:'mcq',q:'Which of the following is NOT listed as a cause of muscle fatigue?',opts:['Exhaustion of acetylcholine at the motor endplate','Accumulation of lactic acid and phosphoric acid','Increased blood oxygen levels','Lack of nutrients like glycogen'],ans:2,exp:'Causes of fatigue include exhaustion of ACh, accumulation of metabolites (lactic/phosphoric acid), lack of nutrients (glycogen), and lack of oxygen. Increased oxygen is not a cause.'},
  {type:'mcq',q:'What is the correct order of sites of fatigue in the intact body?',opts:['Muscle → NMJ → Anterior horn cells → Betz cells','Betz cells → Anterior horn cells → NMJ → Muscle','NMJ → Betz cells → Muscle → Anterior horn cells','Anterior horn cells → NMJ → Betz cells → Muscle'],ans:1,exp:'The correct order is: Betz (pyramidal) cells in cerebral cortex → Anterior gray horn cells (motor neurons) of spinal cord → Neuromuscular junction → Muscle.'},
  {type:'mcq',q:'At approximately what temperature does heat rigor occur?',opts:['Above 37°C','Above 40°C','Above 50°C','Above 60°C'],ans:3,exp:'Heat rigor is the shortening and stiffening of muscle fibers due to increased temperature above 60°C, caused by coagulation of muscle proteins actin and myosin.'},
  {type:'mcq',q:'What makes heat rigor unique compared to cold rigor and calcium rigor?',opts:['It is caused by calcium accumulation','It is irreversible','It only affects smooth muscle','It occurs at physiological temperature'],ans:1,exp:'Heat rigor is irreversible because it results from coagulation (denaturation) of contractile proteins actin and myosin. Cold rigor and calcium rigor are both reversible.'},
  {type:'mcq',q:'Rigor mortis develops:',opts:['Due to heat above 60°C','Due to severe cold exposure','After death','Due to increased calcium content'],ans:2,exp:'Rigor mortis is the type of rigor that develops after death.'},
  {type:'mcq',q:'Muscle tone in skeletal muscle is maintained by which mechanism?',opts:['Myogenic — the muscle itself initiates it','Hormonal control only','Neurogenic — continuous motor nerve discharge','Calcium-dependent smooth muscle mechanism'],ans:2,exp:'Maintenance of tone in skeletal muscle is neurogenic. It is due to continuous discharge from motor neurons.'},
  {type:'mcq',q:'The resting membrane potential (RMP) of human skeletal muscle is:',opts:['–60 mV','–70 mV','–80 mV','–90 mV'],ans:3,exp:'In human skeletal muscle, the resting membrane potential is –90 mV. The muscle shows negativity inside and positivity outside — the polarized state.'},
  {type:'mcq',q:'The condition of the muscle at resting membrane potential is described as:',opts:['Depolarized state','Polarized state','Hyperpolarized state','Afterhyperpolarized state'],ans:1,exp:'The condition of the muscle during resting membrane potential is called the polarized state (negative inside, positive outside).'},
  {type:'mcq',q:'During depolarization of skeletal muscle, the inside of the muscle becomes:',opts:['More negative','Neutral (zero mV only)','Positive (up to +55 mV)','Unchanged'],ans:2,exp:'Depolarization is the initial phase of action potential in which the inside of the muscle becomes positive and outside becomes negative. The overshoot reaches +55 mV.'},
  {type:'mcq',q:'The firing level in the skeletal muscle action potential occurs at approximately:',opts:['–90 mV','–75 mV','0 mV','+55 mV'],ans:1,exp:'After initial slow depolarization for about 15 mV (from –90 to –75 mV), the rate of depolarization increases suddenly. This point is called the firing level.'},
  {type:'mcq',q:'The spike potential in skeletal muscle action potential lasts for:',opts:['0.4 millisecond','2–4 milliseconds','50 milliseconds','1 second'],ans:0,exp:'The spike potential (rapid rise in depolarization + rapid fall in repolarization together) lasts for 0.4 millisecond.'},
  {type:'mcq',q:'Afterhyperpolarization (positive afterpotential) in skeletal muscle lasts for:',opts:['0.4 millisecond','2–4 milliseconds','More than 50 milliseconds','Exactly 10 milliseconds'],ans:2,exp:'Afterhyperpolarization lasts for more than 50 milliseconds, after which the normal RMP is restored slowly.'},
  {type:'mcq',q:'The stimulus artifact in action potential recording is caused by:',opts:['Opening of Na+ channels','Calcium release from SR','Leakage of current from stimulating to recording electrode','Repolarization of the membrane'],ans:2,exp:'When a stimulus is applied, a slight irregular deflection (stimulus artifact) occurs due to leakage of current from the stimulating electrode to the recording electrode.'},
  {type:'mcq',q:'In the neuromuscular junction, each terminal branch of a motor axon innervates:',opts:['Multiple muscle fibers simultaneously','One muscle fiber through the NMJ','A motor unit of at least 10 fibers','Only Type II fast fibers'],ans:1,exp:'Each terminal branch innervates one muscle fiber through the neuromuscular junction.'},
  {type:'mcq',q:'The neurotransmitter stored in synaptic vesicles of the axon terminal is:',opts:['Norepinephrine','Dopamine','Acetylcholine','Serotonin'],ans:2,exp:'The synaptic vesicles contain the neurotransmitter substance, acetylcholine. It is synthesized by mitochondria and stored in the vesicles.'},
  {type:'mcq',q:'Approximately how many acetylcholine molecules does each synaptic vesicle contain?',opts:['1,000','5,000','10,000','100,000'],ans:2,exp:'Each vesicle contains about 10,000 acetylcholine molecules. At a time, about 300 vesicles open and release acetylcholine.'},
  {type:'mcq',q:'The enzyme acetylcholinesterase is located in the:',opts:['Synaptic vesicles','Presynaptic membrane only','Matrix of basal lamina in the synaptic cleft','Sarcoplasmic reticulum'],ans:2,exp:'Large quantity of acetylcholinesterase is attached to the matrix of basal lamina within the synaptic cleft.'},
  {type:'mcq',q:'The postsynaptic membrane at the NMJ contains which type of acetylcholine receptors?',opts:['Muscarinic receptors','Nicotinic acetylcholine receptors','Alpha-adrenergic receptors','Beta-2 adrenergic receptors'],ans:1,exp:'The postsynaptic membrane contains the receptors called nicotinic acetylcholine receptors.'},
  {type:'mcq',q:'The endplate potential (EPP) occurs when RMP changes from –90 mV to:',opts:['–75 mV (firing level)','–60 mV','0 mV','+55 mV'],ans:1,exp:'When sodium ions enter inside, slight depolarization occurs up to –60 mV, which is called the endplate potential.'},
  {type:'mcq',q:'The miniature endplate potential has an amplitude of up to:',opts:['5 mV','2 mV','10 mV','0.5 mV'],ans:3,exp:'The amplitude of the miniature endplate potential is only up to 0.5 mV. It cannot alone produce action potential in the muscle.'},
  {type:'mcq',q:'Acetylcholine released into the synaptic cleft is destroyed within:',opts:['50 milliseconds','10 milliseconds','5 milliseconds','1 millisecond'],ans:3,exp:'Acetylcholine released into the synaptic cleft is destroyed very quickly within 1 millisecond by the enzyme acetylcholinesterase.'},
  {type:'mcq',q:'The folds of the postsynaptic membrane at the NMJ are called:',opts:['Terminal cisternae','Synaptic trough','Subneural clefts','Gap junctions'],ans:2,exp:'The postsynaptic membrane is thrown into numerous folds called subneural clefts.'},
  {type:'mcq',q:'What triggers the release of acetylcholine from synaptic vesicles?',opts:['Potassium ions entering the axon terminal','Calcium ions entering through voltage-gated channels','Sodium ions binding to presynaptic membrane','Acetylcholinesterase activation'],ans:1,exp:'When the action potential reaches the axon terminal, it opens voltage-gated calcium channels. Calcium ions enter from ECF and cause bursting of the vesicles releasing ACh.'},
  {type:'mcq',q:'Smooth muscle fibers are characterized by which nuclear arrangement?',opts:['Multiple peripheral nuclei','No nucleus','Single, centrally placed elongated nucleus','Two nuclei at the poles'],ans:2,exp:'Smooth muscle fibers are fusiform or elongated cells with a single and elongated nucleus that is centrally placed.'},
  {type:'mcq',q:'Which protein is ABSENT in smooth muscle fibers?',opts:['Actin','Myosin','Tropomyosin','Troponin'],ans:3,exp:'Troponin (or troponin-like substance) is absent in smooth muscle. The contractile proteins in smooth muscle fiber are actin, myosin, and tropomyosin.'},
  {type:'mcq',q:'Dense bodies in smooth muscle fibers function similarly to which structure in skeletal muscle?',opts:['A band','H zone','Z lines','T-tubules'],ans:2,exp:'Dense bodies are special structures of smooth muscle fibers to which the actin and tropomyosin molecules of thin filaments are attached — functioning like Z lines.'},
  {type:'mcq',q:'Single-unit (visceral) smooth muscle fibers contract synchronously because of:',opts:['Individual nerve supply to each fiber','Dense bodies','Gap junctions forming a functional syncytium','Absence of troponin'],ans:2,exp:'The cell membrane of adjacent fibers fuses at many points to form gap junctions. Through these, ions move freely from cell to cell forming a functional syncytium that contracts as a single unit.'},
  {type:'mcq',q:'The resting membrane potential of visceral smooth muscle is:',opts:['Stable at –90 mV','Stable at –70 mV','Unstable, ranging between –50 and –75 mV','Always at –25 mV'],ans:2,exp:'Resting membrane potential in visceral smooth muscle is very unstable and ranges between –50 and –75 mV. Sometimes it reaches a low level of –25 mV.'},
  {type:'mcq',q:'Slow waves in visceral smooth muscle occur at a frequency of:',opts:['1–3 per minute','4–10 per minute','20–30 per minute','60–80 per minute'],ans:1,exp:'The slow waves occur in a rhythmic fashion at a frequency of 4 to 10 per minute with the amplitude of 10 to 15 mV.'},
  {type:'mcq',q:'Which type of smooth muscle action potential is responsible for sustained contraction?',opts:['Spike potential due to nervous stimuli','Spike initiated by slow-wave rhythm','Action potential with plateau (100–1,000 ms)','Miniature endplate potential'],ans:2,exp:'Action potential with plateau: the muscle remains depolarized for 100 to 1,000 milliseconds. This type is responsible for sustained contraction of smooth muscle fibers.'},
  {type:'mcq',q:'Pacemaker waves in smooth muscle appear at:',opts:['The trough of each slow wave','The peak of each slow wave','During afterhyperpolarization','Only during nervous stimulation'],ans:1,exp:'Pacemaker waves appear at the peak of each slow wave and are primarily found in smooth muscles that are self-excitatory and contract without external stimuli.'},
  {type:'mcq',q:'Which of the following muscles does NOT contain multiunit smooth muscle fibers?',opts:['Ciliary muscles of the eye','Wall of the intestine','Iris of the eye','Arrector pili of skin'],ans:1,exp:'The intestinal wall contains single-unit (visceral) smooth muscle. Multiunit smooth muscle is found in ciliary muscles, iris, arrector pili, blood vessels, and urinary bladder.'},
  {type:'mcq',q:'The principal inorganic mineral in skeletal muscle is:',opts:['Sodium','Calcium','Magnesium','Potassium'],ans:3,exp:'Potassium is the principal mineral in the muscle among the inorganic substances.'},
  {type:'mcq',q:'At cold temperature (~10°C), force of contraction decreases because:',opts:['Viscosity decreases and excitability increases','Chemical processes are accelerated','Excitability decreases, chemical processes slow, and viscosity increases','Calcium release from SR increases'],ans:2,exp:'At about 10°C, force of contraction decreases because: excitability of muscle decreases, chemical processes are slowed or delayed, and viscosity of the muscle increases.'},
  {type:'mcq',q:'Free load, as compared to after load, acts on the muscle:',opts:['After contraction begins','Only during isometric contraction','Before the onset of muscular contraction','At the peak of contraction'],ans:2,exp:'Free load is the load that acts on the muscle freely, even before the onset of contraction. After load acts after the beginning of muscular contraction.'},
  {type:'mcq',q:'Smooth muscle tone is maintained by which mechanism?',opts:['Neurogenic only','Myogenic, depending on calcium level and number of cross bridges','Hormonal only','Somatic nerve discharge'],ans:1,exp:'In smooth muscle, tone is myogenic. It depends upon calcium level and the number of cross bridges.'},
  {type:'mcq',q:'The latent period of skeletal muscle action potential is:',opts:['0.4 millisecond','0.5 to 1 millisecond','2 to 4 milliseconds','More than 50 milliseconds'],ans:1,exp:'The latent period is the period when no change occurs in the electrical potential. It is a very short period with duration of 0.5 to 1 millisecond.'},
  {type:'mcq',q:'When the axon terminal approaches the muscle fiber at the NMJ, the exposed portion of the axis cylinder (expanded like a bulb) is called:',opts:['Synaptic cleft','Synaptic vesicle','Motor endplate','Neurilemma'],ans:2,exp:'When the axon comes close to the muscle fiber it loses the myelin sheath, exposing the axis cylinder. This expanded bulb-like portion is called the motor endplate.'},
  // T/F (61)
  {type:'tf',q:'Skeletal muscles are anchored to bones by tendons and are supplied by somatic nerves.',ans:true,exp:'The skeletal muscles are anchored to the bones by tendons and are supplied by somatic nerves.'},
  {type:'tf',q:'Cardiac muscle is non-striated and involuntary.',ans:false,exp:'Cardiac muscle is STRIATED and involuntary. Smooth muscle is non-striated and involuntary.'},
  {type:'tf',q:'The endomysium covers the whole muscle as an outer sheath.',ans:false,exp:'The epimysium covers the whole muscle. The endomysium covers each individual muscle fiber.'},
  {type:'tf',q:'Skeletal muscle fibers are long, slender, and multinucleated cells arranged parallel to one another.',ans:true,exp:'Muscle fibers are called so because these cells are long and slender in appearance. They are multinucleated and arranged parallel to one another.'},
  {type:'tf',q:'The cytoplasm of the muscle fiber is called sarcolemma.',ans:false,exp:'The cytoplasm of the muscle is known as sarcoplasm. The sarcolemma is the cell membrane (plasma membrane) of the muscle fiber.'},
  {type:'tf',q:'The sarcomere extends from one Z line to the next Z line.',ans:true,exp:'The sarcomere is the structural and functional unit of skeletal muscle and extends from Z line to Z line.'},
  {type:'tf',q:'The H zone contains both actin and myosin filaments overlapping each other.',ans:false,exp:'The H zone contains only myosin filaments — there is no overlap with actin in the H zone.'},
  {type:'tf',q:'Myosin filaments have cross bridges with enlarged structures called myosin heads at their tips that attach to actin during contraction.',ans:true,exp:'Some lateral processes (cross bridges) arise from myosin filaments and have enlarged structures called myosin heads at their tips. The heads attach to actin filaments during contraction.'},
  {type:'tf',q:'The actin filaments are composed of four proteins: actin, tropomyosin, troponin, and myosin.',ans:false,exp:'Actin filaments are formed by THREE types of proteins: actin, tropomyosin, and troponin. Myosin forms the thick filaments separately.'},
  {type:'tf',q:'T-tubules form a closed system and do not open to the exterior of the muscle cell.',ans:false,exp:'T-tubules open to the exterior because they originate from the sarcolemma — ECF runs through their lumen. L-tubules are the closed system.'},
  {type:'tf',q:'L-tubules (sarcoplasmic reticulum) correspond to the endoplasmic reticulum of other cells.',ans:true,exp:'The L-tubules correspond to the endoplasmic reticulum of other cells.'},
  {type:'tf',q:'Terminal cisternae are dilated portions of T-tubules.',ans:false,exp:'Terminal cisternae are dilated portions of L-tubules (sarcoplasmic reticulum), not T-tubules. Each pair of terminal cisternae is in close contact with a T-tubule.'},
  {type:'tf',q:'The triad of skeletal muscle = one T-tubule + two terminal cisternae.',ans:true,exp:'The T-tubule along with the cisternae on either side is called the triad of skeletal muscle.'},
  {type:'tf',q:'Excitation-contraction coupling is the process by which sodium ions cause muscle contraction.',ans:false,exp:'Excitation-contraction coupling is the process by which CALCIUM IONS (not sodium ions) cause contraction of the muscle.'},
  {type:'tf',q:'Chemical stimulus (e.g., applying acid) is one of the four types of stimuli that can excite muscle.',ans:true,exp:'The four types of stimuli are mechanical (pinching), electrical, thermal (heated glass rod/ice), and chemical (acids).'},
  {type:'tf',q:'A supramaximal stimulus produces a greater force of contraction than a maximal stimulus.',ans:false,exp:'The force of contraction does not increase beyond the maximal stimulus level. A supramaximal stimulus does not recruit additional muscle fibers.'},
  {type:'tf',q:'In isotonic contraction, the tension remains the same while the length of the muscle fiber changes.',ans:true,exp:'Isotonic contraction: tension remains the same (iso = same, tonic = tension) and the length of the muscle fiber is altered.'},
  {type:'tf',q:'After load is the load that acts on the muscle before the onset of contraction.',ans:false,exp:'After load acts AFTER the beginning of muscular contraction. Free load acts before the onset of contraction.'},
  {type:'tf',q:'Type II fibers (fast twitch fibers) have a small diameter.',ans:false,exp:'Type II fibers (fast fibers or fast twitch fibers) have LARGE diameter. Type I fibers (slow twitch fibers) have small diameter.'},
  {type:'tf',q:'Back muscles and gastrocnemius muscles are examples of red (slow) muscles.',ans:true,exp:'Back muscles and gastrocnemius muscles are red muscles containing large numbers of Type I fibers with longer contraction time.'},
  {type:'tf',q:'Most skeletal muscles in humans contain only Type I or only Type II fibers exclusively.',ans:false,exp:'Most of the skeletal muscles in human beings contain BOTH types of fibers (Type I and Type II).'},
  {type:'tf',q:'Fatigue is defined as decreased muscular activity due to repeated stimuli with low frequency.',ans:true,exp:'Fatigue is the decrease in muscular activity due to repeated stimuli with low frequency.'},
  {type:'tf',q:'The first site of fatigue in the intact body is the neuromuscular junction.',ans:false,exp:'The correct order of fatigue sites is: Betz cells (cerebral cortex) → Anterior horn cells (spinal cord) → NMJ → Muscle. The NMJ is the third site, not first.'},
  {type:'tf',q:'Incomplete tetanus is also called clonus.',ans:true,exp:'If the frequency of stimuli is less, partial fusion of contractions takes place leading to incomplete tetanus or clonus.'},
  {type:'tf',q:'At warm temperature (40°C), the viscosity of muscle increases, which contributes to increased force of contraction.',ans:false,exp:'At 40°C, the viscosity of muscle DECREASES (not increases), which contributes to the increased force of contraction along with increased excitability and accelerated chemical processes.'},
  {type:'tf',q:'Heat rigor is caused by coagulation of muscle proteins actin and myosin and is irreversible.',ans:true,exp:'Heat rigor is due to the coagulation of muscle proteins actin and myosin at temperatures above 60°C. It is an irreversible phenomenon.'},
  {type:'tf',q:'Cold rigor is an irreversible phenomenon.',ans:false,exp:'Cold rigor occurs due to exposure to severe cold and is a REVERSIBLE phenomenon, unlike heat rigor which is irreversible.'},
  {type:'tf',q:'Rigor mortis develops after death.',ans:true,exp:'Rigor mortis is the type of rigor that develops after death.'},
  {type:'tf',q:'Muscle tone in cardiac muscle is neurogenic.',ans:false,exp:'In cardiac muscle, maintenance of tone is PURELY MYOGENIC — the muscles themselves control the tone, not nerve discharge.'},
  {type:'tf',q:'Hypertonia means increased muscle tone and hypotonia means decreased muscle tone.',ans:true,exp:'Hypertonia: increased muscle tone. Hypotonia: decreased muscle tone. These are abnormalities of muscle tone.'},
  {type:'tf',q:'During resting membrane potential, the inside of the muscle fiber is positive and the outside is negative.',ans:false,exp:'During the resting membrane potential (polarized state), the inside is NEGATIVE and the outside is POSITIVE.'},
  {type:'tf',q:'The firing level in skeletal muscle action potential occurs at approximately –75 mV.',ans:true,exp:'After initial slow depolarization for about 15 mV (up to –75 mV from –90 mV), the rate of depolarization increases suddenly at the firing level.'},
  {type:'tf',q:'The afterdepolarization (negative afterpotential) in skeletal muscle lasts for 2 to 4 milliseconds.',ans:true,exp:'The rapid fall in repolarization is followed by a slow repolarization or negative afterpotential with a duration of 2 to 4 milliseconds.'},
  {type:'tf',q:'The stimulus artifact in action potential recording is caused by Ca2+ release from the sarcoplasmic reticulum.',ans:false,exp:'The stimulus artifact is caused by leakage of current from the stimulating electrode to the recording electrode — it is an electrical artifact, not related to Ca2+ release.'},
  {type:'tf',q:'The latent period of skeletal muscle action potential lasts 0.5 to 1 millisecond with no change in electrical potential.',ans:true,exp:'The latent period is the period when no change occurs in the electrical potential. It has a duration of 0.5 to 1 millisecond.'},
  {type:'tf',q:'Acetylcholine in the axon terminal is synthesized by ribosomes using ATP from mitochondria.',ans:false,exp:'Acetylcholine is synthesized by MITOCHONDRIA present in the axon terminal (not ribosomes). The mitochondria contain ATP which is the source of energy for the synthesis of acetylcholine.'},
  {type:'tf',q:'Each synaptic vesicle contains about 10,000 acetylcholine molecules, and about 300 vesicles open at a time.',ans:true,exp:'Each vesicle contains about 10,000 acetylcholine molecules, and at a time, about 300 vesicles open and release acetylcholine.'},
  {type:'tf',q:'The postsynaptic membrane of the NMJ contains nicotinic acetylcholine receptors.',ans:true,exp:'The postsynaptic membrane contains the receptors called nicotinic acetylcholine receptors.'},
  {type:'tf',q:'The endplate potential (EPP) is an action potential that propagates along the muscle fiber.',ans:false,exp:'The endplate potential is a GRADED potential and it is NOT an action potential. It is non-propagative, but it causes the development of action potential in the muscle fiber.'},
  {type:'tf',q:'Rapid destruction of ACh by acetylcholinesterase within 1 ms prevents repeated excitation and allows the muscle to relax.',ans:true,exp:'The rapid destruction of acetylcholine is functionally significant because it prevents repeated excitation of the muscle fiber and allows the muscle to relax.'},
  {type:'tf',q:'Smooth muscle fibers have well-defined myofibrils and sarcomeres similar to skeletal muscle.',ans:false,exp:'Well-defined myofibrils and sarcomere are ABSENT in smooth muscles. This is a key structural difference from skeletal muscle.'},
  {type:'tf',q:'Smooth muscle fibers are generally very small, measuring 2 to 5 microns in diameter and 50 to 200 microns in length.',ans:true,exp:'Smooth muscle fibers are generally very small, measuring 2 to 5 microns in diameter and 50 to 200 microns in length.'},
  {type:'tf',q:'In smooth muscle, T-tubules are absent and L-tubules are poorly developed.',ans:true,exp:'The sarco-tubular system in smooth muscle fibers is in the form of a network. T-tubules are absent and L-tubules are poorly developed.'},
  {type:'tf',q:'Dense bodies in smooth muscle correspond functionally to the A band of skeletal muscle.',ans:false,exp:'Dense bodies correspond functionally to the Z LINES (not A band) of skeletal muscle. They are the attachment sites for thin filaments in smooth muscle.'},
  {type:'tf',q:'Visceral (single-unit) smooth muscle resembles cardiac muscle more than skeletal muscle in its functional organization.',ans:true,exp:'Visceral smooth muscle forms a functional syncytium through gap junctions and contracts as a single unit — similar to cardiac muscle — more so than the individually controlled skeletal muscle.'},
  {type:'tf',q:'Multiunit smooth muscle fibers exhibit spontaneous contractions.',ans:false,exp:'Multiunit smooth muscle fibers do NOT exhibit spontaneous contractions. Single-unit (visceral) smooth muscle fibers are self-excitatory.'},
  {type:'tf',q:'Pacemaker waves in smooth muscle appear at the peak of each slow wave.',ans:true,exp:'Pacemaker waves (spike potential initiated by slow-wave rhythm) appear at the peak of each slow wave and are primarily found in self-excitatory smooth muscles.'},
  {type:'tf',q:'The action potential with plateau in smooth muscle causes sustained contraction because the muscle remains depolarized for 100 to 1,000 milliseconds.',ans:true,exp:'This type of action potential starts with rapid depolarization but repolarization does not occur immediately. The muscle remains depolarized for 100 to 1,000 milliseconds, responsible for sustained contraction.'},
  {type:'tf',q:'Smooth muscles are supplied only by sympathetic nerves.',ans:false,exp:'Smooth muscles are supplied by BOTH sympathetic and parasympathetic nerves.'},
  {type:'tf',q:'Free histiocytes of blood include neutrophils and monocytes which can become macrophages.',ans:true,exp:'Wandering reticuloendothelial cells (free histiocytes of blood) include neutrophils and monocytes, which become macrophages and migrate to the site of injury or infection.'},
  {type:'tf',q:'The myosin filaments in smooth muscle have more cross bridges than in skeletal muscle.',ans:true,exp:'Thick filaments in smooth muscle are formed by myosin molecules and have more number of cross bridges than in skeletal muscle.'},
  {type:'tf',q:'Troponin is present in smooth muscle and plays the same role as in skeletal muscle.',ans:false,exp:'Troponin or troponin-like substance is ABSENT in smooth muscle. The contractile proteins in smooth muscle fiber are actin, myosin, and tropomyosin only.'},
  {type:'tf',q:'The muscle fiber length is between 1 and 4 cm, and diameter varies from 10 to 100 micrometers.',ans:true,exp:'The length of the fiber is between 1 and 4 cm depending upon the length of the muscle, and diameter varies from 10 to 100 µm.'},
  {type:'tf',q:'The axon loses its myelin sheath as it approaches the muscle fiber at the NMJ, exposing the motor endplate.',ans:true,exp:'When the axon comes close to the muscle fiber, it loses the myelin sheath. The exposed axis cylinder (expanded like a bulb) is called the motor endplate.'},
  {type:'tf',q:'The miniature endplate potential (MEPP) can alone generate an action potential in the muscle fiber.',ans:false,exp:'Miniature endplate potential cannot produce action potential in the muscle alone. When more and more quanta of ACh are released, MEPPs add together to produce EPP, which then triggers action potential.'},
  {type:'tf',q:'The synaptic cleft between presynaptic and postsynaptic membranes contains basal lamina with acetylcholinesterase.',ans:true,exp:'The synaptic cleft contains basal lamina — a thin spongy reticular matrix — and large quantities of acetylcholinesterase attached to the matrix of the basal lamina.'},
  {type:'tf',q:'During action potential recording, the afterhyperpolarization phase goes more negative than –90 mV.',ans:true,exp:'After reaching the resting level (–90 mV), the potential becomes more negative beyond resting level during afterhyperpolarization (positive afterpotential), lasting more than 50 milliseconds.'},
  {type:'tf',q:'Recovery from muscle fatigue is an irreversible process.',ans:false,exp:'Fatigue is a REVERSIBLE phenomenon. The fatigued muscle recovers if given rest and nutrition (removal of metabolites, ACh reformation, restored polarized state, nutrients and oxygen).'},
  {type:'tf',q:'Smooth muscle of the iris of the eye is a multiunit smooth muscle.',ans:true,exp:'The iris of the eye contains multiunit smooth muscle fibers — present also in ciliary muscles, arrector pili, blood vessels, and urinary bladder.'},
  {type:'tf',q:'The resting membrane potential in visceral smooth muscle is very stable at –90 mV.',ans:false,exp:'The resting membrane potential in visceral smooth muscle is very UNSTABLE and ranges between –50 and –75 mV, caused by slow wave fluctuations at 4–10 per minute.'},
  {type:'tf',q:'The fascia is the thick fibrous tissue layer that separates the muscle mass from neighboring tissues.',ans:true,exp:'The muscle mass is separated from the neighboring tissues by the thick fibrous tissue layer known as fascia.'},
];

const BG_CARDS = [
  // ── ABO BLOOD GROUPS ──
  {cat:'bg',q:'What determines a person’s ABO blood group?',a:'The presence or absence of antigens (agglutinogens) on the RBC membrane — specifically antigen A and/or antigen B.'},
  {cat:'bg',q:'What are agglutinogens?',a:'Antigens on the surface of RBCs that cause agglutination when mixed with their corresponding antibody (agglutinin). Named by Landsteiner.'},
  {cat:'bg',q:'What are agglutinins?',a:'Antibodies in the plasma corresponding to blood group antigens (e.g., anti-A/alpha, anti-B/beta). A particular agglutinogen and its corresponding agglutinin CANNOT coexist.'},
  {cat:'bg',q:'What antigen(s) and antibody(ies) are present in blood group A?',a:'Antigen A on RBCs + Anti-B (β) antibody in serum.'},
  {cat:'bg',q:'What antigen(s) and antibody(ies) are present in blood group B?',a:'Antigen B on RBCs + Anti-A (α) antibody in serum.'},
  {cat:'bg',q:'What antigen(s) and antibody(ies) are present in blood group AB?',a:'Both A and B antigens on RBCs + NO antibodies in serum. AB is the universal recipient.'},
  {cat:'bg',q:'What antigen(s) and antibody(ies) are present in blood group O?',a:'NO antigens on RBCs + Both Anti-A and Anti-B antibodies in serum. O is the universal donor.'},
  {cat:'bg',q:'Why is blood group O called the universal donor?',a:'Because O RBCs carry no antigens (A or B), so the recipient’s antibodies cannot agglutinate them — compatible with all blood groups.'},
  {cat:'bg',q:'Why is blood group AB called the universal recipient?',a:'Because AB plasma has NO antibodies, so it cannot agglutinate donor RBCs from any blood group.'},
  {cat:'bg',q:'What is agglutination and what causes it?',a:'Clumping of RBCs when an antigen meets its corresponding antibody (e.g., A antigen + anti-A). The antibody involved is called an isoagglutinin.'},
  // ── TRANSFUSION ──
  {cat:'bg',q:'What is the difference between blood matching and crossmatching?',a:'Blood matching (typing) = Recipient’s RBCs + Test antisera. Crossmatching = Recipient’s SERUM + Donor’s RBCs. Both are done before transfusion.'},
  {cat:'bg',q:'What are the three complications of an incompatible blood transfusion?',a:'(1) Jaundice — serum bilirubin rises above 2 mg/dL. (2) Cardiac shock — increased blood viscosity overloads the heart. (3) Renal shutdown — toxic substances from hemolyzed RBCs constrict renal vessels.'},
  {cat:'bg',q:'What is the Rh factor?',a:'An antigen (specifically the D antigen) on the RBC surface. Discovered by Landsteiner and Wiener in rhesus monkeys. D antigen = Rh positive; without = Rh negative.'},
  {cat:'bg',q:'How does the Rh system differ from the ABO system?',a:'In ABO, corresponding antibodies are naturally present in plasma. In Rh, there is NO natural anti-D antibody — it only forms after exposure to Rh-positive blood.'},
  {cat:'bg',q:'What happens when an Rh-negative person receives Rh-positive blood for the first time?',a:'Sensitization occurs — anti-D antibodies form. No immediate severe reaction. On second exposure, the pre-formed anti-D causes hemolytic transfusion reaction.'},
  // ── RETICULOENDOTHELIAL SYSTEM & SPLEEN ──
  {cat:'bg',q:'What is the reticuloendothelial system (RES)?',a:'A system of primitive phagocytic cells (macrophages and related cells) that play an important role in the body’s defense mechanism.'},
  {cat:'bg',q:'What is a macrophage and where does it come from?',a:'A large phagocytic cell derived from MONOCYTES. When monocytes leave the blood and enter tissues, they differentiate into tissue macrophages.'},
  {cat:'bg',q:'Name three examples of fixed tissue macrophages and their locations.',a:'Kupffer cells (liver), Alveolar macrophages (lungs), Microglia (brain). Also: meningocytes (meninges), reticular cells of spleen/lymph node/bone marrow.'},
  {cat:'bg',q:'Which macrophage secretion prevents rejection of transplanted organs?',a:'Transforming Growth Factor (TGF).'},
  {cat:'bg',q:'What cytokines do tissue macrophages secrete that help in immunity?',a:'Interleukin-1, Interleukin-6, and Interleukin-12.'},
  {cat:'bg',q:'What is M-CSF and what does it do?',a:'M-CSF (Colony-Stimulating Factor) secreted by macrophages accelerates growth of granulocytes, monocytes, and macrophages.'},
  {cat:'bg',q:'Why is the spleen called the "graveyard of RBCs"?',a:'Old, fragile RBCs (lifespan ~120 days) cannot withstand squeezing through thin splenic capillaries and are destroyed there. The spleen is the primary site of senile RBC destruction.'},
  {cat:'bg',q:'What are the four main functions of the spleen?',a:'(1) Formation of blood cells (hemopoiesis in embryo). (2) Destruction of old blood cells. (3) Blood reservoir — releases RBCs during hypoxia/hemorrhage. (4) Defense — macrophages phagocytose microorganisms; ~25% T cells and ~15% B cells.'},
  // ── LYMPHATICS ──
  {cat:'bg',q:'What is the lymphatic system?',a:'A closed, ONE-WAY system of lymph channels through which lymph flows from tissue spaces toward the blood (not in reverse).'},
  {cat:'bg',q:'What is the structure of a lymph node?',a:'Small glandular structure covered by dense connective tissue capsule, arranged in three layers: cortex, paracortex, and medulla. Receives lymph via afferent vessels; drains via efferent vessels.'},
  {cat:'bg',q:'Why are lymph nodes called "defense barriers"?',a:'Macrophages in lymph nodes destroy bacteria and toxic substances passing through lymph. Water and electrolytes are filtered out; proteins and lipids are retained.'},
  {cat:'bg',q:'What is the rate of lymph flow into the blood per hour?',a:'~120 mL/hour — 100 mL/h through the thoracic duct and 20 mL/h through the right lymphatic duct.'},
  {cat:'bg',q:'What is the composition of lymph?',a:'96% water + 4% solids (proteins, lipids/chylomicrons, carbohydrates, amino acids, urea, creatinine, inorganic substances).'},
  {cat:'bg',q:'What is the most important function of lymph?',a:'To return PROTEINS from tissue spaces back into the blood. Proteins cannot enter blood capillaries (too large), so they enter lymph capillaries (more permeable).'},
  {cat:'bg',q:'Why does lymph appear milky after a fatty meal?',a:'Chylomicrons and lipoproteins absorbed from intestinal villi enter lymph vessels, giving lymph a milky (chylous) appearance.'},
  // ── TISSUE FLUID & EDEMA ──
  {cat:'bg',q:'What is tissue (interstitial) fluid and how is it formed?',a:'Medium bathing cells (~20% of ECF). Formed by filtration at the ARTERIAL end of capillaries (hydrostatic pressure 30 mmHg > oncotic 25 mmHg pushes fluid out).'},
  {cat:'bg',q:'How is tissue fluid reabsorbed?',a:'At the VENOUS end, oncotic pressure (25 mmHg) exceeds hydrostatic pressure (15 mmHg) → 10 mmHg gradient pulls fluid back. About 10% of filtered fluid enters lymph capillaries instead.'},
  {cat:'bg',q:'What are the two main types of edema based on fluid compartment?',a:'(1) Intracellular edema — fluid inside cells (malnutrition, poor metabolism, inflammation). (2) Extracellular edema — fluid in interstitial space.'},
  {cat:'bg',q:'What are the five causes of extracellular edema?',a:'(1) Heart failure. (2) Renal disease. (3) Decreased plasma proteins. (4) Lymphatic obstruction. (5) Increased endothelial permeability.'},
  {cat:'bg',q:'What is the difference between pitting and non-pitting edema?',a:'Pitting edema = free fluid; finger pressure leaves a depression. Non-pitting edema = hard; no pit forms (due to cell swelling or fibrinogen clotting in interstitial fluid).'},
  // ── TRANSFUSION TYPES ──
  {cat:'bg',q:'What is exchange transfusion and when is it used?',a:'Removal of patient’s blood and replacement with fresh donor blood or plasma. Used in severe jaundice and sickle cell anemia.'},
  {cat:'bg',q:'What is autologous blood transfusion?',a:'Collection and reinfusion of the PATIENT’S OWN blood. Also called self-blood donation. Eliminates compatibility risks.'},
  {cat:'bg',q:'What are the common blood substitutes?',a:'Human plasma, 0.9% NaCl (isotonic saline), and 5% glucose solution. These replace volume but cannot carry oxygen like whole blood.'},
  {cat:'bg',q:'What precautions must be taken during blood transfusion?',a:'(1) Donor must be healthy (free of syphilis, AIDS). (2) Only compatible blood + confirmed Rh compatibility. (3) Both matching and crossmatching done. (4) Sterile apparatus. (5) Blood at body temperature. (6) Slow transfusion.'},
];

  {cat:'plt',q:'What happens during Stage 1 of hemostasis (Vasoconstriction)?',a:'The injured blood vessel constricts (arterioles & small arteries) to decrease blood loss. It is a purely LOCAL phenomenon.'},
  {cat:'plt',q:'What substances are secreted during platelet plug formation and what do they do?',a:'Platelets adhere to collagen and secrete ADP & Thromboxane A2 → attract & activate more platelets → form a loose temporary platelet plug.'},

  {cat:'plt',q:'What is the difference between the Intrinsic and Extrinsic pathways?',a:'Intrinsic → initiated by PLATELETS (within blood). Extrinsic → initiated by TISSUE THROMBOPLASTIN (from injured tissues).'},

  {cat:'plt',q:'Define a blood clot.',a:'A mesh of fibrin threads entangling RBCs, WBCs, and platelets.'},

  {cat:'plt',q:'How is Plasmin formed?',a:'Plasminogen (inactive glycoprotein made in liver) is converted to Plasmin by: tissue plasminogen activator (t-PA), lysosomal enzymes, and thrombin.'},
  {cat:'plt',q:'Where is Heparin produced and by which cells?',a:'Produced naturally by MAST CELLS (in connective tissue of liver & lungs) and BASOPHILS.'},

  {cat:'plt',q:'How do Coumarin derivatives (Warfarin, Dicoumoral) work?',a:'Inhibit the action of VITAMIN K → prevent formation of clotting factors II, VII, IX, and X. Used orally (in vivo).'},
