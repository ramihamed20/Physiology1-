<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Physiology — Study App</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080d14"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0b0f17;
    --surface: #141922;
    --surface2: #1c2333;
    --border: #252d3d;
    --text: #e8edf5;
    --muted: #6b7a99;
    --accent: #4f9cf9;
    --accent2: #38d9a9;
    --red: #ff6b6b;
    --green: #38d9a9;
    --yellow: #ffd43b;
    --card-h: clamp(220px, 55vw, 340px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

/* ── TOP BAR ── */
.topbar {
background: var(--surface);
border-bottom: 1px solid var(--border);
padding: 14px 20px 12px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
}
.topbar h1 {
font-family: ‘Syne’, sans-serif;
font-size: 17px;
font-weight: 800;
letter-spacing: -0.3px;
color: var(--text);
}
.topbar h1 span { color: var(--accent); }
.badge {
font-size: 11px;
background: var(--accent);
color: #fff;
padding: 3px 9px;
border-radius: 20px;
font-weight: 600;
}

/* ── MAIN CONTENT ── */
.main {
flex: 1;
overflow-y: auto;
overflow-x: hidden;
-webkit-overflow-scrolling: touch;
}
.section { display: none; padding: 16px 16px 100px; }
.section.active { display: block; }

/* ── BOTTOM NAV ── */
.bottomnav {
display: flex;
background: var(--surface);
border-top: 1px solid var(--border);
flex-shrink: 0;
}
.navbtn {
flex: 1;
padding: 12px 8px;
background: none;
border: none;
color: var(--muted);
font-family: ‘DM Sans’, sans-serif;
font-size: 12px;
font-weight: 500;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
transition: color 0.2s;
}
.navbtn.active { color: var(--accent); }
.navbtn svg { width: 22px; height: 22px; }

/* ── FILTER TABS ── */
.filter-row {
display: flex;
gap: 8px;
margin-bottom: 16px;
overflow-x: auto;
padding-bottom: 4px;
scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
flex-shrink: 0;
padding: 7px 14px;
border-radius: 20px;
border: 1px solid var(--border);
background: var(--surface);
color: var(--muted);
font-size: 13px;
font-weight: 500;
cursor: pointer;
transition: all 0.18s;
font-family: ‘DM Sans’, sans-serif;
}
.filter-btn.active {
background: var(--accent);
border-color: var(--accent);
color: #fff;
}

/* ── FLASH CARD ── */
.fc-counter {
text-align: center;
font-size: 13px;
color: var(--muted);
margin-bottom: 14px;
font-weight: 500;
}
.fc-counter strong { color: var(--accent); }
.fc-scene {
width: 100%;
height: var(--card-h);
perspective: 1000px;
cursor: pointer;
margin-bottom: 16px;
}
.fc-card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-front, .fc-back {
position: absolute;
inset: 0;
border-radius: 16px;
padding: 24px 22px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
}
.fc-front {
background: var(--surface);
border: 1px solid var(--border);
}
.fc-back {
background: linear-gradient(135deg, #1a2540 0%, #1c2f45 100%);
border: 1px solid #2a4060;
transform: rotateY(180deg);
}
.fc-tag {
font-size: 10px;
letter-spacing: 1px;
text-transform: uppercase;
color: var(--accent);
font-weight: 700;
margin-bottom: 14px;
background: rgba(79,156,249,0.1);
padding: 3px 10px;
border-radius: 10px;
align-self: flex-start;
}
.fc-question {
font-size: clamp(14px, 4vw, 17px);
line-height: 1.55;
color: var(--text);
font-weight: 400;
text-align: center;
}
.fc-tap-hint {
font-size: 11px;
color: var(--muted);
margin-top: 16px;
display: flex;
align-items: center;
gap: 5px;
}
.fc-answer {
font-size: clamp(13px, 3.8vw, 16px);
line-height: 1.6;
color: var(--accent2);
font-weight: 500;
text-align: center;
}
.fc-answer-label {
font-size: 10px;
letter-spacing: 1px;
color: var(--accent2);
text-transform: uppercase;
font-weight: 700;
margin-bottom: 12px;
opacity: 0.7;
}

.fc-controls {
display: flex;
gap: 10px;
justify-content: center;
margin-bottom: 14px;
}
.fc-btn {
flex: 1;
max-width: 130px;
padding: 11px;
border-radius: 12px;
border: 1px solid var(--border);
background: var(--surface);
color: var(--text);
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: all 0.18s;
font-family: ‘DM Sans’, sans-serif;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}
.fc-btn:hover { background: var(--surface2); border-color: var(--accent); }
.fc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.fc-shuffle-row {
display: flex;
justify-content: center;
gap: 10px;
}
.fc-small-btn {
padding: 8px 16px;
border-radius: 10px;
border: 1px solid var(--border);
background: none;
color: var(--muted);
font-size: 12px;
font-weight: 500;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
transition: all 0.18s;
display: flex;
align-items: center;
gap: 5px;
}
.fc-small-btn:hover { color: var(--text); border-color: var(--text); }

/* ── QUIZ ── */
.quiz-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 14px;
}
.quiz-progress-bar {
height: 4px;
background: var(--surface2);
border-radius: 4px;
margin-bottom: 16px;
overflow: hidden;
}
.quiz-progress-fill {
height: 100%;
background: var(--accent);
border-radius: 4px;
transition: width 0.3s ease;
}
.quiz-score-chip {
font-size: 13px;
font-weight: 600;
color: var(--accent2);
background: rgba(56,217,169,0.1);
padding: 4px 12px;
border-radius: 20px;
}
.quiz-q-num {
font-size: 13px;
color: var(--muted);
font-weight: 500;
}
.quiz-type-badge {
font-size: 10px;
padding: 3px 9px;
border-radius: 10px;
font-weight: 700;
letter-spacing: 0.5px;
text-transform: uppercase;
}
.quiz-type-badge.tf { background: rgba(255,212,59,0.15); color: var(--yellow); }
.quiz-type-badge.mcq { background: rgba(79,156,249,0.15); color: var(--accent); }

.quiz-card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 16px;
padding: 20px 18px;
margin-bottom: 14px;
}
.quiz-question {
font-size: clamp(14px, 4vw, 16px);
line-height: 1.6;
color: var(--text);
margin-bottom: 18px;
font-weight: 400;
}
.quiz-options {
display: flex;
flex-direction: column;
gap: 9px;
}
.quiz-opt {
padding: 12px 14px;
border-radius: 11px;
border: 1px solid var(--border);
background: var(--surface2);
color: var(--text);
font-size: 14px;
font-weight: 400;
cursor: pointer;
text-align: left;
transition: all 0.18s;
font-family: ‘DM Sans’, sans-serif;
line-height: 1.45;
display: flex;
align-items: flex-start;
gap: 10px;
}
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt.correct { background: rgba(56,217,169,0.12); border-color: var(--green); color: var(--green); }
.quiz-opt.wrong { background: rgba(255,107,107,0.1); border-color: var(--red); color: var(--red); }
.quiz-opt.show-correct { background: rgba(56,217,169,0.08); border-color: var(--green); color: var(--green); }
.quiz-opt .opt-label {
font-weight: 700;
font-size: 13px;
flex-shrink: 0;
margin-top: 1px;
opacity: 0.6;
}
.quiz-opt.correct .opt-label,
.quiz-opt.wrong .opt-label,
.quiz-opt.show-correct .opt-label { opacity: 1; }
.quiz-opt[disabled] { cursor: default; }

.quiz-explanation {
margin-top: 13px;
padding: 12px 14px;
background: rgba(79,156,249,0.07);
border: 1px solid rgba(79,156,249,0.2);
border-radius: 10px;
font-size: 13px;
color: var(--muted);
line-height: 1.55;
display: none;
}
.quiz-explanation.visible { display: block; }
.quiz-explanation strong { color: var(--accent); }

.quiz-next-btn {
width: 100%;
padding: 13px;
border-radius: 12px;
border: none;
background: var(--accent);
color: #fff;
font-size: 15px;
font-weight: 600;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
transition: opacity 0.18s;
display: none;
}
.quiz-next-btn.visible { display: block; }
.quiz-next-btn:hover { opacity: 0.88; }

/* TF Buttons */
.tf-buttons {
display: flex;
gap: 10px;
}
.tf-btn {
flex: 1;
padding: 14px;
border-radius: 12px;
border: 1px solid var(--border);
background: var(--surface2);
color: var(--text);
font-size: 16px;
font-weight: 700;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
transition: all 0.18s;
}
.tf-btn.true-btn:hover { background: rgba(56,217,169,0.1); border-color: var(--green); }
.tf-btn.false-btn:hover { background: rgba(255,107,107,0.1); border-color: var(--red); }
.tf-btn.correct { background: rgba(56,217,169,0.15); border-color: var(--green); color: var(--green); }
.tf-btn.wrong { background: rgba(255,107,107,0.12); border-color: var(--red); color: var(--red); }
.tf-btn[disabled] { cursor: default; }

/* Result screen */
.quiz-result {
display: none;
text-align: center;
padding: 30px 20px;
}
.quiz-result.visible { display: block; }
.result-score {
font-family: ‘Syne’, sans-serif;
font-size: 64px;
font-weight: 800;
line-height: 1;
color: var(--accent);
margin: 16px 0 8px;
}
.result-label {
font-size: 14px;
color: var(--muted);
margin-bottom: 24px;
}
.result-stats {
display: flex;
gap: 10px;
justify-content: center;
margin-bottom: 28px;
}
.stat-chip {
padding: 8px 16px;
border-radius: 12px;
font-size: 14px;
font-weight: 600;
}
.stat-chip.green { background: rgba(56,217,169,0.12); color: var(--green); }
.stat-chip.red { background: rgba(255,107,107,0.12); color: var(--red); }
.restart-btn {
padding: 13px 32px;
border-radius: 12px;
border: none;
background: var(--accent);
color: #fff;
font-size: 15px;
font-weight: 600;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
}

/* start screen */
.quiz-start {
text-align: center;
padding: 20px 0;
}
.quiz-start h2 {
font-family: ‘Syne’, sans-serif;
font-size: 22px;
font-weight: 700;
margin-bottom: 8px;
}
.quiz-start p {
color: var(--muted);
font-size: 14px;
margin-bottom: 24px;
line-height: 1.55;
}
.start-options {
display: flex;
flex-direction: column;
gap: 10px;
max-width: 320px;
margin: 0 auto 20px;
}
.start-opt-btn {
padding: 16px 18px;
border-radius: 13px;
border: 1px solid var(--border);
background: var(--surface);
color: var(--text);
text-align: left;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
transition: all 0.2s;
}
.start-opt-btn:hover { border-color: var(--accent); background: var(--surface2); }
.start-opt-btn .sot { font-size: 15px; font-weight: 600; display: block; margin-bottom: 3px; }
.start-opt-btn .son { font-size: 12px; color: var(--muted); }

/* scrollbar */
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

@media (min-width: 480px) {
.fc-controls { max-width: 320px; margin: 0 auto 14px; }
.start-options { gap: 12px; }
}


/* ══════════════════════════════════════
   DESIGN OVERHAUL — Premium Medical UI
══════════════════════════════════════ */

/* Enhanced root variables */
:root {
  --bg: #080d14;
  --surface: #0f1620;
  --surface2: #161f2e;
  --surface3: #1c2840;
  --border: #1e2d45;
  --border2: #243550;
  --text: #e4eaf5;
  --text2: #a8b8d8;
  --muted: #5a6e8f;
  --accent: #3d8ef0;
  --accent-glow: rgba(61,142,240,0.18);
  --accent2: #30d4a0;
  --accent2-glow: rgba(48,212,160,0.15);
  --red: #f06060;
  --green: #30d4a0;
  --yellow: #f0c030;
  --card-h: clamp(210px, 52vw, 330px);
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
}

/* Subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(61,142,240,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,142,240,0.025) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}
.topbar, .main, .bottomnav { position: relative; z-index: 1; }

/* Enhanced topbar */
.topbar {
  background: linear-gradient(180deg, #0d1624 0%, #0a1220 100%);
  border-bottom: 1px solid var(--border2);
  padding: 14px 18px 12px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.topbar h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text) 0%, var(--text2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar h1 span {
  background: linear-gradient(135deg, var(--accent) 0%, #60b4ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.badge {
  font-size: 10px;
  background: linear-gradient(135deg, var(--accent) 0%, #2a7de0 100%);
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
  box-shadow: 0 2px 8px rgba(61,142,240,0.3);
}

/* Enhanced bottom nav */
.bottomnav {
  background: linear-gradient(180deg, #0a1220 0%, #080d14 100%);
  border-top: 1px solid var(--border2);
  box-shadow: 0 -2px 20px rgba(0,0,0,0.4);
}
.navbtn {
  padding: 10px 8px 12px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2px;
  transition: color 0.2s, transform 0.15s;
}
.navbtn.active {
  color: var(--accent);
}
.navbtn.active svg {
  filter: drop-shadow(0 0 4px rgba(61,142,240,0.5));
}
.navbtn:active { transform: scale(0.93); }

/* Enhanced filter tabs */
.filter-row { gap: 7px; padding-bottom: 6px; }
.filter-btn {
  padding: 8px 14px;
  border-radius: 22px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1px;
  transition: all 0.18s;
}
.filter-btn:active { transform: scale(0.95); }
.filter-btn.active {
  background: linear-gradient(135deg, var(--accent) 0%, #2a7de0 100%);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px rgba(61,142,240,0.35);
}

/* Enhanced flashcard */
.fc-counter {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.fc-counter strong { color: var(--accent); }

.fc-scene { cursor: pointer; }
.fc-front {
  background: linear-gradient(160deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border2);
  box-shadow: var(--shadow);
}
.fc-front:active { transform: scale(0.98); }
.fc-back {
  background: linear-gradient(160deg, #0e1e36 0%, #112240 100%);
  border: 1px solid rgba(61,142,240,0.25);
  box-shadow: var(--shadow), 0 0 30px rgba(61,142,240,0.06);
}
.fc-tag {
  font-size: 9px;
  letter-spacing: 1.2px;
  background: var(--accent-glow);
  border: 1px solid rgba(61,142,240,0.2);
  color: var(--accent);
  padding: 4px 10px;
  border-radius: 12px;
}
.fc-question {
  font-size: clamp(14px, 3.8vw, 17px);
  line-height: 1.6;
  color: var(--text);
}
.fc-answer {
  font-size: clamp(13px, 3.6vw, 16px);
  line-height: 1.65;
  color: var(--accent2);
}
.fc-answer-label {
  color: var(--accent2);
  opacity: 0.6;
  font-size: 9px;
  letter-spacing: 1.2px;
}
.fc-tap-hint { color: var(--muted); font-size: 11px; margin-top: 14px; }

/* Enhanced fc controls */
.fc-btn {
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  padding: 12px;
  transition: all 0.18s;
  min-height: 48px;
}
.fc-btn:active { transform: scale(0.96); }
.fc-btn:hover { background: var(--surface2); border-color: var(--accent); }
.fc-btn.primary {
  background: linear-gradient(135deg, var(--accent) 0%, #2a7de0 100%);
  border-color: transparent;
  box-shadow: 0 3px 14px rgba(61,142,240,0.35);
}
.fc-small-btn {
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 9px 18px;
  min-height: 40px;
  transition: all 0.18s;
}
.fc-small-btn:active { transform: scale(0.95); }
.fc-small-btn:hover { color: var(--text); border-color: var(--accent); }

/* Enhanced quiz start screen */
.quiz-start { text-align: center; padding: 12px 0; }
.quiz-start h2 {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--text) 0%, var(--text2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.quiz-start p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.start-options { display: flex; flex-direction: column; gap: 9px; max-width: 340px; margin: 0 auto 16px; }

.start-opt-btn {
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  min-height: 56px;
  position: relative;
  overflow: hidden;
}
.start-opt-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
  border-radius: 3px 0 0 3px;
}
.start-opt-btn:hover { border-color: var(--accent); background: var(--surface2); }
.start-opt-btn:hover::before { opacity: 1; }
.start-opt-btn:active { transform: scale(0.98); }
.start-opt-btn .sot { font-size: 14px; font-weight: 700; display: block; margin-bottom: 3px; }
.start-opt-btn .son { font-size: 11px; color: var(--muted); }

.start-opt-all {
  border-color: var(--accent) !important;
  background: linear-gradient(135deg, rgba(61,142,240,0.1) 0%, rgba(61,142,240,0.05) 100%) !important;
}
.start-opt-all::before { opacity: 1 !important; background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%) !important; }
.start-opt-all .sot { color: var(--accent); }

/* Enhanced quiz active */
.quiz-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.quiz-back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.18s;
  flex-shrink: 0;
  min-height: 36px;
}
.quiz-back-btn:hover { color: var(--text); border-color: var(--accent); }
.quiz-back-btn:active { transform: scale(0.95); }
.quiz-q-num { font-size: 12px; color: var(--muted); font-weight: 600; flex: 1; text-align: center; }
.quiz-score-chip {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent2);
  background: var(--accent2-glow);
  border: 1px solid rgba(48,212,160,0.2);
  padding: 4px 12px;
  border-radius: 20px;
  flex-shrink: 0;
}

/* Enhanced progress bar */
.quiz-progress-bar {
  height: 3px;
  background: var(--surface2);
  border-radius: 4px;
  margin-bottom: 14px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 8px rgba(61,142,240,0.4);
}

/* Enhanced quiz card */
.quiz-card {
  background: linear-gradient(160deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.quiz-type-badge { font-size: 9px; padding: 4px 10px; border-radius: 12px; font-weight: 700; letter-spacing: 0.8px; }
.quiz-type-badge.tf { background: rgba(240,192,48,0.12); color: var(--yellow); border: 1px solid rgba(240,192,48,0.2); }
.quiz-type-badge.mcq { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(61,142,240,0.2); }
.quiz-question {
  font-size: clamp(14px, 3.8vw, 16px);
  line-height: 1.65;
  color: var(--text);
  margin-bottom: 16px;
  margin-top: 10px;
}

/* Enhanced quiz options */
.quiz-opt {
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  transition: all 0.18s;
  min-height: 52px;
}
.quiz-opt:hover { border-color: var(--accent); background: var(--surface3); }
.quiz-opt:active { transform: scale(0.99); }
.quiz-opt.correct { background: rgba(48,212,160,0.1); border-color: var(--green); color: var(--green); box-shadow: 0 0 12px rgba(48,212,160,0.1); }
.quiz-opt.wrong { background: rgba(240,96,96,0.1); border-color: var(--red); color: var(--red); }
.quiz-opt.show-correct { background: rgba(48,212,160,0.07); border-color: var(--green); color: var(--green); }
.quiz-opt .opt-label { font-weight: 700; font-size: 12px; opacity: 0.5; flex-shrink: 0; }

/* Enhanced T/F buttons */
.tf-buttons { display: flex; gap: 10px; }
.tf-btn {
  flex: 1;
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.18s;
  min-height: 56px;
}
.tf-btn:active { transform: scale(0.97); }
.tf-btn.true-btn:hover { background: rgba(48,212,160,0.1); border-color: var(--green); }
.tf-btn.false-btn:hover { background: rgba(240,96,96,0.1); border-color: var(--red); }
.tf-btn.correct { background: rgba(48,212,160,0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 12px rgba(48,212,160,0.1); }
.tf-btn.wrong { background: rgba(240,96,96,0.12); border-color: var(--red); color: var(--red); }

/* Enhanced explanation */
.quiz-explanation {
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--accent-glow);
  border: 1px solid rgba(61,142,240,0.18);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  animation: fadeSlideUp 0.3s ease;
}
.quiz-explanation strong { color: var(--accent); }

/* Enhanced next button */
.quiz-next-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--accent) 0%, #2a7de0 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  min-height: 52px;
  box-shadow: 0 4px 18px rgba(61,142,240,0.35);
  transition: opacity 0.18s, transform 0.15s;
  letter-spacing: 0.2px;
  animation: fadeSlideUp 0.3s ease;
}
.quiz-next-btn:active { transform: scale(0.98); opacity: 0.9; }

/* Enhanced result screen */
.quiz-result { padding: 28px 16px; text-align: center; }
.result-score {
  font-family: 'Syne', sans-serif;
  font-size: 68px;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 14px 0 8px;
  filter: drop-shadow(0 0 20px rgba(61,142,240,0.2));
}
.result-label { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.result-stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
.stat-chip { padding: 9px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; border: 1px solid transparent; }
.stat-chip.green { background: rgba(48,212,160,0.1); color: var(--green); border-color: rgba(48,212,160,0.2); }
.stat-chip.red { background: rgba(240,96,96,0.1); color: var(--red); border-color: rgba(240,96,96,0.2); }
.restart-btn {
  padding: 14px 36px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--accent) 0%, #2a7de0 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  box-shadow: 0 4px 18px rgba(61,142,240,0.35);
  min-height: 52px;
  transition: transform 0.15s;
}
.restart-btn:active { transform: scale(0.97); }

/* Confirm modal */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: scaleIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.confirm-icon { font-size: 36px; margin-bottom: 14px; }
.confirm-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.confirm-msg { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
.confirm-msg strong { color: var(--text); }
.confirm-btns { display: flex; gap: 10px; }
.confirm-no {
  flex: 1;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  min-height: 48px;
  transition: all 0.18s;
}
.confirm-no:hover { border-color: var(--accent); }
.confirm-yes {
  flex: 1;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--red) 0%, #d04040 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  min-height: 48px;
  box-shadow: 0 3px 12px rgba(240,96,96,0.3);
  transition: transform 0.15s;
}
.confirm-yes:active { transform: scale(0.97); }

/* Keyframe animations */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

/* Section transitions */
.section { animation: fadeSlideUp 0.25s ease; }

/* Scrollbar */
.main::-webkit-scrollbar { width: 3px; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── MOBILE & iOS FIXES ── */
/* Safe area insets for iPhone notch/home bar */
body {
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav {
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  padding-top: max(14px, env(safe-area-inset-top));
}

/* Prevent iOS text size adjust */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Prevent tap highlight on buttons */
button, [role="button"] {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* Minimum tap target size (44px) for all interactive elements */
.navbtn { min-height: 52px; }
.fc-btn { min-height: 48px; }
.fc-small-btn { min-height: 44px; padding: 10px 18px; }
.filter-btn { min-height: 38px; }
.quiz-opt { min-height: 52px; padding: 14px; }
.tf-btn { min-height: 56px; padding: 16px; }
.quiz-next-btn { min-height: 52px; padding: 15px; }
.restart-btn { min-height: 52px; padding: 15px 36px; }
.start-opt-btn { min-height: 56px; padding: 16px 18px; }

/* Fix font sizes to prevent iOS auto-zoom (must be >= 16px on inputs) */
.quiz-opt { font-size: 15px; }
.tf-btn { font-size: 17px; }
.quiz-next-btn { font-size: 16px; }

/* Better card flip on mobile */
.fc-scene { -webkit-perspective: 1000px; }
.fc-card { -webkit-transform-style: preserve-3d; }
.fc-front, .fc-back { -webkit-backface-visibility: hidden; }

/* Improve touch scrolling */
.main { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.filter-row { -webkit-overflow-scrolling: touch; }

/* Better visual feedback for card tap */
.fc-scene:active { opacity: 0.92; transform: scale(0.995); }
.fc-scene { transition: opacity 0.1s, transform 0.1s; }

/* Prevent text selection on tap */
.fc-scene, .navbtn, .fc-btn, .fc-small-btn, .filter-btn { user-select: none; -webkit-user-select: none; }

/* Desktop: constrain width */
@media (min-width: 600px) and (max-width: 767px) {
  body { max-width: 560px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}

/* ══════════════════════════════════════
   iPAD / TABLET (768px+)
══════════════════════════════════════ */
@media (min-width: 768px) {
  body { max-width: 100%; font-size: 16px; }
  body::before { background-size: 52px 52px; }

  /* Topbar */
  .topbar { padding: 18px 40px 16px; }
  .topbar h1 { font-size: 22px; }
  .badge { font-size: 12px; padding: 5px 14px; }
  #themeBtn { font-size: 13px; padding: 7px 16px; min-height: 36px; }

  /* Bottom nav */
  .bottomnav { padding: 0 80px; }
  .navbtn { font-size: 13px; padding: 14px 30px 16px; gap: 6px; }
  .navbtn svg { width: 26px; height: 26px; }

  /* Section wrapper */
  .section { padding: 30px 48px 120px; max-width: 860px; margin: 0 auto; }

  /* Filter tabs */
  .filter-row { gap: 9px; }
  .filter-btn { font-size: 13px; padding: 10px 20px; min-height: 42px; }

  /* Flashcard */
  :root { --card-h: clamp(260px, 30vw, 380px); }
  .fc-scene { max-width: 680px; margin: 0 auto 22px; }
  .fc-counter { font-size: 14px; margin-bottom: 14px; }
  .fc-question { font-size: clamp(16px, 2.3vw, 20px); }
  .fc-answer  { font-size: clamp(15px, 2.1vw, 18px); }
  .fc-controls { max-width: 420px; margin: 0 auto 18px; gap: 14px; }
  .fc-btn { padding: 14px; font-size: 15px; min-height: 52px; }
  .fc-small-btn { padding: 12px 26px; font-size: 13px; min-height: 46px; }
  .fc-shuffle-row { gap: 12px; }

  /* Quiz start – 2-column grid */
  .quiz-start h2 { font-size: 28px; }
  .quiz-start p  { font-size: 15px; margin-bottom: 24px; }
  .start-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 680px;
    margin: 0 auto 24px;
  }
  .start-opt-all { grid-column: 1 / -1; }
  .start-opt-btn { min-height: 70px; padding: 18px 22px; }
  .start-opt-btn .sot { font-size: 15px; }
  .start-opt-btn .son { font-size: 12px; }

  /* Quiz active */
  .quiz-header        { max-width: 680px; margin: 0 auto 14px; }
  .quiz-progress-bar  { max-width: 680px; margin: 0 auto 18px; }
  .quiz-card          { max-width: 680px; margin: 0 auto 16px; padding: 26px 28px; }
  .quiz-question      { font-size: clamp(16px, 2.1vw, 18px); margin-bottom: 22px; }
  .quiz-options       { gap: 11px; }
  .quiz-opt           { font-size: 16px; padding: 16px 18px; min-height: 60px; }
  .tf-buttons         { gap: 14px; }
  .tf-btn             { font-size: 20px; padding: 22px; min-height: 74px; letter-spacing: 0.5px; }
  .quiz-explanation   { max-width: 680px; margin: 14px auto 0; font-size: 14px; line-height: 1.65; }
  .quiz-next-btn      { max-width: 680px; margin: 14px auto 0; display: block;
                        font-size: 17px; padding: 17px; min-height: 58px; }

  /* Result */
  .quiz-result { padding: 40px 24px; }
  .result-score { font-size: 92px; }
  .result-label { font-size: 16px; }
  .stat-chip  { font-size: 16px; padding: 12px 28px; }
  .restart-btn { font-size: 17px; padding: 17px 52px; min-height: 58px; }

  /* Confirm modal */
  .confirm-box  { max-width: 420px; padding: 36px 34px; }
  .confirm-title { font-size: 20px; }
  .confirm-msg   { font-size: 14px; }
  .confirm-no, .confirm-yes { min-height: 52px; font-size: 15px; }
}

/* iPAD light mode overrides */
body.light .tf-btn             { background: #f4f8ff; border-color: var(--border2); color: var(--text); }
body.light .tf-btn.true-btn:hover  { background: #d0f4e8; border-color: #0c9e72; color: #087050; }
body.light .tf-btn.false-btn:hover { background: #fde6e6; border-color: #c02020; color: #961818; }
body.light .tf-btn.correct         { background: #d0f4e8; border-color: #0c9e72; color: #087050; box-shadow: 0 0 0 1px #0c9e72; }
body.light .tf-btn.wrong           { background: #fde6e6; border-color: #c02020; color: #961818; }
body.light .tf-btn[disabled]       { cursor: default; }

/* Very small screens (SE, etc.) */
@media (max-width: 360px) {
  .topbar h1 { font-size: 15px; }
  .fc-controls { gap: 8px; }
  .fc-btn { font-size: 13px; }
  .result-score { font-size: 52px; }
}


/* ══════════════════════════════════════
   MOBILE-FIRST ENHANCEMENTS v2
══════════════════════════════════════ */

/* Snap-smooth scrolling for main content */
.main { scroll-behavior: smooth; overscroll-behavior: contain; }

/* Better section padding for tall phones */
.section { padding: 14px 14px 96px; }
.section.active { display: flex; flex-direction: column; }
#section-quiz .quiz-start { overflow-y: auto; }

/* Filter row: momentum scroll + snap on mobile */
.filter-row {
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  padding: 2px 0 8px;
}
.filter-btn { scroll-snap-align: start; }

/* Flashcard: larger tap area, better spacing */
.fc-scene { margin-bottom: 14px; touch-action: manipulation; }

/* Better card text overflow handling */
.fc-question, .fc-answer {
  overflow-y: auto;
  max-height: 180px;
  -webkit-overflow-scrolling: touch;
  word-break: break-word;
  hyphens: auto;
}

/* Bigger nav icons on small screens */
.navbtn svg { width: 20px; height: 20px; }

/* Quiz options: word wrap for long options */
.quiz-opt span:last-child { word-break: break-word; }

/* Better spacing on very small phones */
@media (max-width: 360px) {
  .filter-btn { padding: 7px 11px; font-size: 11px; }
  .quiz-card { padding: 14px 12px; }
  .quiz-opt { padding: 11px 12px; font-size: 13px; min-height: 48px; }
  .tf-btn { font-size: 14px; padding: 14px; }
  .start-opt-btn { padding: 12px 14px; }
  .start-opt-btn .sot { font-size: 13px; }
  .result-score { font-size: 56px; }
  .fc-btn { font-size: 13px; }
}

/* Landscape phone: reduce card height */
@media (max-height: 500px) and (orientation: landscape) {
  :root { --card-h: 180px; }
  .section { padding-bottom: 72px; }
  .fc-question, .fc-answer { max-height: 100px; font-size: 13px; }
}

/* Larger phones (414px+): slightly more breathing room */
@media (min-width: 414px) {
  .section { padding: 16px 16px 100px; }
  .start-options { gap: 10px; }
  .quiz-opt { padding: 14px 16px; }
}

/* Desktop: constrain to phone-like width (phones only, not iPad) */
@media (min-width: 540px) and (max-width: 767px) {
  body { max-width: 480px; margin: 0 auto; }
  body::before { background-size: 40px 40px; }
}

/* Smooth card flip on all devices */
.fc-card {
  transition: transform 0.42s cubic-bezier(0.35, 0, 0.25, 1);
  will-change: transform;
}
.fc-scene { will-change: auto; }

/* Active states: native-feel press feedback */
.quiz-opt:active { opacity: 0.85; transform: scale(0.99); }
.start-opt-btn:active { transform: scale(0.98); background: var(--surface2) !important; }
.navbtn:active { opacity: 0.7; }
.filter-btn:active { transform: scale(0.95); }

/* Progress bar with shimmer animation */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.quiz-progress-fill {
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
}

/* Score animation on result screen */
@keyframes countUp {
  from { opacity: 0; transform: scale(0.7) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.quiz-result.visible .result-score {
  animation: countUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
}
.quiz-result.visible .result-stats {
  animation: fadeSlideUp 0.4s ease 0.3s both;
}
.quiz-result.visible .restart-btn {
  animation: fadeSlideUp 0.4s ease 0.45s both;
}

/* Stagger quiz options appearance */
.quiz-options .quiz-opt:nth-child(1) { animation: fadeSlideUp 0.2s ease 0.05s both; }
.quiz-options .quiz-opt:nth-child(2) { animation: fadeSlideUp 0.2s ease 0.1s both; }
.quiz-options .quiz-opt:nth-child(3) { animation: fadeSlideUp 0.2s ease 0.15s both; }
.quiz-options .quiz-opt:nth-child(4) { animation: fadeSlideUp 0.2s ease 0.2s both; }

/* TF buttons stagger */
.tf-buttons .tf-btn:nth-child(1) { animation: fadeSlideUp 0.2s ease 0.05s both; }
.tf-buttons .tf-btn:nth-child(2) { animation: fadeSlideUp 0.2s ease 0.1s both; }

/* Improved explanation visibility */
.quiz-explanation.visible {
  animation: fadeSlideUp 0.25s ease both;
}

/* Next button pulse on first appearance */
@keyframes pulseIn {
  0% { opacity: 0; transform: scale(0.95) translateY(6px); }
  60% { transform: scale(1.02) translateY(0); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.quiz-next-btn.visible { animation: pulseIn 0.3s ease both; }

/* Confirm modal improvements */
.confirm-box {
  transform-origin: center bottom;
}
@media (max-width: 400px) {
  .confirm-box { padding: 24px 18px; }
  .confirm-title { font-size: 17px; }
  .confirm-msg { font-size: 12px; }
}

/* Better scrollbar for filter */
.filter-row::-webkit-scrollbar { height: 0; }

/* iOS keyboard: prevent layout shift */
@supports (-webkit-touch-callout: none) {
  .main { height: -webkit-fill-available; }
}


/* ── LIGHT MODE ── */
body.light {
  --bg: #f0f5fb;
  --surface: #ffffff;
  --surface2: #e6eef8;
  --surface3: #d8e5f3;
  --border: #c2d2e8;
  --border2: #aec0d8;
  --text: #0c1a36;
  --text2: #253858;
  --muted: #587090;
  --accent: #1a64cc;
  --accent-glow: rgba(26,100,204,0.10);
  --accent2: #0c9e72;
  --accent2-glow: rgba(12,158,114,0.10);
  --red: #c02020;
  --green: #0c9e72;
  --yellow: #906000;
  --shadow: 0 2px 16px rgba(8,24,60,0.08);
  --shadow-lg: 0 8px 32px rgba(8,24,60,0.12);
}
body.light::before {
  background-image:
    linear-gradient(rgba(26,100,204,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,100,204,0.04) 1px, transparent 1px);
}

/* Topbar & nav */
body.light .topbar {
  background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 100%);
  border-bottom-color: #c2d2e8;
  box-shadow: 0 1px 12px rgba(8,24,60,0.07);

  {cat:'wbc',q:'How are leukocytes (WBCs) defined?',a:'Colorless, nucleated formed elements of blood. They play a vital role in the body\'s defense mechanism.'},

  {cat:'wbc',q:'What are the functions of eosinophils?',a:'1. Detoxification, disintegration, and removal of foreign proteins. 2. Defense against parasitic infections. 3. Involved in allergic conditions (secrete cytotoxic substances to destroy parasites).'},
  {cat:'wbc',q:'Describe basophils — staining, diameter, granule contents.',a:'Coarse granules stain purple-blue with methylene blue (basic stain). Diameter: 8–10 µm. Bilobed nucleus. Granules contain heparin and histamine.'},
  {cat:'wbc',q:'What are the functions of basophils?',a:'Release heparin (anticoagulant) and histamine (allergy mediator). Play an important role in healing processes and acute hypersensitivity (allergic) reactions.'},

  {cat:'wbc',q:'What are tissue macrophages, and give examples.',a:'Mature monocytes that leave the blood and enter tissues. Examples: Kupffer cells (liver), alveolar macrophages (lungs), macrophages in spleen.'},
  {cat:'wbc',q:'Describe lymphocytes — nucleus, size classification.',a:'No granules. Nucleus: oval/bean/kidney-shaped, occupies almost the whole cytoplasm. Large lymphocytes (younger): 10–12 µm. Small lymphocytes (older): 7–10 µm.'},

  {cat:'wbc',q:'Describe the diurnal variation in WBC count.',a:'Minimum in early morning and maximum in the afternoon.'},
  {cat:'wbc',q:'TRAP: Does tuberculosis cause leukocytosis or leukopenia?',a:'LEUKOCYTOSIS (increase). Leukopenia (decrease) occurs in: viral infections, typhoid, anaphylactic shock, cirrhosis, spleen disorders, pernicious anemia.'},

  {cat:'wbc',q:'What is leukopoiesis?',a:'The development and maturation of leukocytes. All blood cells arise from pluripotent stem cells in bone marrow.'},
  {cat:'wbc',q:'Leukopoiesis pathway for granulocytes.',a:'Colony-forming unit-GM → Myeloblast → Promyelocyte → Granulocyte myelocyte → Metamyelocyte → Mature granulocyte (Neutrophil/Basophil/Eosinophil).'},
  {cat:'wbc',q:'Leukopoiesis pathway for monocytes.',a:'Promyelocyte → Monoblast → Promonocyte → Monocyte.'},
  {cat:'wbc',q:'Leukopoiesis pathway for lymphocytes.',a:'Lymphoid stem cell → Lymphoblast → Lymphocyte. This is a SEPARATE lineage from granulocytes/monocytes.'},
  {cat:'wbc',q:'What is innate (non-specific) immunity? Give examples.',a:'The inborn, non-specific resistance against ANY pathogen. Examples: destruction by salivary lysozyme, digestive enzymes, acidity in urine and vaginal fluid.'},
  {cat:'wbc',q:'What is acquired (specific) immunity? Who carries it out?',a:'Immunity developed after exposure to a specific foreign body. Carried out by lymphocytes (T and B cells).'},

  {cat:'wbc',q:'What are the four types of T lymphocytes and their functions?',a:'1. Helper T cells (Inducer) — assist other immune cells. 2. Cytotoxic T cells (Killer) — destroy infected/abnormal cells. 3. Suppressor T cells — regulate immune response. 4. Memory T cells — faster response on re-exposure.'},
  {cat:'wbc',q:'Where were B lymphocytes first discovered, and where are they processed in mammals?',a:'First discovered in the Bursa of Fabricius in birds. In mammals: processed in BONE MARROW and LIVER (no bursa).'},
  {cat:'wbc',q:'What are the two types of B lymphocytes and their functions?',a:'1. Plasma cells — produce antibodies to destroy foreign organisms. 2. Memory cells — activated on second antigen exposure, produce more antibodies faster.'},
  {cat:'wbc',q:'TRAP: T lymphocytes vs B lymphocytes — which does cellular immunity?',a:'T lymphocytes → CELLULAR (cell-mediated) immunity. B lymphocytes → HUMORAL (antibody-mediated) immunity.'},
  {cat:'wbc',q:'What are antigens, and what are they mostly made of?',a:'Substances that induce specific immune reactions. Mostly conjugated proteins: lipoproteins, glycoproteins, nucleoproteins.'},
  {cat:'wbc',q:'What are antibodies (immunoglobulins)? What % of plasma proteins?',a:'γ-globulins produced by plasma cells. Form 20% of total plasma proteins. There are 5 classes: IgG, IgA, IgM, IgE, IgD.'},
  {cat:'wbc',q:'Functions of the 5 immunoglobulin classes.',a:'IgG (75%): protects body fluids. IgA: protects body surfaces. IgM: protects bloodstream. IgE: mediates type I hypersensitivity. IgD: role not clearly known.'},

  {cat:'wbc',q:'Describe NK (Natural Killer) cells and how they destroy targets.',a:'Third type of lymphocyte. Large granular cells with indented nucleus. NOT phagocytic. Destroy malignant cells and cells of invading organisms using HYDROLYTIC ENZYMES (lysis). Prevent tumor development.'},

  {type:'tf',q:'Thymosin secreted by the thymus accelerates the proliferation and activation of T lymphocytes.',ans:true,exp:'Thymosin is secreted by the thymus. It accelerates proliferation and activation of lymphocytes in the thymus and increases lymphocyte activity in lymphoid tissues.'},
  {type:'tf',q:'After processing in the thymus, T lymphocytes are stored only in the lymph nodes.',ans:false,exp:'After transformation, T lymphocytes leave the thymus and are stored in lymphoid tissues of lymph nodes, SPLEEN, BONE MARROW, and the GI TRACT — not only lymph nodes.'},
  {type:'tf',q:'In mammals, B lymphocytes are processed in the bursa of Fabricius.',ans:false,exp:'The bursa of Fabricius is ABSENT in mammals. In mammals, B lymphocytes are processed in the BONE MARROW and LIVER.'},
  {type:'tf',q:'Memory B cells are activated during second exposure to the same antigen and produce more antibodies at a faster rate.',ans:true,exp:'Memory cells are activated during second exposure to the same antigen and produce a greater quantity of antibodies at a faster rate than the initial response.'},
  {type:'tf',q:'Antigens are mostly conjugated proteins such as lipoproteins, glycoproteins, and nucleoproteins.',ans:true,exp:'Antigens, which induce specific immune reactions, are mostly conjugated proteins like lipoproteins, glycoproteins, and nucleoproteins.'},
  {type:'tf',q:'Antigen-presenting cells present antigenic materials directly to cytotoxic T cells.',ans:false,exp:'Antigen-presenting cells (macrophages and dendritic cells) present antigenic materials to HELPER T CELLS, not cytotoxic T cells directly.'},
  {type:'tf',q:'IgA is the most abundant antibody, forming 75% of total antibodies in the body.',ans:false,exp:'IgG (not IgA) forms 75% of the antibodies in the body. IgA protects body SURFACES, while IgG protects body FLUIDS.'},
  {type:'tf',q:'IgM is responsible for protecting the bloodstream.',ans:true,exp:'IgM (Ig mu) protects the bloodstream. IgG protects body fluids, IgA protects body surfaces, and IgE mediates type I hypersensitivity.'},
  {type:'tf',q:'The role of IgD is clearly known and involves protection of body surfaces.',ans:false,exp:'The role of IgD is NOT clearly known. It is IgA, not IgD, that is responsible for protecting body surfaces.'},
  {type:'tf',q:'NK cells are considered the third type of lymphocyte and destroy malignant cells.',ans:true,exp:'NK (Natural Killer) cells are large granular cells with an indented nucleus and are considered the third type of lymphocyte. They destroy malignant cells and prevent development of cancerous tumors.'},
  {type:'tf',q:'NK cells destroy invading organisms through phagocytosis.',ans:false,exp:'NK cells are NOT phagocytic. They destroy cells of invading organisms using HYDROLYTIC ENZYMES contained in their granules, which cause lysis of the target cells.'},
  // ── MCQ (36) ──
  {type:'mcq',q:'White blood cells (leukocytes) are best described as:',opts:['Non-nucleated, colorless fragments of cytoplasm','Colorless and nucleated formed elements of blood','Red-pigmented cells with multilobed nucleus','Small anucleate cells involved in oxygen transport'],ans:1,exp:'WBCs are colorless and nucleated formed elements of blood. "Leuko" means white/colorless. They play a vital role in the defense mechanism of the body.'},
  {type:'mcq',q:'Granulocytes are classified into three types based on:',opts:['The size of the nucleus','The staining property of their granules','Their diameter and volume','The type of immunity they mediate'],ans:1,exp:'Granulocytes are classified depending on the staining property of their granules: neutrophils (both stains), eosinophils (acidic stain), and basophils (basic stain).'},
  {type:'mcq',q:'Neutrophils are also known as polymorphonuclear leukocytes because:',opts:['They have a single large kidney-shaped nucleus','Their nucleus has multiple lobes (1 to 6 lobes)','They contain both acidic and basic granules','They are the most numerous WBCs in blood'],ans:1,exp:'Neutrophils are known as polymorphonuclear leukocytes because the nucleus is multilobed, with the number of lobes varying from 1 to 6.'},
  {type:'mcq',q:'When neutrophil granules are stained with Leishman\'s stain, they appear:',opts:['Pink or red','Purple-blue','Violet','Green'],ans:2,exp:'Leishman\'s stain contains acidic eosin and basic methylene blue. Neutrophil granules take both stains equally, so they appear VIOLET in color.'},
  {type:'mcq',q:'Which WBC has a diameter of 10 to 12 µm and is described as ameboid and phagocytic?',opts:['Eosinophil','Basophil','Neutrophil','Lymphocyte'],ans:2,exp:'Neutrophils have a diameter of 10–12 µm and are ameboid and phagocytic in nature. They engulf bacteria and destroy them by phagocytosis.'},
  {type:'mcq',q:'Neutrophils reach the site of infection by moving through the process of:',opts:['Osmosis and diffusion','Diapedesis and chemotaxis','Phagocytosis and pinocytosis','Active transport and endocytosis'],ans:1,exp:'Neutrophils move by diapedesis toward the site of infection by means of chemotaxis, which occurs due to attraction by chemo-attractants released from the infected area.'},
  {type:'mcq',q:'Pus is composed of:',opts:['Dead bacteria only, collected from infected tissues','Dead WBCs, leaked plasma, liquefied tissue cells, and RBCs from damaged capillaries','Fibrin threads, platelets, and serum from clotted blood','Antibodies and complement proteins released by lymphocytes'],ans:1,exp:'Pus is a whitish-yellow fluid made up of: dead WBCs (killed by bacterial toxins), plasma leaked from blood vessels, liquefied tissue cells, and RBCs escaped from damaged capillaries.'},
  {type:'mcq',q:'Eosinophil granules stain with which type of stain and appear what color?',opts:['Basic stain — purple-blue','Acidic stain — pink or red','Both stains — violet','Neutral stain — pale yellow'],ans:1,exp:'Eosinophils have coarse (larger) granules in the cytoplasm, which stain pink or red with eosin (an acidic stain).'},
  {type:'mcq',q:'Which of the following is a function of eosinophils?',opts:['Producing antibodies against foreign antigens','Releasing heparin and histamine during allergy','Detoxification, disintegration, and removal of foreign proteins','Becoming tissue macrophages after leaving the bloodstream'],ans:2,exp:'Eosinophils are responsible for detoxification, disintegration, and removal of foreign proteins. They also provide defense against parasitic infections and allergic conditions.'},
  {type:'mcq',q:'Basophils perform their functions by releasing substances from their granules. These substances are:',opts:['Serotonin and ADP','Fibrinogen and PDGF','Heparin and histamine','Cytotoxic substances and interleukins'],ans:2,exp:'Basophils release heparin and histamine from their granules. They play an important role in healing processes and acute hypersensitivity reactions.'},
  {type:'mcq',q:'The diameter of basophils is:',opts:['5 to 7 µm','8 to 10 µm','10 to 14 µm','14 to 18 µm'],ans:1,exp:'The diameter of basophils is 8 to 10 µm. They have coarse granules that stain purple-blue with methylene blue and a bilobed nucleus.'},
  {type:'mcq',q:'Which leukocyte is the largest in size?',opts:['Neutrophil','Eosinophil','Lymphocyte','Monocyte'],ans:3,exp:'Monocytes are the largest leukocytes with a diameter of 14–18 µm. They have clear cytoplasm without granules and a nucleus that may be round, oval, horseshoe, bean, or kidney-shaped.'},
  {type:'mcq',q:'Mature monocytes leave the blood and enter tissues where they become:',opts:['Plasma cells producing antibodies','Memory T cells in lymph nodes','Tissue macrophages such as Kupffer cells and alveolar macrophages','Natural killer cells that destroy tumor cells'],ans:2,exp:'Matured monocytes stay in blood for a few hours, then enter tissues and become tissue macrophages. Examples: Kupffer cells (liver), alveolar macrophages (lungs), macrophages in spleen.'},
  {type:'mcq',q:'Kupffer cells found in the liver are examples of:',opts:['B lymphocytes that migrated to the liver','Tissue macrophages derived from monocytes','Dendritic cells acting as antigen-presenting cells','NK cells that prevent tumor formation in the liver'],ans:1,exp:'Kupffer cells in the liver are examples of tissue macrophages. Monocytes enter tissues from the blood and differentiate into tissue macrophages.'},
  {type:'mcq',q:'In lymphocytes, the nucleus:',opts:['Is multilobed and occupies one corner of the cell','Is bilobed and surrounded by coarse granules','Is oval or kidney-shaped and occupies the whole cytoplasm','Is round and placed at the center with abundant cytoplasm'],ans:2,exp:'In lymphocytes, the nucleus is oval, bean-shaped, or kidney-shaped and occupies the whole of the cytoplasm. A rim of cytoplasm may or may not be seen.'},
  {type:'mcq',q:'Large lymphocytes are described as younger cells with a diameter of:',opts:['5 to 7 µm','7 to 10 µm','10 to 12 µm','14 to 18 µm'],ans:2,exp:'Large lymphocytes are younger cells with a diameter of 10–12 µm. Small lymphocytes are older cells with a diameter of 7–10 µm.'},
  {type:'mcq',q:'The normal total leukocyte count (TC) in adults is:',opts:['1,000 to 4,000/cu mm','4,000 to 11,000/cu mm','11,000 to 20,000/cu mm','20,000 to 30,000/cu mm'],ans:1,exp:'The total leukocyte count (TC) in adults ranges between 4,000 and 11,000/cu mm of blood.'},
  {type:'mcq',q:'In the differential WBC count, which leukocyte has the highest normal percentage?',opts:['Lymphocytes (20–30%)','Monocytes (2–6%)','Neutrophils (50–70%)','Eosinophils (2–4%)'],ans:2,exp:'Neutrophils are the most numerous WBCs, comprising 50–70% of the total WBC count, with an absolute value of 3,000–6,000/cu mm.'},
  {type:'mcq',q:'Which WBC has the longest lifespan?',opts:['Neutrophils (2–5 days)','Eosinophils (7–12 days)','Basophils (12–15 days)','Lymphocytes (½ to 1 day)'],ans:2,exp:'Basophils have the longest lifespan of 12 to 15 days. Eosinophils live 7–12 days, neutrophils and monocytes 2–5 days, and lymphocytes only ½ to 1 day.'},
  {type:'mcq',q:'WBC count shows diurnal variation. It is:',opts:['Maximum in early morning and minimum in afternoon','Minimum in early morning and maximum in afternoon','Constant throughout the day with no variation','Maximum at night and minimum at noon'],ans:1,exp:'Diurnal variation in WBC count: MINIMUM in early morning and MAXIMUM in the afternoon.'},
  {type:'mcq',q:'Leukopenia (decrease in WBC count) occurs in all of the following EXCEPT:',opts:['Anaphylactic shock','Viral infections','Tuberculosis','Cirrhosis of the liver'],ans:2,exp:'Tuberculosis causes LEUKOCYTOSIS (increase), not leukopenia. Leukopenia occurs in anaphylactic shock, viral infections, typhoid, cirrhosis of liver, spleen disorders, and pernicious anemia.'},
  {type:'mcq',q:'In leukaemia, the total WBC count is usually above:',opts:['11,000/µL','20,000/µL','50,000/µL','5,000/µL'],ans:2,exp:'In leukaemia, the total WBC count is usually above 50,000/µL and may be as high as 100,000–300,000/µL, with immature WBCs present in peripheral blood.'},
  {type:'mcq',q:'Leukaemia primarily involves proliferation of leukaemic cells in:',opts:['The peripheral blood and spleen only','The bone marrow, and in certain forms the lymphoid tissues','The liver and thymus exclusively','The lymph nodes and skin only'],ans:1,exp:'The proliferation of leukaemic cells takes place primarily in the bone marrow and in certain forms in the lymphoid tissues.'},
  {type:'mcq',q:'Which property of WBCs allows them to squeeze through narrow blood vessels?',opts:['Chemotaxis','Phagocytosis','Diapedesis','Ameboid movement'],ans:2,exp:'Diapedesis is the property by which leukocytes squeeze through the narrow blood vessels to reach the site of infection.'},
  {type:'mcq',q:'Leukopoiesis is defined as:',opts:['The destruction and removal of old leukocytes','The development and maturation of leukocytes','The activation of leukocytes during infection','The measurement of leukocyte count in blood'],ans:1,exp:'Leukopoiesis is defined as the development and maturation of leukocytes. All blood cells arise from pluripotent stem cells.'},
  {type:'mcq',q:'In leukopoiesis, granulocytes originate from the:',opts:['Lymphoid stem cell via lymphoblast','Colony-forming unit-GM via myeloblast and promyelocyte','Colony-forming unit-E via erythroblast','Colony-forming unit-M via megakaryocyte'],ans:1,exp:'Granulocytes originate from colony-forming unit-GM → myeloblast → promyelocyte → granulocyte myelocyte → metamyelocyte → mature granulocyte (neutrophil, basophil, or eosinophil).'},
  {type:'mcq',q:'Innate immunity is also known as:',opts:['Acquired immunity','Specific immunity','Non-specific immunity','Cellular immunity'],ans:2,exp:'Innate immunity represents the inborn capacity of the body to resist pathogens and is called non-specific immunity. It is the first line of defense against any type of pathogen.'},
  {type:'mcq',q:'Which of the following is an example of innate immunity?',opts:['Antibody production by plasma cells','Activation of cytotoxic T cells against viruses','Destruction of bacteria by salivary lysozyme','Memory cell activation on second antigen exposure'],ans:2,exp:'Destruction of bacteria by salivary lysozyme is an example of innate immunity. Other examples include destruction by digestive enzymes and acidity in urine and vaginal fluid.'},
  {type:'mcq',q:'T lymphocytes are processed in the thymus, which secretes a hormone called:',opts:['Thyroxine','Thymosin','Thrombopoietin','Thyroglobulin'],ans:1,exp:'The thymus secretes thymosin, which accelerates the proliferation and activation of lymphocytes in the thymus and also increases the activity of lymphocytes in lymphoid tissues.'},
  {type:'mcq',q:'Which type of T lymphocyte is responsible for directly destroying infected cells?',opts:['Helper T cells (Inducer T cells)','Suppressor T cells','Memory T cells','Cytotoxic T cells (Killer T cells)'],ans:3,exp:'Cytotoxic T cells (killer T cells) are responsible for directly destroying infected or abnormal cells. They are one of the four types of T lymphocytes formed during processing in the thymus.'},
  {type:'mcq',q:'B lymphocytes were first discovered in which structure?',opts:['Bone marrow of mammals','Bursa of Fabricius in birds','Thymus gland of humans','Spleen of mice'],ans:1,exp:'B lymphocytes were first discovered in the bursa of Fabricius in birds, hence the name. The bursa is absent in mammals; B lymphocytes are processed in bone marrow and liver in mammals.'},
  {type:'mcq',q:'Plasma cells (a type of B lymphocyte) function to:',opts:['Present antigens to helper T cells','Remember antigens for faster response on re-exposure','Destroy foreign organisms by producing antibodies','Suppress the immune response after infection'],ans:2,exp:'Plasma cells are one of the two types of B lymphocytes. They destroy foreign organisms by producing antibodies.'},
  {type:'mcq',q:'Antibodies (immunoglobulins) form what percentage of total plasma proteins?',opts:['5%','10%','20%','35%'],ans:2,exp:'Antibodies are γ-globulins and are also called immunoglobulins (Ig). Immunoglobulins form 20% of the total plasma proteins.'},
  {type:'mcq',q:'IgG forms what percentage of the antibodies in the body?',opts:['20%','50%','75%','90%'],ans:2,exp:'IgG (Ig gamma) forms 75% of the antibodies in the body and is responsible for protecting body fluids.'},
  {type:'mcq',q:'Natural killer (NK) cells differ from neutrophils and monocytes in that NK cells:',opts:['Are found only in the lymph nodes','Are not phagocytic but use hydrolytic enzymes to lyse cells','Are the most numerous WBCs in peripheral blood','Are produced exclusively in the thymus'],ans:1,exp:'NK cells are not phagocytic cells. Their granules contain hydrolytic enzymes which cause lysis of cells of invading organisms, unlike neutrophils and monocytes which engulf by phagocytosis.'},
  {type:'mcq',q:'Which immunoglobulin mediates type I hypersensitivity reactions?',opts:['IgG','IgA','IgM','IgE'],ans:3,exp:'IgE (Ig epsilon) mediates type I hypersensitivity. IgG protects body fluids, IgA protects body surfaces, IgM protects the bloodstream, and IgD\'s role is not clearly known.'},
];

const ORG_CARDS = [
  // ── MOUTH & SALIVARY GLANDS ──
  {cat:'digestive',q:'What are the 6 major functions of the mouth?',a:'1. Ingestion 2. Mastication & mixing with saliva 3. Taste appreciation 4. Swallowing 5. Speech 6. Social functions (smiling)'},
  {cat:'digestive',q:'Name the 3 pairs of MAJOR salivary glands.',a:'1. Parotid glands 2. Submaxillary (submandibular) glands 3. Sublingual glands'},
  {cat:'digestive',q:'Name the 5 types of MINOR salivary glands.',a:'1. Lingual mucous 2. Lingual serous 3. Buccal glands (largest = molar glands) 4. Labial glands 5. Palatal glands'},
  {cat:'digestive',q:'Parotid gland: location, duct, and opening?',a:'Largest gland. Below & in front of the ear. Stensen\'s duct. Opens inside cheek opposite upper 2nd molar tooth.'},
  {cat:'digestive',q:'Submandibular gland: location, duct, and opening?',a:'Submaxillary triangle, medial to mandible. Wharton\'s duct. Opens at caruncula sublingualis (side of frenulum of tongue).'},
  {cat:'digestive',q:'Sublingual gland: location, duct, and opening?',a:'Smallest major gland. Floor of mouth. 5–15 Ducts of Rivinus + one Bartholin\'s duct. Opens near submaxillary duct.'},
  {cat:'digestive',q:'Duct summary: Parotid | Submandibular | Sublingual.',a:'Parotid → Stensen\'s duct. Submandibular → Wharton\'s duct. Sublingual → Ducts of Rivinus / Bartholin\'s duct.'},
  {cat:'digestive',q:'Classification of salivary glands by secretion type.',a:'SEROUS – thin watery (Parotid, lingual serous). MUCOUS – thick, high mucin (lingual mucous, buccal, palatal). MIXED – both (Submandibular, sublingual, labial).'},
  {cat:'digestive',q:'Daily volume and contributions of each major gland.',a:'1,000–1,500 mL/day ≈ 1 mL/min. Submandibular: 70% | Parotid: 25% | Sublingual: 5%.'},
  {cat:'digestive',q:'Physical properties of mixed saliva.',a:'pH: 6.35–6.85 (slightly acidic). Specific gravity: 1.002–1.012. Tonicity: HYPOTONIC to plasma.'},
  {cat:'digestive',q:'Composition of saliva.',a:'Water: 99.5%. Solids: 0.5% → Organic (enzymes, mucin, IgA, lysozyme) + Inorganic (Na, Ca, K, bicarbonate, fluoride) + Gases.'},
  {cat:'digestive',q:'Inorganic substances in saliva.',a:'Na, Ca, K, Bicarbonate, Bromide, Chloride, Fluoride, Phosphate. NOTE: Glucose ABSENT normally; appears in diabetes mellitus.'},
  {cat:'digestive',q:'What are the 3 digestive enzymes in saliva?',a:'1. Salivary amylase (ptyalin) – all glands 2. Maltase – major glands 3. Lingual lipase – lingual glands'},
  {cat:'digestive',q:'Salivary amylase: action and key facts.',a:'Amylolytic; converts cooked starch → dextrin + maltose. Optimum pH = 6. CANNOT digest cellulose.'},
  {cat:'digestive',q:'Lingual lipase: action.',a:'Lipolytic. Digests pre-emulsified (milk) fats. Hydrolyzes triglycerides → fatty acids + diacylglycerol.'},
  {cat:'digestive',q:'What are the 8 functions of saliva?',a:'1. Food prep for swallowing 2. Taste (dissolves food) 3. Digestion (amylase, maltase, lipase) 4. Cleansing/protective (lysozyme, IgA, mucin) 5. Speech 6. Excretion (mercury, Pb, viruses) 7. Temperature regulation (animals) 8. Water balance regulation'},
  {cat:'digestive',q:'How does saliva exert antibacterial protection?',a:'Lysozyme: kills Staphylococcus, Streptococcus, Brucella. Secretory IgA: antibacterial + antiviral. Mucin: lubricates oral mucosa. Cleanses food debris → prevents caries.'},
  {cat:'digestive',q:'Autonomic regulation of saliva: parasympathetic vs sympathetic.',a:'PARASYMPATHETIC → large watery saliva (few organics) via ACETYLCHOLINE + vasodilation. SYMPATHETIC → small, thick, mucous-rich saliva via NORADRENALINE + vasoconstriction.'},
  {cat:'digestive',q:'Drugs that INCREASE vs DECREASE salivary secretion.',a:'INCREASE: Sympathomimetics (adrenaline, ephedrine), Parasympathomimetics (pilocarpine, muscarine, physostigmine), Histamine. DECREASE: ATROPINE, scopolamine, ergotamine.'},
  {cat:'digestive',q:'Define hyposalivation and its types.',a:'Reduced saliva. TEMPORARY: fear, fever, dehydration. PERMANENT: sialolithiasis, congenital absence/hypoplasia, Bell\'s palsy. Consequence: dental caries.'},
  {cat:'digestive',q:'Define hypersalivation and its causes.',a:'Excess saliva. PHYSIOLOGICAL: Pregnancy. PATHOLOGICAL (ptyalism/sialorrhea): tooth decay, esophageal disease, neurological disorders (stroke, Parkinsonism).'},
  {cat:'digestive',q:'Define Xerostomia, Mumps, and Drooling.',a:'Xerostomia: Dry mouth (pasties/cotton mouth). Mumps: Viral parotid infection by PARAMYXOVIRUS; affects meninges, gonads, pancreas. Drooling: Uncontrolled saliva flow outside mouth.'},
  // ── PANCREAS ──
  {cat:'digestive',q:'What are the two functions of the pancreas?',a:'ENDOCRINE: hormones (insulin, glucagon, somatostatin). EXOCRINE: pancreatic digestive juice.'},
  {cat:'digestive',q:'Exocrine structure of the pancreas.',a:'Acini/alveoli with acinar cells containing ZYMOGEN GRANULES. Small ducts → intralobular duct → WIRSUNG\'S DUCT. Wirsung\'s + common bile duct = AMPULLA OF VATER → duodenum.'},
  {cat:'digestive',q:'Properties of pancreatic juice.',a:'Volume: 500–800 mL/day. HIGHLY ALKALINE pH 8–8.3. Specific gravity: 1.010–1.018. 99.5% water + 0.5% solids.'},
  {cat:'digestive',q:'Bicarbonate content of pancreatic juice and its significance.',a:'HCO₃⁻: 110–150 mEq/L (plasma = 24 mEq/L). Responsible for alkalinity. NEUTRALIZES acid chyme from stomach → protects intestinal mucosa.'},
  {cat:'digestive',q:'Classify the enzymes in pancreatic juice.',a:'PROTEOLYTIC: Trypsin, Chymotrypsin, Carboxypeptidases, Nuclease, Elastase, Collagenase. LIPOLYTIC: Pancreatic lipase, Cholesterol ester hydrolase, Phospholipase A&B, Colipase. AMYLOLYTIC: Pancreatic amylase.'},
  {cat:'digestive',q:'How is trypsinogen activated? What is autocatalysis?',a:'Trypsinogen → Trypsin via ENTEROKINASE (brush-border cells of duodenum). Autocatalytic: trypsin itself activates more trypsinogen.'},
  {cat:'digestive',q:'What enzymes does trypsin activate?',a:'Chymotrypsinogen → Chymotrypsin. Procarboxypeptidases → Carboxypeptidases. Proelastase → Elastase. Procolipase → Colipase. + Collagenase, Phospholipase A, Phospholipase B.'},
  {cat:'digestive',q:'Actions of Trypsin (6 actions).',a:'i. Most powerful proteolytic enzyme ii. Curdles milk iii. Accelerates blood clotting iv. Activates other proenzymes v. Activates collagenase, phospholipase A&B vi. Autocatalytic action'},
  {cat:'digestive',q:'Chymotrypsin: type and actions.',a:'ENDOPEPTIDASE. Actions: i. Digests proteins → polypeptides ii. Digests milk casein faster than trypsin iii. NO action on blood clotting.'},
  {cat:'digestive',q:'Carboxypeptidases: type and action.',a:'EXOPEPTIDASES (cleave terminal amino acids). Split polypeptides and proteins → free amino acids. Activated by trypsin.'},
  {cat:'digestive',q:'Pancreatic lipase: key facts.',a:'Most powerful lipolytic enzyme. Digests triglycerides → monoglycerides + fatty acids. pH: 7–9. Requires BILE SALTS + COLIPASE. Digests ~80% dietary fat. Deficiency → steatorrhea.'},
  {cat:'digestive',q:'Hormones that STIMULATE pancreatic secretion.',a:'SECRETIN (S cells, duodenum/jejunum) → watery juice, high bicarbonate, low enzymes. CCK (I cells, duodenum/jejunum) → enzyme-rich juice, less volume.'},
  {cat:'digestive',q:'Hormones that INHIBIT pancreatic secretion.',a:'1. Pancreatic polypeptide (PP cells). 2. Somatostatin (D cells, islets of Langerhans).'},
  {cat:'digestive',q:'How does the exocrine pancreas prevent autodigestion?',a:'Enzymes are secreted as INACTIVE ZYMOGENS (trypsinogen, chymotrypsinogen, etc.). Only activated INSIDE the duodenum by enterokinase.'},
  // ── LIVER & BILE ──
  {cat:'digestive',q:'Basic facts about the liver.',a:'Dual organ: SECRETORY + EXCRETORY. Largest gland: ~1.5 kg. Upper-right abdomen beneath diaphragm. Made of hepatic lobes → hepatic lobules (structural/functional unit).'},
  {cat:'digestive',q:'Describe the hepatic lobule structure.',a:'Honeycomb-like. HEPATOCYTES in hepatic plates. Between columns: BILE CANALICULUS. Between plates: SINUSOID (blood space). Between endothelial cells: KUPFFER CELLS.'},
  {cat:'digestive',q:'What is a portal triad?',a:'3 structures surrounding each lobule: 1. Branch of hepatic artery 2. Branch of portal vein 3. Tributary of bile duct.'},
  {cat:'digestive',q:'Blood flow pathway through the liver.',a:'Hepatic artery + Portal vein → Interlobular vein → SINUSOID → Central vein → Hepatic vein → IVC → Right atrium.'},
  {cat:'digestive',q:'The biliary system (extrahepatic biliary apparatus).',a:'Right + left hepatic ducts → COMMON HEPATIC DUCT + cystic duct → COMMON BILE DUCT + pancreatic duct → AMPULLA OF VATER → duodenum.'},
  {cat:'digestive',q:'What is the sphincter of Oddi?',a:'Smooth muscle sphincter at lower common bile duct. Normally CLOSED → bile stored in gallbladder. Opens on stimulation (CCK, food) → bile flows into intestine.'},
  {cat:'digestive',q:'Properties of bile.',a:'Color: golden yellow or greenish. Volume: 800–1,200 mL/day. ALKALINE pH 8–8.6. Specific gravity: 1.010–1.011. 97.6% water + 2.4% solids.'},
  {cat:'digestive',q:'Organic substances in bile.',a:'1. Bile salts 2. Bile pigments 3. Cholesterol 4. Fatty acids 5. Lecithin 6. Mucin.'},
  {cat:'digestive',q:'What are the 5 functions of bile salts?',a:'1. EMULSIFICATION of fat 2. ABSORPTION of fats (micelles) 3. CHOLERETIC ACTION (stimulate more bile) 4. LAXATIVE ACTION (stimulate peristalsis) 5. PREVENTION OF GALLSTONE FORMATION.'},
  {cat:'digestive',q:'What are bile pigments?',a:'Excretory products. Bilirubin (MAJOR, human) and Biliverdin. Formed from breakdown of HEMOGLOBIN by reticuloendothelial system.'},
  {cat:'digestive',q:'Stages of formation of bilirubin.',a:'Senile RBCs → Hb released → Heme + Globin → Biliverdin + Iron → Bilirubin (free/unconjugated) → Liver conjugates with glucuronic acid → Conjugated bilirubin → excreted in bile → intestine.'},
  {cat:'digestive',q:'Bilirubin levels: normal, hyperbilirubinemia, jaundice.',a:'Normal: 0.5–1.5 mg/dL. >1 mg/dL = HYPERBILIRUBINEMIA. >2 mg/dL = JAUNDICE.'},
  {cat:'digestive',q:'What are the 9 functions of bile?',a:'1. Digestive 2. Absorptive (fat-soluble vitamins) 3. Excretory (pigments, metals, toxins) 4. Laxative 5. Antiseptic 6. Choleretic 7. Neutralizes acid chyme 8. Prevents gallstones 9. Lubrication (mucin).'},
  {cat:'digestive',q:'What are the 9 functions of the liver?',a:'1. Metabolic 2. Storage (glycogen, Fe, vitamins) 3. Synthetic (plasma proteins, glucose) 4. Bile secretion 5. Excretory 6. Heat production 7. Haemopoietic (fetal) 8. Hemolytic (Kupffer cells) 9. Inactivation of hormones/drugs.'},
  {cat:'digestive',q:'Synthetic function of the liver.',a:'Glucose by gluconeogenesis. ALL plasma proteins EXCEPT immunoglobulins (albumin, clotting factors, complement). Also: steroids, somatomedin, heparin.'},
  {cat:'digestive',q:'Two types of bilirubin.',a:'FREE (Unconjugated): in blood before liver; albumin-bound; fat-soluble. CONJUGATED (Direct): after conjugation with glucuronic acid in liver; water-soluble; excreted in bile.'},
  // ── HIGH-YIELD COMPARISONS ──
  {cat:'digestive',q:'TRAP: Which accelerates blood clotting – trypsin or chymotrypsin?',a:'TRYPSIN accelerates blood clotting and curdles milk. CHYMOTRYPSIN has NO action on blood clotting.'},
  {cat:'digestive',q:'TRAP: Secretin vs CCK – which stimulates what?',a:'SECRETIN (S cells) → bicarbonate-rich, watery juice. CCK (I cells) → enzyme-rich, less volume. (Secretin = Sodium bicarbonate; CCK = enzyme Cocktail)'},
  {cat:'digestive',q:'TRAP: Saliva is isotonic to plasma – True or False?',a:'FALSE. Saliva is HYPOTONIC to plasma (much lower electrolyte concentration).'},
  {cat:'digestive',q:'Compare pH: saliva vs pancreatic juice vs bile.',a:'Saliva: 6.35–6.85 (slightly ACIDIC). Pancreatic juice: 8.0–8.3 (highly ALKALINE). Bile: 8.0–8.6 (ALKALINE).'},
  {cat:'digestive',q:'TRAP: Does the liver produce immunoglobulins?',a:'NO. Liver produces ALL plasma proteins EXCEPT immunoglobulins. These are made by plasma cells (B lymphocytes).'},
  {cat:'digestive',q:'What happens to bilirubin in the intestine?',a:'Conjugated bilirubin → bacteria reduce it → UROBILINOGEN. Some reabsorbed → excreted in urine (urobilin). Rest → oxidized → STERCOBILIN (brown color of feces).'},
  {cat:'digestive',q:'MASTER: Enzyme activation chain.',a:'Enterokinase → Trypsin → activates ALL other proenzymes (chymotrypsinogen, procarboxypeptidases, proelastase, procolipase, phospholipase A&B).'},
  {cat:'digestive',q:'MASTER: Volume comparison of secretions.',a:'Saliva: 1,000–1,500 mL/day. Pancreatic juice: 500–800 mL/day. Bile: 800–1,200 mL/day.'},
  {cat:'digestive',q:'Molar glands: what are they?',a:'4–5 larger buccal glands situated OUTSIDE the buccinator muscle around the terminal part of the parotid duct. They are minor salivary glands.'},
  {cat:'digestive',q:'Excretory function of saliva.',a:'Excretes: mercury, lead, thiocyanate, potassium iodide, viruses (rabies, mumps). Pathological: glucose (diabetes), urea (nephritis), excess calcium (hyperparathyroidism).'},

  // ── ADDITIONAL CARDS (completing to 100) ──
  {cat:'digestive',q:'Two alternative names for the oral cavity?',a:'Oral cavity = Buccal cavity / Mouth. Formed by cheeks, lips, and palate. Encloses teeth, tongue, and salivary glands.'},
  {cat:'digestive',q:'Racemose (bunch-of-grapes) structure of salivary glands.',a:'Acini/alveoli (central cavity) → Intercalated duct → Intralobular duct → Interlobular duct → Main duct. Racemose = bunch-of-grapes appearance.'},
  {cat:'digestive',q:'Maltase: action and key fact.',a:'Converts maltose → glucose. Present only in TRACES in human saliva.'},
  {cat:'digestive',q:'Nerve supply of the pancreas.',a:'Sympathetic: via SPLANCHNIC NERVE. Parasympathetic: via VAGUS NERVE.'},
  {cat:'digestive',q:'Nucleases in pancreatic juice: types and actions.',a:'Ribonuclease: RNA → mononucleotides. Deoxyribonuclease: DNA → mononucleotides.'},
  {cat:'digestive',q:'Elastase and Collagenase: activation and actions.',a:'Elastase: proelastase → elastase (by trypsin); digests elastic fibers. Collagenase: procollagenase → collagenase (by trypsin); digests collagen.'},
  {cat:'digestive',q:'Cholesterol ester hydrolase, Phospholipase A, Phospholipase B.',a:'Cholesterol ester hydrolase: cholesterol ester → free cholesterol + fatty acid. Phospholipase A (trypsin-activated): lecithin + cephalin → lysolecithin + lysocephalin. Phospholipase B (trypsin-activated): lysolecithin + lysocephalin → phosphoryl choline + fatty acids.'},
  {cat:'digestive',q:'Colipase and pancreatic amylase roles.',a:'Colipase: small coenzyme for pancreatic lipase; facilitates fat hydrolysis; activated from procolipase by trypsin. Pancreatic amylase: converts starch → dextrin + maltose (like salivary amylase).'},
  {cat:'digestive',q:'Neutralizing function of pancreatic juice.',a:'Acid chyme from stomach → pancreatic juice (high HCO₃⁻) released → NEUTRALIZES acid chyme → protects intestinal mucosa from acid destruction.'},
  {cat:'digestive',q:'Inorganic substances in pancreatic juice.',a:'Na, Ca, K, Mg, Bicarbonate (110–150 mEq/L), Chloride, Phosphate, Sulfate. Bicarbonate is responsible for the high alkalinity.'},
  {cat:'digestive',q:'Organic substances in pancreatic juice.',a:'Enzymes (proteolytic, lipolytic, amylolytic) + Albumin + Globulin.'},
  {cat:'digestive',q:'What activates phospholipase A and B?',a:'Both are activated by TRYPSIN.'},
  {cat:'digestive',q:'Volume comparison: saliva vs pancreatic juice vs bile.',a:'Saliva: 1,000–1,500 mL/day. Pancreatic juice: 500–800 mL/day. Bile: 800–1,200 mL/day.'},
  {cat:'digestive',q:'Kupffer cells: what are they and what do they do?',a:'Special macrophages (reticuloendothelial cells) in liver sinusoids. Functions: destroy senile RBCs, body defense (phagocytosis of bacteria and foreign particles).'},
  {cat:'digestive',q:'Bile flow pathway from hepatocyte to duodenum.',a:'Hepatocytes secrete bile → Bile canaliculus → Tributary of bile duct → Small bile ducts → Left + Right hepatic ducts → Common hepatic duct → + cystic duct → Common bile duct → Ampulla of Vater → duodenum.'},
  {cat:'digestive',q:'Inorganic substances in bile.',a:'Na, Ca, K, Chloride, Bicarbonate. These contribute to bile\'s alkaline nature (pH 8–8.6).'},
  {cat:'digestive',q:'Bile salts: what are they and where are they formed?',a:'Sodium and potassium salts of bile acids (cholic/chenodeoxycholic acids), conjugated with GLYCINE or TAURINE. Formed in the LIVER.'},
  {cat:'digestive',q:'Storage function of the liver.',a:'Stores: glycogen, amino acids, iron, folic acid, vitamins A, B12, D.'},
  {cat:'digestive',q:'Haemopoietic function of the liver.',a:'In fetal life (hepatic stage): produces blood cells. Stores vitamin B12 (for erythropoiesis) and iron (for Hb synthesis). Produces THROMBOPOIETIN → promotes thrombocyte production.'},
  {cat:'digestive',q:'Hemolytic function of the liver.',a:'Kupffer cells (reticuloendothelial cells) destroy senile RBCs after their 120-day lifespan.'},
  {cat:'digestive',q:'What substances does the liver inactivate?',a:'Hormones: GH, parathormone, cortisol, insulin, glucagon, estrogen. Defensive: Kupffer cells phagocytose bacteria and foreign particles.'},
  {cat:'digestive',q:'How is bile stored and released?',a:'Sphincter of Oddi normally CLOSED → bile enters gallbladder via cystic duct → stored and concentrated. Upon stimulation (CCK, food) → sphincter OPENS → bile released into duodenum.'},
  {cat:'digestive',q:'TRAP: Compare 3 major glands: size, duct, classification.',a:'Parotid: LARGEST – Stensen\'s duct – SEROUS. Submandibular: MEDIUM – Wharton\'s duct – MIXED. Sublingual: SMALLEST – Rivinus/Bartholin\'s duct – MIXED.'},
  {cat:'digestive',q:'TRAP: Parotid contributes 70% of saliva. True or False?',a:'FALSE. SUBMANDIBULAR contributes 70%. Parotid: 25%, Sublingual: 5%.'},
  {cat:'digestive',q:'TRAP: Bile and pancreatic juice enter duodenum through the same opening?',a:'TRUE. Both enter via the AMPULLA OF VATER (common hepatopancreatic duct).'},
  {cat:'digestive',q:'pH comparison: salivary amylase vs pancreatic lipase.',a:'Salivary amylase: pH 6 (acid medium). Pancreatic lipase: pH 7–9 (near neutral to alkaline).'},
  {cat:'digestive',q:'TRAP: Difference between conjugated vs free bilirubin in blood tests.',a:'FREE (indirect): from RBC breakdown, before liver; albumin-bound; fat-soluble. CONJUGATED (direct): after liver processing with glucuronic acid; water-soluble; excreted in bile.'},
  {cat:'digestive',q:'What activates proelastase, procolipase, and procarboxypeptidases?',a:'All three are activated by TRYPSIN.'},
  {cat:'digestive',q:'TRAP: Does the liver produce immunoglobulins?',a:'NO. Liver produces ALL plasma proteins EXCEPT immunoglobulins. Immunoglobulins are produced by plasma cells (B lymphocytes).'},
  {cat:'digestive',q:'What is Wirsung\'s duct?',a:'Main pancreatic duct formed by union of all intralobular ducts. Joins common bile duct → AMPULLA OF VATER → opens into DUODENUM.'},
  {cat:'digestive',q:'Hyposalivation: temporary vs. permanent causes.',a:'TEMPORARY: fear, fever, dehydration. PERMANENT: sialolithiasis (duct stone/obstruction), congenital hypoplasia/absence, Bell\'s palsy (CN VII paralysis).'},
  {cat:'digestive',q:'What are ptyalism, sialorrhea, sialism, sialosis?',a:'All are names for HYPERSALIVATION in pathological conditions. Physiological hypersalivation: pregnancy only.'},
  {cat:'digestive',q:'Why is the liver called a dual organ?',a:'SECRETORY function: secretes bile (digestive). EXCRETORY function: excretes bile pigments, heavy metals, cholesterol.'},
  {cat:'digestive',q:'Role of bile salts in gallstone prevention.',a:'Bile salts keep cholesterol and lecithin IN SOLUTION. Absence of bile salts → cholesterol + lecithin precipitate → GALLSTONES form.'},
  {cat:'digestive',q:'TRAP: Saliva is isotonic to plasma. True or False?',a:'FALSE. Saliva is HYPOTONIC to plasma (much lower electrolyte concentration).'},
  {cat:'digestive',q:'Molar glands: definition and location.',a:'4–5 larger buccal glands situated OUTSIDE the buccinator muscle around the terminal part of the parotid duct. They are minor salivary glands.'},
  {cat:'digestive',q:'What happens to bilirubin after excretion in the intestine?',a:'Conjugated bilirubin → bacteria reduce → UROBILINOGEN. Some reabsorbed → excreted in urine (UROBILIN). Remainder → oxidized in stool → STERCOBILIN (brown color of feces).'},
  {cat:'digestive',q:'Choleretic action of bile salts.',a:'Bile salts stimulate the SECRETION OF BILE from liver hepatocytes. This is a positive feedback mechanism.'},
  {cat:'digestive',q:'Zymogen granules in pancreatic acinar cells.',a:'Secretory granules containing INACTIVE digestive enzymes (zymogens). Prevents autodigestion of the pancreas itself before activation in duodenum.'},
];
