  {type:'mcq',q:'Thrombospondin in platelet cytoplasm functions to:',opts:['Promote platelet adhesion','Cause platelet aggregation','Inhibit angiogenesis (formation of new blood vessels)','Facilitate wound healing'],ans:2,exp:'Thrombospondin inhibits angiogenesis, which is the formation of new blood vessels.'},
  {type:'mcq',q:'Alpha granules of platelets contain:',opts:['Nucleotides, serotonin, and lysosomes','Clotting factors V and XIII, fibrinogen, and PDGF','Calcium, phospholipid, and nucleotides','Histamine, adrenaline, and serotonin'],ans:1,exp:'Alpha granules contain clotting factors V and XIII, fibrinogen, and platelet-derived growth factor (PDGF).'},
  {type:'mcq',q:'Dense granules of platelets contain:',opts:['Clotting factors V and XIII, fibrinogen','Actin, myosin, and thrombosthenin','Nucleotides, serotonin, phospholipid, calcium, and lysosomes','ATPase and prostaglandin synthesis enzymes'],ans:2,exp:'Dense granules contain nucleotides, serotonin, phospholipid, calcium, and lysosomes.'},
  {type:'mcq',q:'The normal platelet count in peripheral blood is:',opts:['1,00,000 to 2,00,000/cu mm','2,00,000 to 4,00,000/cu mm','4,00,000 to 6,00,000/cu mm','5,00,000 to 7,00,000/cu mm'],ans:1,exp:'Normal platelet count is 2,50,000/cu mm, ranging between 2,00,000 and 4,00,000/cu mm of blood.'},
  {type:'mcq',q:'In infants, the platelet count reaches normal adult levels at:',opts:['1st week after birth','1st month after birth','3rd month after birth','6th month after birth'],ans:2,exp:'Platelets are less in infants (1,50,000 to 2,00,000/cu mm) and reach normal level at the 3rd month after birth.'},
  {type:'mcq',q:'Platelet count during menstruation in females:',opts:['Increases significantly','Remains unchanged','Is reduced','Doubles temporarily'],ans:2,exp:'In females, there is no difference in platelet count between males and females in general, but the count is reduced during menstruation.'},
  {type:'mcq',q:'Thrombocythemia is defined as:',opts:['Decrease in platelet count leading to purpura','Increase in platelet count seen after hemorrhage','Persistent and abnormal increase in platelet count','Structural abnormality of platelets'],ans:2,exp:"Thrombocythemia is the condition with persistent and abnormal increase in platelet count. It occurs in carcinoma, chronic leukemia, and Hodgkin\'s disease."},
  {type:'mcq',q:"Glanzmann\'s thrombasthenia is caused by:",opts:['Decrease in platelet count below 1,00,000/cu mm','Structural or functional abnormality of platelets (inherited)','Deficiency of von Willebrand factor','Deficiency of Factor VIII in the blood'],ans:1,exp:"Glanzmann\'s thrombasthenia is an inherited hemorrhagic disorder caused by structural or functional abnormality of platelets, leading to thrombasthenic purpura."},
  {type:'mcq',q:'During hemostasis, the platelet plug (Stage 2) is initiated when platelets adhere to:',opts:['Fibrin threads in the vessel wall','Collagen of the ruptured blood vessel','Thromboxane A2 released by neutrophils','Prothrombin activator from the liver'],ans:1,exp:'In Stage 2 of hemostasis, platelets get adhered to the collagen of the ruptured blood vessel, then secrete ADP and thromboxane A2 to attract more platelets.'},
  {type:'mcq',q:'Which two substances are secreted by adhered platelets to attract and activate more platelets?',opts:['Heparin and histamine','Serotonin and fibrinogen','ADP and thromboxane A2','Vitamin K and calcium'],ans:2,exp:'Platelets adhere to the collagen of the ruptured blood vessel and secrete ADP and thromboxane A2, which attract more platelets and activate them to form a platelet plug.'},
  {type:'mcq',q:'How many clotting factors have been identified in blood coagulation?',opts:['9','11','13','15'],ans:2,exp:'Thirteen clotting factors are identified. They were named after the scientists who discovered them or as per their activity, except Factor IX.'},
  {type:'mcq',q:'Which clotting factor is named after a patient rather than a scientist or activity?',opts:['Factor VII (Stable factor)','Factor VIII (Antihemophilic factor)','Factor IX (Christmas factor)','Factor XII (Hageman factor)'],ans:2,exp:'Christmas factor or Factor IX was named after the patient in whom it was discovered, unlike other factors named after scientists or their activity.'},
  {type:'mcq',q:'In the intrinsic pathway of prothrombin activator formation, the initiating source is:',opts:['Tissue thromboplastin from injured tissues','Platelets within the blood itself','Calcium ions from the plasma','Fibrinogen from the liver'],ans:1,exp:'In the intrinsic pathway, the formation of prothrombin activator is initiated by platelets, which are within the blood itself.'},
  {type:'mcq',q:'The conversion of prothrombin to thrombin requires the presence of:',opts:['Factor VIII and phospholipid','Prothrombin activator and calcium ions (Factor IV)','Fibrin-stabilizing factor and Factor V','Tissue thromboplastin and Factor VII'],ans:1,exp:'Prothrombin activator converts prothrombin into thrombin in the presence of calcium ions (Factor IV).'},
  {type:'mcq',q:'The positive feedback effect of thrombin in Stage 2 of blood clotting involves:',opts:['Activation of Factor XII to initiate the intrinsic pathway','Activation of Factor V, which accelerates prothrombin activator formation','Direct conversion of fibrinogen to fibrin','Activation of Factor XIII to stabilize fibrin'],ans:1,exp:'The initially formed thrombin activates Factor V, which in turn accelerates formation of both extrinsic and intrinsic prothrombin activator, producing more thrombin — this is the positive feedback effect.'},
  {type:'mcq',q:'In Stage 3 of blood clotting, loose fibrin strands are converted into tight fibrin threads by:',opts:['Thrombin in the presence of Factor V','Fibrin-stabilizing factor (Factor XIII) in the presence of calcium ions','Prothrombin activator and Factor VII','Platelet-activating factor and ADP'],ans:1,exp:'Loose fibrin strands are modified into dense and tight fibrin threads by fibrin-stabilizing factor (Factor XIII) in the presence of calcium ions, forming a stable clot meshwork.'},
  {type:'mcq',q:'Clot retraction begins approximately how many minutes after clot formation?',opts:['5 to 10 minutes','10 to 20 minutes','30 to 45 minutes','60 to 90 minutes'],ans:2,exp:'After clot formation, the blood clot starts contracting, and after about 30 to 45 minutes, the straw-colored serum oozes out of the clot.'},
  {type:'mcq',q:'Plasminogen is converted into plasmin by all of the following EXCEPT:',opts:['Tissue plasminogen activator (t-PA)','Lysosomal enzymes','Thrombin','Factor XIII'],ans:3,exp:'Plasminogen is converted into plasmin by tissue plasminogen activator (t-PA), lysosomal enzymes, and thrombin. Factor XIII is not mentioned as an activator of plasminogen.'},
  {type:'mcq',q:'Heparin is naturally produced in the body primarily by:',opts:['Eosinophils and neutrophils','Mast cells and basophils','Monocytes and lymphocytes','Kupffer cells and platelets'],ans:1,exp:'Heparin is produced by mast cells (abundant in liver and lungs) and also by basophils.'},
  {type:'mcq',q:'Coumarin derivatives (warfarin, dicoumoral) prevent blood clotting by:',opts:['Removing calcium ions from the blood','Directly inhibiting thrombin activity','Inhibiting the action of vitamin K','Activating antithrombin III'],ans:2,exp:'Coumarin derivatives prevent blood clotting by inhibiting the action of vitamin K, which is essential for formation of clotting factors II, VII, IX, and X.'},
  {type:'mcq',q:'EDTA prevents blood clotting by:',opts:['Inhibiting thrombin directly','Blocking vitamin K-dependent factors','Removing calcium from blood','Inhibiting factor XII activation'],ans:2,exp:'EDTA (Ethylene diaminetetra acetic acid) prevents blood clotting by removing calcium from blood.'},
  {type:'mcq',q:'Normal bleeding time is:',opts:['1 to 3 minutes','3 to 6 minutes','3 to 8 minutes','8 to 12 minutes'],ans:1,exp:'Bleeding time is the time interval from oozing of blood after a cut until arrest of bleeding. Its normal duration is 3 to 6 minutes.'},
  {type:'mcq',q:'In hemophilia, the clotting time is prolonged because of lack of:',opts:['Platelet plug formation','Prothrombin activator due to deficiency of Factor VIII, IX, or XI','von Willebrand factor affecting platelet adhesion','Calcium ions required for Stage 3'],ans:1,exp:'Lack of prothrombin activator is the cause for hemophilia. Formation of prothrombin activator is affected due to deficiency of Factor VIII, IX, or XI.'},
  {type:'mcq',q:'Hemophilia A is due to deficiency of Factor VIII and accounts for what percentage of all hemophilia cases?',opts:['15%','50%','75%','85%'],ans:3,exp:'Hemophilia A (classic hemophilia) is due to deficiency of Factor VIII and affects 85% of people with hemophilia.'},
  {type:'mcq',q:'Thrombasthenic purpura is characterized by:',opts:['Decreased platelet count with prolonged clotting time','Normal platelet count with defective clot retraction','Decreased clotting factors with normal bleeding time','Antibodies against platelets formed after blood transfusion'],ans:1,exp:'Thrombasthenic purpura is due to structural or functional abnormality of platelets with normal platelet count. It is characterized by normal clotting time, normal or prolonged bleeding time, but defective clot retraction.'},
  {type:'mcq',q:'von Willebrand disease causes excess bleeding because von Willebrand factor is responsible for:',opts:['Initiating the extrinsic pathway of coagulation','Platelet adherence to endothelium AND maintenance of Factor VIII in plasma','Converting fibrinogen into fibrin threads','Activating Factor XIII to stabilize the fibrin clot'],ans:1,exp:'von Willebrand factor is responsible for adherence of platelets to endothelium during hemostasis and for the survival and maintenance of Factor VIII in plasma. Its deficiency suppresses platelet adhesion and causes deficiency of Factor VIII.'},
  {type:'mcq',q:'Infarction most commonly occurs in which organs?',opts:['Stomach, intestine, pancreas, and bladder','Heart, brain, lungs, kidneys, and spleen','Skin, muscles, bone marrow, and lymph nodes','Liver, gallbladder, thyroid, and adrenal glands'],ans:1,exp:'Infarction commonly occurs in heart, brain, lungs, kidneys, and spleen. The area of tissue that undergoes infarction is called an infarct.'},
  // T/F (35)
  {type:'tf',q:'Platelets are nucleated formed elements of blood.',ans:false,exp:'Platelets are non-nucleated formed elements of blood. They are fragments of cytoplasm without a nucleus.'},
  {type:'tf',q:'The normal volume of a platelet ranges from 7 to 8 cu µm.',ans:true,exp:'The normal volume of platelets is 7.5 cu µm, ranging between 7 and 8 cu µm.'},
  {type:'tf',q:'Microtubules in platelets are made of a protein called actin.',ans:false,exp:'Microtubules are made of a protein called tubulin, not actin. Actin is a contractile protein in the platelet cytoplasm.'},
  {type:'tf',q:'Thrombosthenin is the contractile protein responsible for clot retraction.',ans:true,exp:'Thrombosthenin is the third contractile protein in platelets, specifically responsible for clot retraction (in addition to actin and myosin which cause platelet contraction).'},
  {type:'tf',q:'Platelet-activating factor (PAF) is responsible for inhibiting angiogenesis.',ans:false,exp:'PAF causes aggregation of platelets during injury of blood vessels. It is Thrombospondin that inhibits angiogenesis.'},
  {type:'tf',q:'Alpha granules of platelets contain clotting factors V and XIII, fibrinogen, and PDGF.',ans:true,exp:'Alpha granules contain clotting factors V and XIII, fibrinogen, and platelet-derived growth factor (PDGF).'},
  {type:'tf',q:'Dense granules of platelets contain lysosomes and calcium.',ans:true,exp:'Dense granules contain nucleotides, serotonin, phospholipid, calcium, and lysosomes.'},
  {type:'tf',q:'The platelet count is the same in males and females under all physiological conditions.',ans:false,exp:'While there is no general difference between males and females, in females the platelet count is reduced during menstruation.'},
  {type:'tf',q:'High altitude causes an increase in platelet count.',ans:true,exp:'High altitude is listed as a physiological factor that increases platelet count.'},
  {type:'tf',q:'Thrombocytopenia can occur in chickenpox and typhoid fever.',ans:true,exp:'Thrombocytopenia occurs in several conditions including chickenpox and typhoid, as well as acute infections, leukemia, splenomegaly, tuberculosis, and others.'},
  {type:'tf',q:'Thrombocytosis occurs in conditions such as bone fractures and splenectomy.',ans:true,exp:'Thrombocytosis (increase in platelet count) occurs in bone fractures, splenectomy, hemorrhage, allergic conditions, surgical operations, rheumatic fever, and trauma.'},
  {type:'tf',q:'Thrombocythemia occurs in acute infections and common cold.',ans:false,exp:"Thrombocythemia (persistent and abnormal increase) occurs in carcinoma, chronic leukemia, and Hodgkin\'s disease — not acute infections or common cold."},
  {type:'tf',q:'Vasoconstriction during hemostasis is a systemic phenomenon affecting the whole body.',ans:false,exp:'Vasoconstriction is purely a local phenomenon occurring at the site of injury to reduce blood loss from the damaged portion.'},
  {type:'tf',q:'In Stage 2 of hemostasis, ADP and thromboxane A2 attract and activate more platelets.',ans:true,exp:'Adhered platelets secrete ADP and thromboxane A2, which attract more platelets and activate them, leading to formation of the temporary platelet plug.'},
  {type:'tf',q:'The platelet plug formed in Stage 2 of hemostasis is a permanent, tight structure.',ans:false,exp:'The platelet plug formed in Stage 2 is a loose, temporary plug. It becomes permanent only when reinforced by fibrin threads in Stage 3 (coagulation).'},
  {type:'tf',q:'All clotting factors are normally present in the blood as active enzymes.',ans:false,exp:'Normally, all clotting factors are present in the form of inactive proenzymes. They must be activated into enzymes to enforce clot formation.'},
  {type:'tf',q:'Factor IX (Christmas factor) was named after the patient in whom it was discovered.',ans:true,exp:'Christmas factor or Factor IX was the exception — named after the patient in whom it was discovered, unlike other factors named after scientists or their activity.'},
  {type:'tf',q:'In the extrinsic pathway, prothrombin activator formation is initiated by platelets within the blood.',ans:false,exp:'In the extrinsic pathway, formation is initiated by tissue thromboplastin from injured tissues — not by platelets. The intrinsic pathway is initiated by platelets.'},
  {type:'tf',q:'Once thrombin is formed, it activates Factor V to create a positive feedback loop.',ans:true,exp:'The initially formed thrombin activates Factor V, which accelerates formation of both extrinsic and intrinsic prothrombin activator — creating more thrombin. This is the positive feedback effect.'},
  {type:'tf',q:'Blood clot is defined as a mesh of fibrin entangling RBCs, WBCs, and platelets.',ans:true,exp:'Blood clot is defined exactly as the mesh of fibrin entangling RBCs, WBCs, and platelets.'},
  {type:'tf',q:'During clot retraction, straw-colored serum oozes out after approximately 30 to 45 minutes.',ans:true,exp:'After clot formation, the blood clot starts contracting, and after about 30 to 45 minutes, the straw-colored serum oozes out of the clot.'},
  {type:'tf',q:'Plasminogen is synthesized in the spleen and stored in platelets.',ans:false,exp:'Plasminogen is synthesized in the liver and incorporated with other proteins in the blood clot — not synthesized in the spleen.'},
  {type:'tf',q:'Heparin is used as an anticoagulant both in vivo and in vitro.',ans:true,exp:'Heparin is used as an anticoagulant both in vivo (inside the body) and in vitro (outside the body/in the laboratory).'},
  {type:'tf',q:'Coumarin derivatives prevent clotting by inhibiting factors II, VII, IX, and X through blocking vitamin K.',ans:true,exp:'Coumarin derivatives inhibit vitamin K, which is essential for formation of clotting factors II, VII, IX, and X — thus preventing coagulation.'},
  {type:'tf',q:'EDTA is used intravenously in cases of lead poisoning as an in vivo anticoagulant.',ans:true,exp:'EDTA is used as an anticoagulant both in vivo and in vitro. It is administered intravenously in cases of lead poisoning (in vivo) and used as a laboratory anticoagulant (in vitro).'},
  {type:'tf',q:'Bleeding time is prolonged in hemophilia.',ans:false,exp:'Bleeding time (normal 3–6 min) is prolonged in purpura, not hemophilia. It is the clotting time (normal 3–8 min) that is prolonged in hemophilia.'},
  {type:'tf',q:'In hemophilia, females are the affected individuals and males are the carriers.',ans:false,exp:'Hemophilia is sex-linked: males are affected and females are the carriers. Even mild trauma in affected males can cause excess bleeding that may lead to death.'},
  {type:'tf',q:"Hemophilia B (Christmas disease) accounts for 85% of all hemophilia cases.",ans:false,exp:'Hemophilia A (classic hemophilia, Factor VIII deficiency) accounts for 85% of cases. Hemophilia B (Christmas disease, Factor IX deficiency) accounts for 15% of cases.'},
  {type:'tf',q:'In purpura, the clotting time is normal but the bleeding time is prolonged.',ans:true,exp:'Purpura is characterized by prolonged bleeding time with normal clotting time. Spontaneous bleeding under the skin from ruptured capillaries produces purpuric spots.'},
  {type:'tf',q:'Idiopathic thrombocytopenic purpura is believed to develop due to antibodies against platelets after blood transfusion.',ans:true,exp:'Idiopathic thrombocytopenic purpura has an unknown specific cause, but it is believed that platelet count decreases due to development of antibodies against platelets, which occurs after blood transfusion.'},
  {type:'tf',q:'von Willebrand factor deficiency causes only platelet adhesion failure without affecting clotting factors.',ans:false,exp:'von Willebrand factor deficiency suppresses platelet adhesion AND also causes deficiency of Factor VIII in plasma, as vWF is responsible for survival and maintenance of Factor VIII.'},
  {type:'tf',q:'Thrombosis refers to coagulation of blood outside the blood vessels.',ans:false,exp:'Thrombosis (intravascular blood clotting) refers to coagulation of blood INSIDE the blood vessels — the opposite of the statement.'},
  {type:'tf',q:'Congenital absence of protein C is a recognized cause of thrombosis.',ans:true,exp:'Congenital absence of protein C is listed as one of the causes of thrombosis, along with injury to blood vessels, roughened endothelial lining, sluggish blood flow, RBC agglutination, and poisons.'},
  {type:'tf',q:'Pulmonary embolism, cerebral embolism, and coronary embolism are common sites for obstruction by embolus.',ans:true,exp:'The obstruction of blood flow by embolism is common in the lungs (pulmonary embolism), brain (cerebral embolism), and heart (coronary embolism).'},
  {type:'tf',q:'Necrosis and infarction have the same definition — both refer only to tissue death caused by loss of blood supply.',ans:false,exp:'Necrosis is a general term for tissue death caused by loss of blood supply, injury, infection, inflammation, physical agents, or chemical substances. Infarction specifically refers to tissue death due to loss of blood supply (usually by occlusion of an artery).'},
];

const ENDO_CARDS = [
  // ── FUNDAMENTALS ──
  {cat:'endo',q:'What are the TWO major systems that regulate all physiological activities?',a:'1. Nervous System. 2. Endocrine System. They INTERACT and work TOGETHER. The hypothalamus is the bridge connecting both systems.'},
  {cat:'endo',q:'Why are endocrine glands called "ductless glands"?',a:'They release hormones DIRECTLY INTO THE BLOOD without any duct. Compare with exocrine glands (salivary, sweat) which USE ducts.'},
  {cat:'endo',q:'What are the THREE chemical classes of hormones?',a:'1. STEROID – from cholesterol (cortisol, aldosterone, testosterone, estrogen). 2. PROTEIN/Polypeptide – water-soluble (insulin, GH, TSH, ADH, PTH). 3. TYROSINE DERIVATIVES – from tyrosine (T3, T4, adrenaline, noradrenaline, dopamine).'},
  {cat:'endo',q:'Where are receptors for each hormone class located?',a:'Cell MEMBRANE → Protein hormones + Catecholamines. CYTOPLASM → Steroid hormones. NUCLEUS → Thyroid hormones (T3, T4). Rule: More lipid-soluble = deeper into cell.'},
  {cat:'endo',q:'What are the 3 mechanisms by which hormone-receptor complex acts?',a:'1. Alters PERMEABILITY of cell membrane. 2. Activates INTRACELLULAR ENZYMES. 3. Activates GENES → mRNA → protein synthesis.'},
  {cat:'endo',q:'Hormones of the PINEAL gland and THYMUS.',a:'PINEAL: Melatonin (regulates circadian rhythm/sleep). THYMUS: Thymosin + Thymin (both essential for T-lymphocyte maturation).'},
  {cat:'endo',q:'What hormones does the KIDNEY secrete?',a:'1. ERYTHROPOIETIN – stimulates RBC production. 2. RENIN – activates angiotensin → aldosterone release. 3. CALCITRIOL (1,25-dihydroxycholecalciferol) – active vitamin D for calcium absorption.'},
  {cat:'endo',q:'What does the HEART secrete? What do they do?',a:'ANP (atria), BNP (ventricles), CNP. All promote Na⁺ and water EXCRETION → lower blood pressure. They counteract aldosterone\'s sodium-retaining effects.'},
  {cat:'endo',q:'What hormones does the PLACENTA secrete?',a:'HCG (maintains corpus luteum; basis of pregnancy tests), Human Chorionic Somatomammotropin, Estrogen, Progesterone.'},
  {cat:'endo',q:'What makes hormone receptors unique?',a:'Large PROTEIN molecules. Each receptor is specific for ONLY ONE hormone (lock-and-key). Cannot combine with any other hormone. Located in target cells only.'},
  // ── PITUITARY ──
  {cat:'endo',q:'Pituitary gland: location and connection to hypothalamus.',a:'Also called HYPOPHYSIS. Small gland at the BASE OF THE BRAIN. Connected to hypothalamus by the PITUITARY (HYPOPHYSEAL) STALK.'},
  {cat:'endo',q:'TWO main portions of the pituitary gland.',a:'1. ANTERIOR pituitary = ADENOHYPOPHYSIS (glandular tissue). 3 divisions: Pars distalis, Pars tuberalis, Pars intermedia. 2. POSTERIOR pituitary = NEUROHYPOPHYSIS (neural tissue). Contains Pars nervosa, Neural stalk, Median eminence.'},
  {cat:'endo',q:'Name the 6 hormones of the ANTERIOR pituitary.',a:'1. GH (Growth Hormone/STH) 2. TSH 3. ACTH 4. FSH 5. LH (ICSH in males) 6. PROLACTIN. Bonus 7th: beta-LIPOTROPIN.'},
  {cat:'endo',q:'How does the hypothalamus control the anterior pituitary?',a:'Via HYPOTHALAMO-HYPOPHYSEAL PORTAL VESSELS. Releasing hormones: GHRH, TRH, CRH, GnRH. Inhibiting: GHIH (somatostatin) inhibits GH; PIH (dopamine) inhibits prolactin.'},
  {cat:'endo',q:'What are pituicytes? Do they secrete hormones?',a:'Pituicytes = supporting (glial-like) cells of POSTERIOR pituitary. They DO NOT secrete any hormone. ADH and oxytocin arrive from hypothalamus via axons.'},
  {cat:'endo',q:'FSH + LH are collectively called what?',a:'GONADOTROPINS or GONADOTROPIC HORMONES. They act on the GONADS — ovaries and testes.'},
  {cat:'endo',q:'Why is the anterior pituitary called the "master gland"?',a:'It controls MANY other endocrine glands via tropic hormones (TSH→thyroid, ACTH→adrenal cortex, FSH+LH→gonads). BUT the hypothalamus controls the pituitary — making it "master of the master gland".'},
  // ── GROWTH HORMONE ──
  {cat:'endo',q:'What cells secrete GH? Chemical nature?',a:'Secreted by ACIDOPHILS (SOMATOTROPHS) of anterior pituitary. Chemical nature: PROTEIN hormone. Also called STH (Somatotropic Hormone).'},
  {cat:'endo',q:'What INCREASES GH secretion? (6 factors)',a:'1. Hypoglycemia 2. Fasting 3. Starvation 4. Exercise 5. Stress/trauma 6. EARLY stages of sleep. Rule: Body NEEDS ENERGY or is STRESSED → GH rises.'},
  {cat:'endo',q:'What DECREASES GH secretion?',a:'1. Hyperglycemia (high blood sugar). 2. Increased free fatty acids. 3. LATER stages of sleep. Rule: Energy is ABUNDANT → GH falls.'},
  {cat:'endo',q:'Differentiate: Gigantism vs Acromegaly vs Dwarfism.',a:'GIGANTISM = Excess GH in CHILDHOOD (before epiphyseal fusion) → bones grow in LENGTH → abnormal height. ACROMEGALY = Excess GH in ADULTS (after epiphyseal fusion) → bones THICKEN/BROADEN (jaw, hands, feet). DWARFISM = DEFICIENCY of GH in infancy/early childhood → restricted growth; normal intelligence.'},
  // ── OTHER ANTERIOR PITUITARY HORMONES ──
  {cat:'endo',q:'What does TSH do? What does ACTH do?',a:'TSH: Necessary for GROWTH and SECRETORY ACTIVITY of thyroid gland (without it → thyroid atrophies). ACTH: Necessary for STRUCTURAL INTEGRITY and SECRETORY ACTIVITY of adrenal cortex (without it → cortex atrophies).'},
  {cat:'endo',q:'What does FSH do in MALES vs FEMALES?',a:'MALES: With testosterone → accelerates SPERMIOGENESIS. FEMALES: Develops GRAAFIAN FOLLICLE, stimulates theca cells → ESTROGEN, promotes AROMATASE activity.'},
  {cat:'endo',q:'What does LH do in MALES vs FEMALES?',a:'MALES (= ICSH): Stimulates LEYDIG CELLS → secrete TESTOSTERONE. FEMALES: Causes follicle maturation, induces OVULATION, forms CORPUS LUTEUM, activates corpus luteum secretory function.'},
  {cat:'endo',q:'PROLACTIN and BETA-LIPOTROPIN functions.',a:'PROLACTIN: Final preparation of mammary glands for milk PRODUCTION and SECRETION. (Milk EJECTION = oxytocin!). BETA-LIPOTROPIN: Mobilizes FAT from adipose tissue → promotes LIPOLYSIS.'},
  // ── ADH AND OXYTOCIN ──
  {cat:'endo',q:'CRITICAL: Where are ADH and oxytocin MADE vs STORED?',a:'MADE in: HYPOTHALAMUS. Transported via: nerve fibers (hypothalamo-hypophyseal tract). STORED and RELEASED from: POSTERIOR PITUITARY. They are called NEUROHORMONES. Posterior pituitary does NOT make any hormone!'},
  {cat:'endo',q:'Two main actions of ADH.',a:'1. ANTIDIURETIC (main): Water RETENTION by renal collecting ducts → reduces urine output. 2. VASOPRESSOR: Vasoconstriction → increases BLOOD PRESSURE. Deficiency → DIABETES INSIPIDUS (massive dilute urine).'},
  {cat:'endo',q:'Diabetes Insipidus vs Diabetes Mellitus.',a:'Diabetes INSIPIDUS: ADH deficiency → massive DILUTE urine (tasteless). Posterior pituitary disorder. Diabetes MELLITUS: Insulin deficiency → SWEET urine (glucose). Pancreatic beta-cell failure. INSIPIDUS = tasteless; MELLITUS = sweet (honey-like).'},
  {cat:'endo',q:'Main actions of OXYTOCIN.',a:'1. PREGNANT uterus: CONTRACTIONS → expulsion of fetus (labor). 2. NON-PREGNANT uterus: facilitates SPERM TRANSPORT. 3. MILK EJECTION from mammary glands (let-down reflex). 4. MALES: increases during ejaculation → sperm release. Secreted in BOTH sexes!'},
  // ── THYROID GLAND ──
  {cat:'endo',q:'Thyroid gland anatomy and key features.',a:'Location: Root of NECK, either side of trachea. Structure: Two lobes + ISTHMUS. Weight: 20–40 g. Larger in FEMALES. Increases during PREGNANCY and LACTATION. Decreases at MENOPAUSE.'},
  {cat:'endo',q:'Histological structure of the thyroid gland.',a:'Closed FOLLICLES lined with cuboidal (FOLLICULAR) cells. Follicular cavity = THYROGLOBULIN (colloid, storage form). Follicular cells secrete T4 + T3. PARAFOLLICULAR CELLS (C cells) between follicles → secrete CALCITONIN.'},
  {cat:'endo',q:'3 thyroid hormones: which is more abundant? More potent?',a:'T4 (THYROXINE) – 90% of secretion – LESS potent. T3 (Triiodothyronine) – 9–10% – 4× MORE POTENT. CALCITONIN – from C cells. In peripheral tissues: T4 → converted to ACTIVE T3. Reverse T3 (rT3) = biologically INACTIVE.'},
  {cat:'endo',q:'Two essentials for thyroid hormone synthesis.',a:'1. IODINE (from diet → converted to iodide → absorbed from GI). 2. TYROSINE (amino acid from diet). Synthesis occurs IN THYROGLOBULIN in the follicular cavity.'},
  {cat:'endo',q:'Why is the thyroid UNIQUE among endocrine glands?',a:'Only endocrine gland that can store hormones for ~4 MONTHS (as thyroglobulin in follicles). Clinical: signs of deficiency appear ~4 months late; antithyroid drugs take weeks to work.'},
  {cat:'endo',q:'How are thyroid hormones transported in blood?',a:'Bound to 3 plasma proteins: 1. TBG (Thyroxine-Binding Globulin) – main carrier. 2. TBPA (Thyroxine-Binding Prealbumin). 3. Albumin. THYROGLOBULIN itself is NEVER released into blood (stays in gland).'},
  {cat:'endo',q:'Key metabolic effects of thyroid hormones.',a:'1. Increase BMR (calorigenic). 2. Increase PROTEIN synthesis. 3. Stimulate CARBOHYDRATE metabolism. 4. DECREASE FAT STORAGE (mobilize fat, lower cholesterol). 5. Increase HEAT PRODUCTION. 6. Increase cardiac activity. 7. Essential for NORMAL SLEEP and BODY WEIGHT.'},
  {cat:'endo',q:'HYPERTHYROIDISM: definition and 2 causes.',a:'Increased thyroid hormones. CAUSE 1: GRAVES\' DISEASE – autoimmune; antibodies mimic TSH → most common; may cause EXOPHTHALMOS. CAUSE 2: THYROID ADENOMA – localized tumor secreting excess T3/T4.'},
  {cat:'endo',q:'HYPOTHYROIDISM in adults vs. children.',a:'ADULTS → MYXEDEMA: edematous appearance, fatigue, bradycardia, cold intolerance, weight gain. Intelligence PRESERVED. CHILDREN → CRETINISM: stunted growth + INTELLECTUAL DISABILITY. Permanent brain damage if untreated.'},
  {cat:'endo',q:'What is GOITER?',a:'ENLARGEMENT of the thyroid gland. Occurs in BOTH: NON-TOXIC goiter (hypothyroidism – excess TSH drives growth) and TOXIC goiter (hyperthyroidism – e.g., Graves\' disease). Goiter = enlarged gland, not necessarily hyper or hypo.'},
  // ── PARATHYROID & CALCITONIN ──
  {cat:'endo',q:'Parathyroid gland anatomy and which cells secrete PTH.',a:'FOUR glands immediately BEHIND thyroid at upper and lower poles. Size: 6mm long, 3mm wide. Color: dark brown. PTH = PROTEIN hormone secreted by CHIEF CELLS.'},
  {cat:'endo',q:'Main function of PTH. Normal blood calcium?',a:'PTH maintains blood calcium at 9–11 mg/dL. Acts on 3 targets: 1. BONES – Ca²⁺ resorption. 2. KIDNEYS – Ca²⁺ reabsorption + activates vitamin D. 3. GI TRACT – Ca²⁺ absorption (via vitamin D).'},
  {cat:'endo',q:'How is PTH secretion regulated?',a:'INVERSELY proportional to blood CALCIUM: ↓Ca²⁺ → ↑PTH; ↑Ca²⁺ → ↓PTH. DIRECTLY proportional to blood PHOSPHATE: ↑phosphate → combines with Ca²⁺ → ↓free Ca²⁺ → ↑PTH.'},
  {cat:'endo',q:'What is CALCITONIN? Where from? What does it do?',a:'POLYPEPTIDE from PARAFOLLICULAR (C) CELLS in THYROID. Opposes PTH – LOWERS blood calcium: 1. Stimulates OSTEOBLASTS (bone formation). 2. Suppresses OSTEOCLASTS (reduces bone resorption). 3. Increases Ca²⁺ EXCRETION in urine. 4. Prevents Ca²⁺ absorption from intestine.'},
  // ── PANCREAS ENDOCRINE ──
  {cat:'endo',q:'Islets of Langerhans: how many? % of pancreatic mass?',a:'1 to 2 MILLION islets in the human pancreas. They represent ~2% of pancreatic mass but perform ALL endocrine functions.'},
  {cat:'endo',q:'4 cell types of the islets and what each secretes.',a:'A cells (alpha) → GLUCAGON. B cells (beta) → INSULIN. D cells (delta) → SOMATOSTATIN. F cells (PP) → PANCREATIC POLYPEPTIDE. Memory: A=glucAGON rises; B=Blood sugar falls (insulin).'},
  {cat:'endo',q:'INSULIN: what is it and all major actions.',a:'POLYPEPTIDE from B/beta-cells. The ONLY ANTIDIABETIC hormone. 1. LOWERS blood glucose. 2. Promotes PROTEIN synthesis. 3. Stimulates FAT synthesis + storage. 4. Promotes GROWTH (anabolic). Regulated by BLOOD GLUCOSE LEVEL.'},
  {cat:'endo',q:'Why is insulin the "only antidiabetic hormone"?',a:'ONLY insulin LOWERS blood glucose. ALL other hormones are DIABETOGENIC (raise glucose): glucagon, cortisol, GH, adrenaline, thyroid hormones. Insulin deficiency → DIABETES MELLITUS.'},
  {cat:'endo',q:'GLUCAGON: what is it and major actions.',a:'POLYPEPTIDE from A/alpha-cells. ANTAGONISTIC to insulin: 1. Raises BLOOD GLUCOSE (glycogenolysis + gluconeogenesis). 2. Increases LIPOLYSIS. 3. Converts PROTEINS to glucose. 4. Inhibits GASTRIC JUICE secretion. 5. Increases BILE secretion.'},
  {cat:'endo',q:'SOMATOSTATIN: what does it do?',a:'POLYPEPTIDE from hypothalamus + D/delta-cells (pancreas + GI). Within islets: inhibits BOTH alpha (glucagon) AND beta (insulin) cells. Hypothalamic somatostatin = GHIH → inhibits GH + TSH.'},
  {cat:'endo',q:'Why must blood glucose be tightly regulated?',a:'Glucose is the ONLY nutrient that can be used by BRAIN TISSUE, RETINA, and GERMINAL EPITHELIUM of gonads. These CANNOT switch to other fuels. Severe hypoglycemia → brain damage → coma → death.'},
  // ── ADRENAL CORTEX ──
  {cat:'endo',q:'Anatomy of the adrenal glands.',a:'TWO glands on the UPPER POLE of each kidney (suprarenal glands). Each has 2 parts: CORTEX (outer 80%) → STEROIDS. MEDULLA (inner 20%) → CATECHOLAMINES. Structurally and functionally completely different.'},
  {cat:'endo',q:'THREE zones of adrenal cortex and what each produces. (GFR)',a:'(Outside → inside): GLOMERULOSA → MINERALOCORTICOIDS (aldosterone). FASCICULATA → GLUCOCORTICOIDS (cortisol). RETICULARIS → SEX HORMONES (androgens). GFR = Go Find Resources.'},
  {cat:'endo',q:'TWO mineralocorticoids. Which is dominant?',a:'1. ALDOSTERONE – 90% of mineralocorticoid activity (DOMINANT). 2. 11-deoxycorticosterone – 10%. Aldosterone = LIFE-SAVING HORMONE. Total loss → death in 3 days to 2 weeks.'},
  {cat:'endo',q:'ALL functions of ALDOSTERONE.',a:'1. Increases Na⁺ REABSORPTION from kidney tubules. 2. Water follows Na⁺ → increases ECF VOLUME. 3. Increases BLOOD VOLUME → BLOOD PRESSURE. 4. Increases K⁺ EXCRETION (hypokalemia risk). 5. Increases H⁺ SECRETION. 6. Reabsorbs Na⁺ from salivary and sweat glands.'},
  {cat:'endo',q:'THREE glucocorticoids. Which is dominant?',a:'1. CORTISOL – 95% of glucocorticoid activity (DOMINANT). 2. Corticosterone – 4%. 3. Cortisone – 1%. Cortisol = "life-protecting hormone" (helps withstand stress + trauma).'},
  {cat:'endo',q:'ALL functions of GLUCOCORTICOIDS (cortisol).',a:'1. RAISES blood glucose (gluconeogenesis). 2. PROTEIN catabolism. 3. Mobilizes/redistributes FATS. 4. Increases WATER excretion. 5. Na⁺ retention, K⁺ excretion. 6. DECREASES blood CALCIUM. 7. Stimulates BONE RESORPTION. 8. INHIBITS bone formation. 9. Decreases EOSINOPHILS. 10. ANTI-INFLAMMATORY. 11. ANTIALLERGIC + IMMUNOSUPPRESSIVE.'},
  {cat:'endo',q:'Adrenal SEX HORMONES: zone and main types.',a:'From ZONA RETICULARIS. Mostly ANDROGENS: 1. DHEA (most active adrenal androgen). 2. Androstenedione. 3. Testosterone. Small amounts: estrogen + progesterone. Responsible for MASCULINE features.'},
  {cat:'endo',q:'3 disorders of adrenal cortex HYPERACTIVITY.',a:'1. CUSHING\'S SYNDROME: excess CORTISOL → moon face, buffalo hump, hyperglycemia, hypertension, muscle wasting. 2. CONN\'S SYNDROME: excess ALDOSTERONE (zona glomerulosa tumor) → hypertension + hypokalemia. 3. ADRENOGENITAL SYNDROME: excess SEX HORMONES.'},
  // ── ADRENAL MEDULLA ──
  {cat:'endo',q:'Adrenal medulla composition and what it secretes.',a:'Made of CHROMAFFIN CELLS. Two types: 90% → ADRENALINE-secreting; 10% → NORADRENALINE-secreting. THREE catecholamines: Adrenaline, Noradrenaline, Dopamine. Precursor: Amino acid TYROSINE.'},
  {cat:'endo',q:'Two types of adrenergic receptors.',a:'ALPHA receptors (alpha-1, alpha-2): mainly vasoconstriction. BETA receptors (beta-1, beta-2): heart rate, bronchodilation, vasodilation. Adrenaline: acts through BOTH equally. Noradrenaline: acts MAINLY through ALPHA receptors.'},
  {cat:'endo',q:'How does ADRENALINE affect METABOLISM?',a:'Increases O₂ consumption + CO₂ removal → raises BMR. Carbohydrate: Increases blood glucose via GLYCOGENOLYSIS. Fat: Mobilizes free fatty acids (LIPOLYSIS). Called a CALORIGENIC hormone.'},
  {cat:'endo',q:'How does ADRENALINE affect the HEART? (beta receptors)',a:'Stronger effects than noradrenaline: 1. Increases heart RATE (chronotropic). 2. Increases force of CONTRACTION (inotropic). 3. Increases EXCITABILITY (bathmotropic). 4. Increases CONDUCTIVITY (dromotropic). Overall: Increases cardiac OUTPUT.'},
  {cat:'endo',q:'Adrenaline vs noradrenaline on BLOOD VESSELS.',a:'NORADRENALINE: Constricts ALL blood vessels (alpha) → "GENERAL VASOCONSTRICTOR" → increases total peripheral resistance. ADRENALINE: Constricts most vessels (alpha) BUT DILATES skeletal muscle, liver, heart vessels via BETA-2 receptors → DECREASES total peripheral resistance.'},
  {cat:'endo',q:'Adrenaline vs noradrenaline on BLOOD PRESSURE.',a:'ADRENALINE: Raises SYSTOLIC (↑cardiac output). Lowers DIASTOLIC (↓TPR via beta-2). NORADRENALINE: Raises DIASTOLIC (↑TPR via alpha). Raises SYSTOLIC slightly. Both require GLUCOCORTICOIDS for full effect.'},
  {cat:'endo',q:'What smooth muscles do catecholamines CONTRACT vs RELAX?',a:'CONTRACT: Splenic capsule, GI sphincters, arrector pili, gallbladder, uterus, dilator pupillae. RELAX: Non-sphincteric GI tract, BRONCHIOLES (bronchodilation!), urinary bladder.'},
  {cat:'endo',q:'What is PHEOCHROMOCYTOMA?',a:'Tumor of adrenal medulla CHROMAFFIN cells → HYPERSECRETION of catecholamines. Features: PAROXYSMAL severe HYPERTENSION, sweating, palpitations, headache. Surgically curable. Test: elevated urine catecholamine metabolites (VMA).'},
  {cat:'endo',q:'DOPAMINE: actions and brain relevance.',a:'Catecholamine from adrenal medulla. In BRAIN: neurotransmitter in basal ganglia. Deficiency in basal ganglia → PARKINSONISM. When injected: vasoconstriction, vasodilation in mesentery, increases heart rate + systolic BP only. Does NOT affect diastolic BP.'},
  {cat:'endo',q:'"Fight or flight" response. Which hormone drives it?',a:'ADRENALINE. In acute stress: increases heart rate + cardiac output, raises blood glucose (glycogenolysis), bronchodilation (more O₂), increases blood flow to skeletal muscles (vasodilation via beta-2), increases mental alertness.'},
  // ── COMPARISONS ──
  {cat:'endo',q:'PTH vs CALCITONIN on blood calcium.',a:'PTH → RAISES Ca²⁺: bone resorption (osteoclasts), kidney Ca²⁺ reabsorption + activates Vit D, GI Ca²⁺ absorption. CALCITONIN → LOWERS Ca²⁺: stimulates osteoblasts, inhibits osteoclasts, increases renal Ca²⁺ excretion, prevents intestinal absorption. They are ANTAGONISTS.'},
  {cat:'endo',q:'INSULIN vs GLUCAGON comparison.',a:'INSULIN (B/beta cells) → LOWERS blood glucose: glycogen synthesis, fat storage, protein anabolism. GLUCAGON (A/alpha cells) → RAISES blood glucose: glycogenolysis, gluconeogenesis, lipolysis. ANTAGONISTS. ONLY insulin lowers glucose.'},
  {cat:'endo',q:'MYXEDEMA vs CRETINISM.',a:'Both = HYPOTHYROIDISM. MYXEDEMA (adults): edema, fatigue, bradycardia, cold intolerance, weight gain. Intelligence PRESERVED. CRETINISM (children): stunted growth + INTELLECTUAL DISABILITY. Brain damage PERMANENT if untreated.'},
  {cat:'endo',q:'GIGANTISM vs ACROMEGALY.',a:'Both = EXCESS GH. GIGANTISM = before epiphyseal fusion (childhood) → bones grow in LENGTH → extreme height. ACROMEGALY = after epiphyseal fusion (adults) → bones THICKEN and BROADEN → enlarged jaw, hands, feet.'},
  {cat:'endo',q:'CUSHING\'S vs CONN\'S SYNDROME.',a:'CUSHING\'S = excess CORTISOL: moon face, buffalo hump, obesity, hyperglycemia, hypertension, muscle wasting. CONN\'S = excess ALDOSTERONE (zona glomerulosa tumor): hypertension, hypokalemia, Na⁺ retention, metabolic alkalosis. BOTH have hypertension but different mechanisms!'},
  {cat:'endo',q:'ANTERIOR vs POSTERIOR pituitary comparison.',a:'ANTERIOR: GLANDULAR tissue; 6 hormones (GH, TSH, ACTH, FSH, LH, Prolactin); controlled by hypothalamic portal blood. POSTERIOR: NEURAL tissue (pituicytes + nerve fibers); STORES + RELEASES ADH + Oxytocin (made in hypothalamus); does NOT manufacture any hormone.'},
  {cat:'endo',q:'T3 vs T4 quick comparison.',a:'T4: 90% of output, LESS potent, 4 iodine atoms. T3: 9–10% of output, 4× MORE POTENT, 3 iodine atoms. T4 → converted to T3 in peripheral tissues. Both transported by TBG, TBPA, albumin. Thyroglobulin NEVER enters blood.'},
  // ── CLINICAL ──
  {cat:'endo',q:'Why does chronic steroid therapy cause OSTEOPOROSIS?',a:'Glucocorticoids: 1. STIMULATE osteoclasts → bone RESORPTION. 2. INHIBIT osteoblasts → stops bone FORMATION. 3. Decrease Ca²⁺ absorption from GI. 4. Increase Ca²⁺ excretion by kidneys. Net: Progressive bone loss.'},
  {cat:'endo',q:'How does GRAVES\' DISEASE cause hyperthyroidism?',a:'Autoimmune: TSH-receptor ANTIBODIES mimic TSH → bind TSH receptors → thyroid secretes excess T3+T4 UNCONTROLLED (antibodies don\'t respond to negative feedback). Unique: EXOPHTHALMOS (bulging eyes) from retro-orbital tissue swelling.'},
  {cat:'endo',q:'Most potent adrenal androgen?',a:'DEHYDROEPIANDROSTERONE (DHEA) – most active adrenal androgen. Secreted by zona RETICULARIS. Along with androstenedione and testosterone. Responsible for MASCULINE features of the body.'},
  {cat:'endo',q:'Significance of thyroid hormone storage for 4 months.',a:'1. Antithyroid drugs → symptom improvement takes WEEKS. 2. Thyroid failure → symptoms appear 4 MONTHS LATER. 3. Thyroid cancer → thyroglobulin is a TUMOR MARKER (normally never enters blood).'},
  {cat:'endo',q:'What happens if aldosterone is completely lost?',a:'Death in 3 DAYS TO 2 WEEKS: No Na⁺ retention → massive Na⁺ and water loss → severe hypovolemia → cardiovascular collapse → death. This is why it\'s called the "life-saving hormone." Addison\'s disease requires immediate hormone replacement.'},
  {cat:'endo',q:'Why does iodine deficiency cause goiter (non-toxic)?',a:'Iodine deficiency → cannot synthesize T3/T4 → T3/T4 FALL → pituitary senses low T3/T4 (no negative feedback) → secretes MORE TSH → excess TSH drives THYROID ENLARGEMENT (GOITER) → but still no T3/T4 (no iodine). Result: enlarged gland + hypothyroid state.'},
  {cat:'endo',q:'Why is adrenaline used to treat ANAPHYLAXIS?',a:'Anaphylaxis: massive vasodilation + bronchospasm → shock. Adrenaline reverses: 1. VASOCONSTRICTION (alpha) → raises BP. 2. BRONCHODILATION (beta-2) → opens airways. 3. Increases heart rate + force (beta-1) → improves circulation. Addresses ALL life-threatening aspects.'},
  {cat:'endo',q:'What is Parkinsonism? Endocrine relevance?',a:'DOPAMINE DEFICIENCY in BASAL GANGLIA. Substantia nigra → coordinates smooth movement. Without it → tremor, rigidity, bradykinesia, postural instability. Treatment: L-DOPA (crosses BBB → converted to dopamine). Adrenal medulla also makes dopamine but brain deficiency is the issue.'},
  {cat:'endo',q:'Type 1 vs Type 2 diabetes from endocrine perspective.',a:'TYPE 1: Autoimmune destruction of BETA CELLS → absolute insulin DEFICIENCY → must inject insulin. TYPE 2: Insulin RESISTANCE + relative insulin deficiency → initially managed with diet/drugs. Both: hyperglycemia + long-term complications risk.'},
  {cat:'endo',q:'Relationship between vitamin D and PTH.',a:'PTH ACTIVATES Vitamin D: stimulates kidney to convert 25-OH-Vit-D → active CALCITRIOL. Calcitriol then increases Ca²⁺ absorption from GI tract. So PTH raises blood calcium via bone + kidney + (indirectly) GI. Vitamin D deficiency → poor GI absorption even if PTH high.'},
  {cat:'endo',q:'Why is somatostatin also called GHIH?',a:'Same somatostatin molecule acts in two locations: 1. HYPOTHALAMUS: GHIH → inhibits GH and TSH from anterior pituitary. 2. PANCREAS (D cells): inhibits BOTH insulin and glucagon locally. Same molecule, different anatomical sources, related functions.'},
  // ── MASTER SUMMARY ──
  {cat:'endo',q:'Hormones that LOWER blood calcium.',a:'1. CALCITONIN – main calcium-lowering hormone (suppresses osteoclasts + increases renal Ca excretion). 2. GLUCOCORTICOIDS (cortisol) – decrease Ca absorption from GI. REMEMBER: PTH RAISES calcium!'},
  {cat:'endo',q:'ALL hormones that RAISE blood glucose.',a:'1. GLUCAGON (most direct). 2. CORTISOL (gluconeogenesis + inhibits tissue uptake). 3. GROWTH HORMONE (diabetogenic). 4. ADRENALINE (glycogenolysis). 5. THYROID HORMONES (↑metabolism). Insulin is the ONLY one that LOWERS glucose.'},
  {cat:'endo',q:'5 most exam-critical facts in Endocrine Physiology.',a:'1. GH by ACIDOPHILS; Gigantism (child) vs Acromegaly (adult). 2. ADH + Oxytocin MADE in HYPOTHALAMUS, stored in posterior pituitary. 3. T3 is 4× more potent than T4; thyroglobulin NEVER enters blood. 4. INSULIN only antidiabetic; A=glucagon, B=insulin. 5. GFR zones: Glomerulosa=aldosterone; Fasciculata=cortisol; Reticularis=androgens.'},
  {cat:'endo',q:'Classic EXAM TRAP mistakes in endocrinology.',a:'TRAP 1: Posterior pituitary MAKES hormones → FALSE. TRAP 2: Pituicytes secrete hormones → FALSE. TRAP 3: Alpha cells secrete INSULIN → FALSE (beta cells do). TRAP 4: Goiter = hypothyroidism only → FALSE (both). TRAP 5: Calcitonin stimulates osteoclasts → FALSE (suppresses them). TRAP 6: Adrenaline raises diastolic BP → FALSE (noradrenaline does more). TRAP 7: Glucocorticoids from zona GLOMERULOSA → FALSE (fasciculata!).'},
  {cat:'endo',q:'Complete list of secondary endocrine organs and their hormones.',a:'KIDNEY: Erythropoietin, Renin, Calcitriol. HEART: ANP, BNP, CNP. PLACENTA: HCG, Estrogen, Progesterone, Somatomammotropin. PINEAL: Melatonin. THYMUS: Thymosin, Thymin. GI TRACT: Gastrin, Secretin, CCK, GIP.'},
  {cat:'endo',q:'Master hormone-source gland overview.',a:'Hypothalamus: GHRH, GHIH, TRH, CRH, GnRH, PIH. Anterior Pituitary: GH, TSH, ACTH, FSH, LH, Prolactin. Posterior Pituitary: stores ADH + Oxytocin. Thyroid: T4, T3, Calcitonin. Parathyroid: PTH. Pancreas: Insulin(B), Glucagon(A), Somatostatin(D), PP(F). Adrenal cortex: Aldosterone, Cortisol, Androgens. Adrenal medulla: Adrenaline, Noradrenaline, Dopamine.'},
  {cat:'endo',q:'Complete list of endocrine disorders to know.',a:'PITUITARY: Gigantism, Acromegaly, Dwarfism, Diabetes Insipidus. THYROID: Graves\' disease, Thyroid adenoma, Myxedema (adults), Cretinism (children), Goiter. PARATHYROID: Hyper → hypercalcemia + hypophosphatemia. PANCREAS: Diabetes Mellitus, Hypoglycemia. ADRENAL CORTEX: Cushing\'s, Conn\'s, Adrenogenital syndrome, Addison\'s. ADRENAL MEDULLA: Pheochromocytoma. DOPAMINE (brain): Parkinsonism.'},
];

  {type:'mcq',q:'Physiological activities in the body are regulated by which two major systems?',opts:['Endocrine system and immune system','Nervous system and endocrine system','Nervous system and digestive system','Cardiovascular system and endocrine system'],ans:1,exp:'All physiological activities are regulated by two major systems: the nervous system and the endocrine system, which interact with one another.'},

  {type:'mcq',q:'LH in males is called ICSH because it stimulates:',opts:['Sertoli cells','Germinal epithelium','Interstitial cells of Leydig in testes','Epididymis'],ans:2,exp:'LH in males is known as ICSH (interstitial cell-stimulating hormone) because it stimulates the interstitial cells of Leydig in testes and is essential for secretion of testosterone.'},

  {type:'mcq',q:'The major function of ADH is:',opts:['Contraction of uterus','Retention of water by acting on kidneys','Ejection of milk from mammary glands','Stimulation of GH release'],ans:1,exp:'The major function of ADH is retention of water by acting on kidneys. It also has a vasopressor action causing vasoconstriction and increased blood pressure.'},

  {type:'mcq',q:'The parafollicular cells (C cells) of the thyroid gland secrete:',opts:['Thyroxine (T4)','Triiodothyronine (T3)','TSH','Calcitonin'],ans:3,exp:'Between the follicles, the parafollicular cells (C cells) are present and these cells secrete calcitonin.'},
  {type:'mcq',q:'T4 (thyroxine) forms approximately what percentage of total thyroid secretion?',opts:['9 to 10%','50%','75%','90%'],ans:3,exp:'T4 is known as thyroxine and forms about 90% of the total secretion, whereas T3 is only 9 to 10%.'},
  {type:'mcq',q:'The potency of T3 compared to T4 is:',opts:['Equal','Twice more potent','Four times more potent','Ten times more potent'],ans:2,exp:'The potency of T3 is four times more than that of T4.'},
  {type:'mcq',q:'The thyroid gland is unique among endocrine glands because:',opts:['It produces the most hormones','It can store its hormones for a long period of about 4 months','It is the largest endocrine gland','It produces both steroid and protein hormones'],ans:1,exp:'Thyroid gland is unique as it is the only endocrine gland that can store its hormones for a long period of about 4 months, so signs of deficiency do not appear for about 4 months.'},
  {type:'mcq',q:'In peripheral tissues, which thyroid hormone is converted to the other?',opts:['T3 is converted to T4','T4 is converted to T3','Thyroglobulin is converted to T4','Reverse T3 is converted to T3'],ans:1,exp:'In the peripheral tissues T4 is converted into T3. A small amount of reverse T3 is also formed but reverse T3 is biologically inactive.'},
  {type:'mcq',q:'Hypothyroidism in children is characterized by:',opts:['Myxedema','Cretinism','Goiter only',"Graves' disease"],ans:1,exp:'Hypothyroidism leads to myxedema in adults and cretinism in children, which is characterized by stunted or restricted growth.'},
  {type:'mcq',q:"Graves' disease is classified as:",opts:['Bacterial infection causing hypothyroidism','Autoimmune disease due to hypersecretion of thyroid hormones','Congenital absence of the thyroid gland','Iodine deficiency disorder'],ans:1,exp:"Graves' disease is an autoimmune disease due to hypersecretion of thyroid hormones — one of the causes of hyperthyroidism."},
  {type:'mcq',q:'Goiter refers to:',opts:['Only hypothyroidism','Only hyperthyroidism','Enlargement of the thyroid gland occurring in both hypothyroidism and hyperthyroidism','Tumor of the thyroid'],ans:2,exp:'Goiter means enlargement of the thyroid gland. It occurs in both hypothyroidism (non-toxic goiter) and hyperthyroidism (toxic goiter).'},
  {type:'mcq',q:'How many parathyroid glands does the human body have?',opts:['Two','Three','Four','Six'],ans:2,exp:'There are four parathyroid glands located immediately behind the thyroid gland at the upper and lower poles.'},
  {type:'mcq',q:'Parathormone (PTH) maintains blood calcium level within the critical range of:',opts:['5 to 7 mg/dL','7 to 9 mg/dL','9 to 11 mg/dL','12 to 15 mg/dL'],ans:2,exp:'PTH maintains the blood calcium level and blood phosphate level within the critical range of 9 to 11 mg/dL.'},
  {type:'mcq',q:'PTH secretion is inversely proportional to blood calcium level. This means:',opts:['High calcium stimulates PTH secretion','Low calcium stimulates PTH secretion','PTH secretion is unaffected by calcium','PTH increases when calcium is normal'],ans:1,exp:'PTH secretion is inversely proportional to blood calcium level — increase in blood calcium decreases PTH secretion (negative feedback).'},
  {type:'mcq',q:'Calcitonin is secreted by which cells?',opts:['Chief cells of parathyroid','Follicular cells of thyroid','Parafollicular cells (C cells) of thyroid','Alpha cells of pancreas'],ans:2,exp:'Calcitonin is a polypeptide secreted by the parafollicular cells or clear cells (C cells) situated amongst the follicles in the thyroid gland.'},
  {type:'mcq',q:'The normal plasma level of calcitonin is:',opts:['0.1 to 0.5 ng/dL','1 to 2 ng/dL','5 to 10 ng/dL','10 to 20 ng/dL'],ans:1,exp:'The plasma level of calcitonin is 1 to 2 ng/dL.'},
  {type:'mcq',q:'Calcitonin decreases blood calcium level. This action directly counteracts:',opts:['TSH','ADH','Parathormone (PTH)','Aldosterone'],ans:2,exp:'Calcitonin decreases blood calcium level and thereby counteracts parathormone — they are antagonists in calcium regulation.'},
  {type:'mcq',q:'The endocrine function of the pancreas is performed by the:',opts:['Acinar cells','Ductal cells','Islets of Langerhans','Zymogen granule cells'],ans:2,exp:'The endocrine function of the pancreas is performed by the islets of Langerhans. The human pancreas contains about 1 to 2 million islets.'},
  {type:'mcq',q:'Which cell type in the islets of Langerhans secretes glucagon?',opts:['B cells (beta-cells)','D cells (delta-cells)','A cells (alpha-cells)','F cells (PP cells)'],ans:2,exp:'A cells or alpha-cells secrete glucagon. B cells secrete insulin, D cells secrete somatostatin, and F cells secrete pancreatic polypeptide.'},
  {type:'mcq',q:'Insulin is called the only antidiabetic hormone in the body because:',opts:['It is produced by the largest gland','It is the only hormone that lowers blood glucose level','It is a steroid hormone','It is secreted by all endocrine glands'],ans:1,exp:'Insulin is the only antidiabetic hormone secreted in the body, regulating carbohydrate metabolism and blood sugar level.'},
  {type:'mcq',q:'Insulin secretion is mainly regulated by:',opts:['Blood calcium level','Blood glucose level','Blood phosphate level','Blood potassium level'],ans:1,exp:'Insulin secretion is mainly regulated by blood glucose level. Other factors like amino acids, lipid derivatives, GI hormones, and autonomic nerve fibers also stimulate insulin secretion.'},
  {type:'mcq',q:'The actions of glucagon are described as:',opts:['Synergistic with insulin','Antagonistic to those of insulin','Identical to those of somatostatin','Identical to those of cortisol'],ans:1,exp:'The actions of glucagon are antagonistic to those of insulin. Glucagon increases blood sugar while insulin decreases it.'},
  {type:'mcq',q:'Somatostatin is also called Growth Hormone Inhibitory Hormone (GHIH) because:',opts:['It stimulates GH from the anterior pituitary','It inhibits secretion of GH and TSH from anterior pituitary','It stimulates TSH release','It inhibits insulin only'],ans:1,exp:'Hypothalamic somatostatin inhibits secretion of GH and TSH from anterior pituitary — that is why it is also called Growth Hormone Inhibitory Hormone (GHIH).'},
  {type:'mcq',q:'Regulation of blood glucose is essential because glucose is the only nutrient utilized by which tissues?',opts:['Muscle, liver, and heart','Brain, retina, and germinal epithelium of gonads','Kidney, spleen, and lungs','Bone, adipose tissue, and skin'],ans:1,exp:'Glucose is the only nutrient utilized for energy by brain tissues, retina, and germinal epithelium of the gonads.'},
  {type:'mcq',q:'The adrenal cortex constitutes what percentage of the adrenal gland?',opts:['20%','50%','80%','90%'],ans:2,exp:'Adrenal cortex is the outer portion constituting 80% of the gland, while adrenal medulla is the central portion constituting 20%.'},
  {type:'mcq',q:'Aldosterone is called the life-saving hormone because total loss of this hormone causes death within:',opts:['1 day','3 days to 2 weeks','1 month','3 months'],ans:1,exp:'Aldosterone is called a life-saving hormone because the total loss of this hormone causes death within 3 days to 2 weeks.'},
  {type:'mcq',q:'Aldosterone contributes to what percentage of total mineralocorticoid activity?',opts:['50%','70%','80%','90%'],ans:3,exp:'90% of mineralocorticoid activity is provided by aldosterone.'},
  {type:'mcq',q:'Cortisol contributes to what percentage of glucocorticoid activity?',opts:['50%','75%','85%','95%'],ans:3,exp:'Cortisol provides 95% of glucocorticoid activity; Corticosterone provides 4%, and Cortisone provides 1%.'},
  {type:'mcq',q:"Cushing\'s syndrome is characterized by obesity and is caused by:",opts:['Deficiency of cortisol','Hypersecretion of glucocorticoids (particularly cortisol)','Tumor in zona glomerulosa','Deficiency of aldosterone'],ans:1,exp:"Cushing\'s syndrome is a disorder characterized by obesity, due to the hypersecretion of glucocorticoids, particularly cortisol."},
  {type:'mcq',q:"Conn\'s syndrome is another name for:",opts:["Cushing\'s syndrome",'Adrenogenital syndrome','Primary hyperaldosteronism due to tumor in zona glomerulosa','Pheochromocytoma'],ans:2,exp:'Primary hyperaldosteronism occurs due to tumor in zona glomerulosa of adrenal cortex and is otherwise known as Conn\'s syndrome.'},
  {type:'mcq',q:'The adrenal medulla forms what percentage of the mass of the adrenal gland?',opts:['10%','20%','30%','40%'],ans:1,exp:'The medulla is the inner part of the adrenal gland and it forms 20% of mass of adrenal gland.'},
  {type:'mcq',q:'Which percentage of chromaffin cells are adrenaline-secreting cells?',opts:['10%','50%','70%','90%'],ans:3,exp:'Chromaffin cells are of two types: Adrenaline secreting cells (90%) and Noradrenaline secreting cells (10%).'},
  {type:'mcq',q:'Catecholamines are synthesized from which amino acid?',opts:['Tryptophan','Phenylalanine (converted to tyrosine)','Tyrosine','Both phenylalanine and tyrosine'],ans:3,exp:'Catecholamines are synthesized from the amino acid tyrosine. They are also formed from phenylalanine, but phenylalanine must be converted into tyrosine first.'},
  {type:'mcq',q:"Noradrenaline is called the 'general vasoconstrictor' because it:",opts:['Dilates all blood vessels via beta receptors','Causes constriction of blood vessels throughout the body via alpha receptors','Only acts on the heart','Decreases total peripheral resistance'],ans:1,exp:'Noradrenaline has strong effects on blood vessels and causes constriction of blood vessels throughout the body via alpha receptors, increasing total peripheral resistance.'},
  {type:'mcq',q:'Which catecholamine has a stronger effect on the heart?',opts:['Noradrenaline','Dopamine','Adrenaline','Both are equal'],ans:2,exp:'Adrenaline has stronger effects on the heart than noradrenaline, increasing heart rate (chronotropic), force of contraction (inotropic), excitability (bathmotropic), and conductivity (dromotropic).'},
  {type:'mcq',q:'Deficiency of dopamine in the basal ganglia produces which nervous disorder?',opts:["Alzheimer\'s disease",'Multiple sclerosis','Parkinsonism','Epilepsy'],ans:2,exp:'Deficiency of dopamine in basal ganglia produces a nervous disorder called Parkinsonism.'},
  {type:'mcq',q:'Pheochromocytoma is a condition characterized by:',opts:['Hypersecretion of cortisol','Deficiency of aldosterone','Hypersecretion of catecholamines','Tumor of the pituitary'],ans:2,exp:'Pheochromocytoma is a condition characterized by hypersecretion of catecholamines.'},
  {type:'mcq',q:'The action of catecholamines on blood pressure requires the presence of:',opts:['Thyroid hormones','Insulin','Glucocorticoids','Parathormone'],ans:2,exp:'The action of catecholamines on blood pressure needs the presence of glucocorticoids (permissive effect). Thus, hypersecretion of catecholamines leads to hypertension.'},
  {type:'mcq',q:'Beta-lipotropin, secreted by the anterior pituitary, functions to:',opts:['Stimulate lactation','Mobilize fat from adipose tissue and promote lipolysis','Inhibit GH release','Stimulate corticosteroid production'],ans:1,exp:'Beta-lipotropin mobilizes fat from adipose tissue and promotes lipolysis.'},
  {type:'mcq',q:"Adrenaline secretion increases during 'fight or flight reactions' after exposure to:",opts:['Sleep','Eating','Stress','Hypercalcemia'],ans:2,exp:"Adrenaline secretion increases during fight or flight reactions after exposure to stress."},
  {type:'mcq',q:'Which of the following DECREASES GH secretion?',opts:['Fasting','Exercise','Hyperglycemia','Initial stages of sleep'],ans:2,exp:'Factors that decrease GH secretion include: hyperglycemia, increase in free fatty acids in blood, and later stages of sleep.'},
  // T/F (60)
  {type:'tf',q:'The endocrine system and the nervous system interact with one another to regulate body functions.',ans:true,exp:'These two systems interact with one another and regulate the body functions.'},
  {type:'tf',q:'Endocrine glands are called ducted glands because hormones pass through ducts before entering the blood.',ans:false,exp:'Endocrine glands are called ductless glands because the hormones secreted by them are released directly into blood without any duct.'},
  {type:'tf',q:'Thyroxine (T4) is chemically classified as a derivative of the amino acid tyrosine.',ans:true,exp:'T4 (thyroxine) and T3 (triiodothyronine) are classified as derivatives of the amino acid tyrosine.'},
  {type:'tf',q:'Protein hormones such as ACTH bind to receptors located in the cytoplasm of target cells.',ans:false,exp:'Protein hormones and catecholamines use membrane receptors (cell membrane), not cytoplasmic receptors. Cytoplasmic receptors are for steroid hormones.'},
  {type:'tf',q:'The hormone-receptor complex can act by altering the permeability of the cell membrane.',ans:true,exp:'The hormone-receptor complex acts by three mechanisms: altering cell membrane permeability, activating intracellular enzymes, and activating genes.'},
  {type:'tf',q:'The anterior pituitary consists of three divisions: pars distalis, pars tuberalis, and pars intermedia.',ans:true,exp:'Anterior pituitary consists of three divisions: Pars distalis, Pars tuberalis, and Pars intermedia.'},
  {type:'tf',q:'Pituicytes of the posterior pituitary are secretory cells that produce ADH and oxytocin.',ans:false,exp:'Pituicytes act as supporting cells and do NOT secrete any hormone. ADH and oxytocin are synthesized in the hypothalamus.'},
  {type:'tf',q:'The posterior pituitary actually synthesizes ADH and oxytocin.',ans:false,exp:'The posterior pituitary does not secrete any hormone. ADH and oxytocin are synthesized in the hypothalamus and transported to the posterior pituitary.'},
  {type:'tf',q:'GnRH from the hypothalamus stimulates the release of both FSH and LH.',ans:true,exp:'Gonadotropin-releasing hormone (GnRH) stimulates the release of the gonadotropins FSH and LH.'},
  {type:'tf',q:'Growth hormone is a steroid hormone secreted by basophils of the anterior pituitary.',ans:false,exp:'GH is a protein hormone secreted by acidophils (somatotrophs) of the anterior pituitary, not basophils.'},
  {type:'tf',q:'GH increases the size and number of cells by increasing mitotic division.',ans:true,exp:'GH is responsible for the growth of almost all tissues of the body and it increases the size and number of cells by increasing mitotic division.'},
  {type:'tf',q:'In males, FSH accelerates the process of spermiogenesis by acting along with testosterone.',ans:true,exp:'In males, FSH acts along with testosterone and accelerates the process of spermiogenesis.'},
  {type:'tf',q:'LH in females is responsible for ovulation and formation of corpus luteum.',ans:true,exp:'LH is responsible for ovulation and is necessary for the formation of corpus luteum in females.'},
  {type:'tf',q:'ADH is transported to the posterior pituitary through blood vessels.',ans:false,exp:'ADH is transported to the posterior pituitary through the nerve fibers of hypothalamo-hypophyseal tract by means of axonic flow.'},
  {type:'tf',q:'Oxytocin in the non-pregnant uterus facilitates transport of sperms through female genital tract during sexual intercourse.',ans:true,exp:'In non-pregnant uterus, oxytocin facilitates the transport of sperms through female genital tract during the sexual intercourse.'},
  {type:'tf',q:'Dwarfism is caused by hypersecretion of GH in early childhood.',ans:false,exp:'Dwarfism is caused by reduction (hyposecretion) in GH secretion in infancy or early childhood, resulting in restricted growth.'},
  {type:'tf',q:'The thyroid gland is larger in females than in males.',ans:true,exp:'Thyroid is larger in females than in males.'},
  {type:'tf',q:'Thyroglobulin is released into the bloodstream along with T3 and T4.',ans:false,exp:'Thyroglobulin itself is NOT released into the bloodstream. Only T3 and T4 are released into the blood.'},
  {type:'tf',q:'Reverse T3 is biologically active and contributes to thyroid hormone effects.',ans:false,exp:'Reverse T3 is biologically inactive.'},
  {type:'tf',q:'Thyroid hormones increase metabolic activities of almost all tissues except brain, retina, spleen, testes, and lungs.',ans:true,exp:'Thyroid hormones increase the metabolic activities of almost all tissues of the body except brain, retina, spleen, testes, and lungs — this is called calorigenic action.'},
  {type:'tf',q:'Hypothyroidism in adults leads to cretinism.',ans:false,exp:'Hypothyroidism leads to myxedema in adults. Cretinism occurs in children with hypothyroidism.'},
  {type:'tf',q:'Thyroid adenoma is a localized tumor that develops in the thyroid tissue and secretes large quantities of thyroid hormones, causing hyperthyroidism.',ans:true,exp:'Thyroid adenoma is a localized tumor that develops in the thyroid tissue and secretes large quantities of thyroid hormones.'},
  {type:'tf',q:'PTH acts on bones, kidneys, and the GI tract to regulate blood calcium.',ans:true,exp:'PTH maintains the blood calcium level and blood phosphate level by acting on: 1. Bones, 2. Kidneys, 3. GI tract.'},
  {type:'tf',q:'High blood phosphate level decreases PTH secretion.',ans:false,exp:'PTH secretion is directly proportional to blood phosphate level. When blood phosphate increases, it combines with ionized calcium, decreasing ionized calcium and thereby stimulating PTH secretion.'},
  {type:'tf',q:'PTH increases the formation of 1,25-dihydroxycholecalciferol (activated vitamin D) in the kidneys.',ans:true,exp:'PTH increases the formation of 1,25-dihydroxycholecalciferol (activated form of vitamin D) in the kidneys, which is necessary for absorption of calcium from the GI tract.'},
  {type:'tf',q:'Calcitonin stimulates osteoclastic activity and facilitates calcium resorption from bones.',ans:false,exp:'Calcitonin stimulates osteoblastic activity and facilitates deposition of calcium on bones, while suppressing osteoclasts and inhibiting resorption of calcium from bones.'},
  {type:'tf',q:'Calcitonin increases the excretion of calcium through urine.',ans:true,exp:'Calcitonin increases the excretion of calcium through urine and prevents reabsorption from renal tubules.'},
  {type:'tf',q:'The human pancreas contains about 1 to 2 million islets of Langerhans.',ans:true,exp:'Human pancreas contains about 1 to 2 million islets.'},
  {type:'tf',q:'F cells (PP cells) in the islets of Langerhans secrete somatostatin.',ans:false,exp:'D cells or delta-cells secrete somatostatin. F cells or PP cells secrete pancreatic polypeptide.'},
  {type:'tf',q:'Insulin facilitates the synthesis and storage of proteins and inhibits the cellular utilization of proteins.',ans:true,exp:'Insulin facilitates the synthesis and storage of proteins, and inhibits the cellular utilization of proteins.'},
  {type:'tf',q:'Glucagon is secreted only from alpha-cells of the pancreatic islets.',ans:false,exp:'Glucagon is secreted from A cells (alpha-cells) in the islets of Langerhans AND also from A cells of stomach and L cells of intestine.'},
  {type:'tf',q:'Somatostatin inhibits the secretion of both glucagon and insulin within the islets of Langerhans.',ans:true,exp:'Somatostatin acts within islets of Langerhans and inhibits alpha- and beta-cells, inhibiting the secretion of both glucagon and insulin.'},
  {type:'tf',q:'Tumor of D cells of islets of Langerhans causes hypoglycemia due to excess somatostatin.',ans:false,exp:'Tumor of D cells causes hypersecretion of somatostatin which leads to hyperglycemia (not hypoglycemia) and other symptoms of diabetes mellitus.'},
  {type:'tf',q:'The adrenal cortex is formed by three distinct layers: zona glomerulosa (outer), zona fasciculata (middle), and zona reticularis (inner).',ans:true,exp:'Adrenal cortex is formed by three distinct layers: 1. Zona glomerulosa — outer layer, 2. Zona fasciculata — middle layer, 3. Zona reticularis — inner layer.'},
  {type:'tf',q:'Glucocorticoids are secreted mainly by zona glomerulosa of the adrenal cortex.',ans:false,exp:'Glucocorticoids are secreted mainly by zona fasciculata of adrenal cortex. Zona glomerulosa secretes mineralocorticoids.'},
  {type:'tf',q:'Aldosterone increases reabsorption of sodium from kidney tubules, and an equal amount of water is also reabsorbed.',ans:true,exp:'Aldosterone increases reabsorption of sodium from kidney tubules with an equal amount of water also reabsorbed, resulting in an increase in ECF volume.'},
  {type:'tf',q:'Cortisol decreases blood glucose by inhibiting gluconeogenesis in the liver.',ans:false,exp:'Cortisol increases blood glucose level by promoting gluconeogenesis in liver and inhibiting tissue utilization — it raises, not lowers, blood glucose.'},
  {type:'tf',q:'Glucocorticoids have anti-inflammatory and immunosuppressive effects.',ans:true,exp:'Glucocorticoids prevent inflammatory changes in injured or infected tissues, and have anti-allergic actions and immunosuppressive effects.'},
  {type:'tf',q:'Dehydroepiandrosterone is the most active adrenal androgen.',ans:true,exp:'Dehydroepiandrosterone is the most active adrenal androgen.'},
  {type:'tf',q:'Adrenogenital syndrome is characterized by the tendency for development of secondary sexual characters of the opposite sex.',ans:true,exp:'Adrenogenital syndrome is characterized by the tendency for the development of secondary sexual character of opposite sex.'},
  {type:'tf',q:'Adrenaline acts mainly through alpha receptors, while noradrenaline acts through both alpha and beta receptors equally.',ans:false,exp:'Adrenaline acts through both alpha and beta receptors equally. Noradrenaline acts mainly through alpha receptors and occasionally through beta receptors.'},
  {type:'tf',q:'Adrenaline increases blood glucose level by increasing glycogenolysis in liver and muscle.',ans:true,exp:'Adrenaline increases the blood glucose level by increasing the glycogenolysis in liver and muscle, so a large quantity of glucose enters the circulation.'},
  {type:'tf',q:'Noradrenaline is considered a calorigenic hormone because it increases basal metabolic rate.',ans:false,exp:'Adrenaline (not noradrenaline) increases basal metabolic rate and is said to be a calorigenic hormone.'},
  {type:'tf',q:'Adrenaline causes bronchodilation via beta2 receptors.',ans:true,exp:'Adrenaline acts on respiration via Beta2 receptors and also causes bronchodilation.'},
  {type:'tf',q:'Dopamine does not affect diastolic blood pressure.',ans:true,exp:'Dopamine does not affect diastolic blood pressure.'},
  {type:'tf',q:'Hypersecretion of catecholamines leads to hypotension.',ans:false,exp:'Hypersecretion of catecholamines leads to hypertension, not hypotension.'},
  {type:'tf',q:'The thyroid gland function increases slightly during pregnancy and lactation.',ans:true,exp:'Thyroid function increases slightly during pregnancy and lactation, and decreases during menopause.'},
  {type:'tf',q:'PTH secretion is inversely proportional to blood phosphate level.',ans:false,exp:'PTH secretion is directly proportional to blood phosphate level (not inversely). PTH secretion is inversely proportional to blood calcium level.'},
  {type:'tf',q:'Iodine and tyrosine are both essential for the formation of thyroid hormones.',ans:true,exp:'Iodine and tyrosine are essential for the formation of thyroid hormones.'},
  {type:'tf',q:'Insulin promotes growth of the body by its anabolic action on proteins.',ans:true,exp:'Insulin promotes growth of body by its anabolic action on proteins.'},
  {type:'tf',q:'Adrenaline increases RBC count in blood by contracting smooth muscles of splenic capsule and releasing RBCs from spleen.',ans:true,exp:'Adrenaline increases RBC count in blood by contracting smooth muscles of splenic capsule and releasing RBCs from spleen into circulation.'},
  {type:'tf',q:'Cortisol stimulates bone formation (osteoblastic activity) and inhibits bone resorption.',ans:false,exp:'Glucocorticoids stimulate bone resorption (osteoclastic activity) and inhibit bone formation and mineralization (osteoblastic activity).'},
  {type:'tf',q:'The parathyroid glands are very small, measuring about 6 mm long, 3 mm wide, and 2 mm thick, with a dark brown color.',ans:true,exp:'Parathyroid glands are very small in size measuring about 6 mm long, 3 mm wide, and 2 mm thick with dark brown color.'},
  {type:'tf',q:'Prolactin-inhibitory hormone (PIH) from the hypothalamus stimulates prolactin secretion.',ans:false,exp:'Prolactin-inhibitory hormone (PIH) inhibits prolactin secretion — it is inhibitory, not stimulatory.'},
  {type:'tf',q:'The adrenal sex hormones are responsible for masculine features of the body.',ans:true,exp:'Adrenal androgens are responsible for masculine features of the body.'},
  {type:'tf',q:'Noradrenaline on salivary glands causes vasoconstriction leading to mild increase in salivary secretion.',ans:true,exp:'Catecholamines on salivary glands cause vasoconstriction in salivary gland leading to mild increase in salivary secretion.'},
  {type:'tf',q:'Adrenaline increases diastolic blood pressure while noradrenaline decreases it.',ans:false,exp:'Adrenaline decreases diastolic blood pressure (by reducing total peripheral resistance), while noradrenaline increases diastolic pressure due to its general vasoconstrictor effect.'},
  {type:'tf',q:'Glucagon also increases the secretion of bile from liver.',ans:true,exp:'Glucagon increases the secretion of bile from liver.'},
  {type:'tf',q:'Thyroid hormones are transported in the blood combined with three types of plasma proteins: TBG, TBPA, and albumin.',ans:true,exp:'Thyroid hormones are transported in the blood in combination with three types of plasma proteins: Thyroxine-binding globulin (TBG), Thyroxine-binding prealbumin (TBPA), and Albumin.'},
  {type:'tf',q:'Somatostatin decreases the motility of the stomach, duodenum, and gallbladder.',ans:true,exp:'Somatostatin decreases the motility of stomach, duodenum and gallbladder.'},
];
